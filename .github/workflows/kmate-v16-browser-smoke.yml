name: K-Mate v16 browser smoke test
on:
  push:
    paths:
      - '.github/workflows/kmate-v16-browser-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install playwright@1.55.0 --no-save --silent
          npx playwright install --with-deps chromium
      - name: Run K-Mate in a local web server
        run: |
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-server.log 2>&1 &
          echo $! >/tmp/kmate-server.pid
      - name: Verify commercial-beta flow
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(`console: ${message.text()}`);
            });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1', null, { timeout: 120000 });

            assert.strictEqual(await page.locator('#goalSelect').count(), 1, 'training-goal selector missing');
            assert.strictEqual(await page.locator('#recommendationCard').count(), 1, 'adaptive recommendation missing');
            assert.strictEqual(await page.locator('#soundToggle').count(), 1, 'sound toggle missing');
            assert.strictEqual(await page.locator('#openPositionImport').count(), 1, 'position importer missing');

            await page.selectOption('#goalSelect', 'tactics');
            await page.check('#blindCalibration');
            await page.click('#openPositionImport');
            assert.strictEqual(await page.locator('#positionImportDialog[open]').count(), 1, 'import dialog did not open');
            await page.click('[data-close="positionImportDialog"]');

            await page.click('#startButton');
            await page.waitForSelector('#gameView:not([hidden])', { timeout: 30000 });
            assert.strictEqual(await page.locator('#board .sq').count(), 64, 'board did not render 64 squares');
            assert.strictEqual((await page.locator('#engineName').textContent()).trim(), 'K-Mate ?', 'blind calibration leaked rating');

            await page.waitForFunction(() => {
              const state = window.__KMATE__?.state?.();
              return state && state.turn === state.userColor;
            }, null, { timeout: 60000 });

            const moved = await page.evaluate(() => {
              const state = window.__KMATE__.state();
              const cls = state.userColor === 'w' ? 'white' : 'black';
              for (const square of document.querySelectorAll('#board .sq')) {
                if (!square.querySelector(`.piece.${cls}`)) continue;
                square.click();
                const target = document.querySelector('#board .sq.legal, #board .sq.capture');
                if (target) {
                  target.click();
                  return true;
                }
              }
              return false;
            });
            assert.ok(moved, 'could not make a legal user move');
            await page.waitForSelector('#moveList .user-move', { timeout: 15000 });
            await page.waitForFunction(() => {
              const badge = document.querySelector('#moveList .user-move .move-rating');
              return badge && !/Analyzing/i.test(badge.textContent);
            }, null, { timeout: 120000 });
            const label = (await page.locator('#moveList .user-move .move-rating').first().textContent()).trim();
            assert.ok(['Best', 'Excellent', 'Good', 'Inaccurate', 'Miss', 'Blunder'].includes(label), `unexpected move label: ${label}`);

            const state = await page.evaluate(() => window.__KMATE__.state());
            assert.strictEqual(state.commercialBeta, true, 'commercial-beta state missing');
            assert.strictEqual(state.reviewEngine, 'Independent Stockfish 18 move review', 'review engine not exposed');

            if (errors.length) throw new Error(errors.join('\n'));
            console.log(JSON.stringify({ ok: true, moveLabel: label, state }, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
