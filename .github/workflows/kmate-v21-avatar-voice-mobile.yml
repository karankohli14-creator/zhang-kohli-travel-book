name: K-Mate v21 coach avatar, voice, and mobile replay
on:
  push:
    paths:
      - '.github/workflows/kmate-v21-avatar-voice-mobile.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Coach K avatar and voice patch
        run: python .github/scripts/kmate_v21_avatar_voice_mobile.py
      - name: Validate application JavaScript and audio
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          import wave
          parts = [Path(f'kmate-trainer/app-v7-part{n}.txt').read_text() for n in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v21-combined.js').write_text(''.join(parts))
          sound = Path('kmate-trainer/sounds/kmate-sounds-v21.wav')
          assert sound.exists() and sound.stat().st_size > 500000, 'v21 audio sprite missing or too small'
          with wave.open(str(sound), 'rb') as wav:
              assert wav.getnchannels() == 2, 'audio must be stereo'
              assert wav.getframerate() == 44100, 'unexpected audio sample rate'
              assert wav.getnframes() / wav.getframerate() > 7.0, 'audio sprite is too short'
          PY
          node --check /tmp/kmate-v21-combined.js
      - name: Validate feature markers
        run: |
          grep -q 'id="coachAvatar"' kmate-trainer/index.html
          grep -q 'id="coachVoiceToggle"' kmate-trainer/index.html
          grep -q 'id="replayWhyText"' kmate-trainer/index.html
          grep -q 'id="replayBestText"' kmate-trainer/index.html
          grep -q 'function speakCoachFrame' kmate-trainer/app-v7-part1.txt
          grep -q 'function decisionShortfall' kmate-trainer/app-v7-part1.txt
          grep -q 'kmate-sounds-v21.wav' kmate-trainer/app-v7-part1.txt
          grep -q 'version: '\''21.0-commercial-beta'\''' kmate-trainer/app-v7-part6.txt
      - name: Install browser test runtime
        run: |
          npm install playwright@1.55.0 --no-save --silent
          npx playwright install --with-deps chromium
      - name: Run K-Mate locally
        run: |
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v21-server.log 2>&1 &
          echo $! >/tmp/kmate-v21-server.pid
      - name: Verify timeout review, Coach K voice, and one-screen mobile layout
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          async function waitForUserTurn(page) {
            await page.waitForFunction(() => {
              const state = window.__KMATE__?.state?.();
              return state && !state.finalized && state.turn === state.userColor;
            }, null, { timeout: 90000 });
          }

          async function makeFirstLegalMove(page) {
            return page.evaluate(() => {
              const state = window.__KMATE__.state();
              const className = state.userColor === 'w' ? 'white' : 'black';
              for (const square of document.querySelectorAll('#board .sq')) {
                if (!square.querySelector(`.piece.${className}`)) continue;
                square.click();
                const target = document.querySelector('#board .sq.legal, #board .sq.capture');
                if (target) {
                  target.click();
                  return true;
                }
              }
              return false;
            });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.addInitScript(() => {
              window.__coachSpeakCalls = [];
              window.__coachCancelCalls = 0;
              class TestUtterance {
                constructor(text) {
                  this.text = text;
                  this.lang = 'en-US';
                  this.rate = 1;
                  this.pitch = 1;
                  this.volume = 1;
                  this.onstart = null;
                  this.onend = null;
                  this.onerror = null;
                }
              }
              const synth = {
                speaking: false,
                pending: false,
                paused: false,
                getVoices: () => [{ name: 'Samantha Test', lang: 'en-US', localService: true }],
                addEventListener: () => {},
                cancel() {
                  window.__coachCancelCalls += 1;
                  this.speaking = false;
                  this.pending = false;
                },
                speak(utterance) {
                  this.speaking = true;
                  window.__coachSpeakCalls.push(utterance.text);
                  utterance.onstart?.();
                  setTimeout(() => {
                    this.speaking = false;
                    utterance.onend?.();
                  }, 850);
                },
              };
              Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
              Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });

              window.__kmateAudioPlayCalls = 0;
              const originalPlay = HTMLMediaElement.prototype.play;
              HTMLMediaElement.prototype.play = function (...args) {
                window.__kmateAudioPlayCalls += 1;
                return originalPlay.apply(this, args);
              };
            });

            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => { if (message.type() === 'error') errors.push(`console: ${message.text()}`); });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1', null, { timeout: 120000 });
            await page.click('#soundToggle');
            await page.waitForFunction(() => window.__KMATE__.state().sound.audibleConfirmed === true, null, { timeout: 30000 });

            await page.click('#startButton');
            await page.waitForSelector('#gameView:not([hidden])', { timeout: 30000 });
            await waitForUserTurn(page);
            assert.ok(await makeFirstLegalMove(page), 'could not make a legal user move');
            await page.waitForFunction(() => window.__KMATE__.state().turn === window.__KMATE__.state().userColor, null, { timeout: 90000 });

            const timeoutResult = await page.evaluate(() => window.__KMATE__.test.forceTimeout(window.__KMATE__.state().userColor));
            assert.strictEqual(timeoutResult, true, 'test timeout could not be triggered');
            await page.waitForSelector('#resultDialog[open]', { timeout: 15000 });
            const timeoutState = await page.evaluate(() => window.__KMATE__.state());
            assert.strictEqual(timeoutState.finalized, true, 'play continued after the clock expired');
            assert.ok(String(timeoutState.reason).startsWith('timeout'), `unexpected timeout reason: ${timeoutState.reason}`);
            assert.strictEqual(await page.locator('#resultInsights').isVisible(), true, 'insights action is missing after timeout');
            assert.strictEqual(await page.locator('#resultReplay').isEnabled(), true, 'coach replay is unavailable after timeout');

            await page.click('#resultReplay');
            await page.waitForSelector('#replayDialog[open]', { timeout: 15000 });
            assert.strictEqual(await page.locator('#replayBoard .sq').count(), 64, 'replay board did not render');
            assert.strictEqual(await page.locator('#coachAvatar svg').count(), 1, 'Coach K avatar did not render');
            assert.strictEqual(await page.locator('#coachVoiceToggle').count(), 1, 'voice toggle is missing');

            // Advance until a user decision is visible.
            for (let attempt = 0; attempt < 5; attempt += 1) {
              if (!(await page.locator('#replayComparison').isHidden())) break;
              if (await page.locator('#replayNext').isDisabled()) break;
              await page.click('#replayNext');
            }
            await page.waitForFunction(() => {
              const comparison = document.querySelector('#replayComparison');
              return comparison && !comparison.hidden;
            }, null, { timeout: 30000 });

            const whyText = (await page.locator('#replayWhyText').textContent()).trim();
            const bestText = (await page.locator('#replayBestText').textContent()).trim();
            assert.ok(whyText.length > 35, `why explanation is too short: ${whyText}`);
            assert.ok(bestText.length > 35, `best-move explanation is too short: ${bestText}`);

            await page.click('#coachSpeakButton');
            await page.waitForFunction(() => window.__coachSpeakCalls.length > 0, null, { timeout: 10000 });
            assert.ok(await page.locator('#coachAvatar').evaluate(el => el.classList.contains('speaking')), 'avatar did not animate while speaking');
            const spoken = await page.evaluate(() => window.__coachSpeakCalls.at(-1));
            assert.ok(spoken.includes('About your move') && spoken.includes('The stronger move'), `spoken review omitted the comparison: ${spoken}`);

            const layout = await page.evaluate(() => {
              const dialog = document.querySelector('#replayDialog');
              const shell = document.querySelector('.replay-shell');
              const board = document.querySelector('#replayBoard');
              const coach = document.querySelector('#replayCoachCard');
              const avatar = document.querySelector('#coachAvatar');
              const piece = document.querySelector('#replayBoard .piece.staunton-piece');
              const square = piece?.closest('.sq');
              const dr = dialog.getBoundingClientRect();
              const br = board.getBoundingClientRect();
              const cr = coach.getBoundingClientRect();
              const ar = avatar.getBoundingClientRect();
              const pr = piece.getBoundingClientRect();
              const sr = square.getBoundingClientRect();
              return {
                dialogTop: dr.top,
                dialogBottom: dr.bottom,
                shellOverflow: shell.scrollHeight - shell.clientHeight,
                boardWidth: br.width,
                boardBottom: br.bottom,
                coachTop: cr.top,
                coachBottom: cr.bottom,
                avatarVisible: ar.width > 45 && ar.bottom <= 844,
                pieceRatio: Math.max(pr.width / sr.width, pr.height / sr.height),
              };
            });
            assert.ok(layout.dialogTop >= -1 && layout.dialogBottom <= 845, `replay dialog exceeds viewport: ${JSON.stringify(layout)}`);
            assert.ok(layout.shellOverflow <= 8, `replay shell requires outer scrolling: ${JSON.stringify(layout)}`);
            assert.ok(layout.boardWidth >= 175 && layout.boardWidth <= 245, `mobile replay board size is wrong: ${JSON.stringify(layout)}`);
            assert.ok(layout.coachTop >= layout.boardBottom - 2 && layout.coachBottom <= 845, `coach and board do not share one field of view: ${JSON.stringify(layout)}`);
            assert.ok(layout.avatarVisible, `coach avatar is not visible in the mobile field: ${JSON.stringify(layout)}`);
            assert.ok(layout.pieceRatio <= 0.67, `replay pieces remain too large: ${JSON.stringify(layout)}`);

            assert.ok((await page.evaluate(() => window.__kmateAudioPlayCalls)) >= 1, 'sampled audio was never invoked');
            if (errors.length) throw new Error(errors.join('\n'));
            console.log(JSON.stringify({ ok: true, timeoutState, whyText, bestText, spoken, layout }, null, 2));
            await page.screenshot({ path: '/tmp/kmate-v21-coach-mobile.png', fullPage: true });
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Commit K-Mate v21
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kmate-trainer/index.html kmate-trainer/styles-v7.css kmate-trainer/app-v7.js kmate-trainer/app-v7-part1.txt kmate-trainer/app-v7-part6.txt kmate-trainer/sounds/kmate-sounds-v21.wav
          git commit -m 'K-Mate v21: Coach K avatar, voice, and compact mobile replay' || exit 0
          git push
