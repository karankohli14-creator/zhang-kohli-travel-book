name: K-Mate v55 hint propagation patch

on:
  push:
    branches: [kmate-coach-ux-v55]
    paths:
      - ".github/workflows/kmate-v55-hint-propagation.yml"

permissions:
  contents: write

jobs:
  patch-hint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: kmate-coach-ux-v55
          fetch-depth: 0

      - name: Keep mirrored hint interactions from closing the hint
        run: python3 .github/scripts/kmate-v55-hint-propagation.py

      - name: Commit the patch and remove temporary files
        run: |
          git rm .github/workflows/kmate-v55-hint-propagation.yml
          git rm .github/scripts/kmate-v55-hint-propagation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kmate-trainer/coach-layout-v55.js
          git commit -m "Keep mirrored hint interactions open"
          git push origin HEAD:kmate-coach-ux-v55
