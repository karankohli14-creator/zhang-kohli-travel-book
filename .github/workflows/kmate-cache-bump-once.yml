name: K-Mate one-time cache bump

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kmate-cache-bump-once.yml"

permissions:
  contents: write

jobs:
  bump-entry-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump the K-Mate application entry URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("kmate-trainer/index.html")
          text = path.read_text()
          old = "./app-v7.js?v=35.6.0"
          new = "./app-v7.js?v=36.0.0"
          if old not in text and new not in text:
              raise SystemExit("Expected K-Mate app script reference was not found")
          path.write_text(text.replace(old, new))
          PY

      - name: Commit the cache-busted entry page
        shell: bash
        run: |
          if git diff --quiet -- kmate-trainer/index.html; then
            echo "K-Mate entry page was already current."
            exit 0
          fi
          git config user.name "K-Mate release bot"
          git config user.email "actions@users.noreply.github.com"
          git add kmate-trainer/index.html
          git commit -m "Bump K-Mate importer build to v36"
          git push origin HEAD:main
