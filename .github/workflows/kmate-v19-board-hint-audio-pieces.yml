name: K-Mate v19 board hint, reliable audio, and vector pieces
on:
  push:
    paths:
      - '.github/workflows/kmate-v19-board-hint-audio-pieces.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply K-Mate v19 patch
        run: python .github/scripts/kmate_v19_board_hint_audio_pieces.py
      - name: Validate assembled application JavaScript
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{n}.txt').read_text() for n in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v19-combined.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v19-combined.js
      - name: Validate requested feature markers
        run: |
          grep -q 'class="hint-card board-hint"' kmate-trainer/index.html
          grep -q 'const VECTOR_PIECES' kmate-trainer/app-v7-part1.txt
          grep -q 'const SOUND_SPRITE_SEGMENTS' kmate-trainer/app-v7-part1.txt
          grep -q 'html-audio-sprite' kmate-trainer/app-v7-part1.txt
          grep -q 'piece.vector-piece' kmate-trainer/styles-v7.css
          grep -q 'version: '\''19.0-commercial-beta'\''' kmate-trainer/app-v7-part6.txt
      - name: Install mobile browser test runtime
        run: |
          npm install playwright@1.55.0 --no-save --silent
          npx playwright install --with-deps chromium
      - name: Run K-Mate locally
        run: |
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v19-server.log 2>&1 &
          echo $! >/tmp/kmate-v19-server.pid
      - name: Verify hint position, sound playback, and vector pieces on mobile
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          async function waitForUserTurn(page) {
            await page.waitForFunction(() => {
              const state = window.__KMATE__?.state?.();
              return state && state.turn === state.userColor;
            }, null, { timeout: 90000 });
          }

          async function makeFirstLegalMove(page) {
            return page.evaluate(() => {
              const state = window.__KMATE__.state();
              const className = state.userColor === 'w' ? 'white' : 'black';
              for (const square of document.querySelectorAll('#board .sq')) {
                if (!square.querySelector(`.piece.${className}`)) continue;
                square.click();
                const target = document.querySelector('#board .sq.legal, #board .sq.capture');
                if (target) {
                  target.click();
                  return true;
                }
              }
              return false;
            });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.addInitScript(() => {
              window.__kmateAudioPlayCalls = 0;
              const original = HTMLMediaElement.prototype.play;
              HTMLMediaElement.prototype.play = function (...args) {
                window.__kmateAudioPlayCalls += 1;
                return original.apply(this, args);
              };
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(`console: ${message.text()}`);
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1', null, { timeout: 120000 });

            // Toggle off and back on so the second tap explicitly unlocks and tests audio.
            await page.click('#soundToggle');
            await page.click('#soundToggle');
            await page.waitForFunction(() => window.__KMATE__?.state?.()?.sound?.unlocked === true, null, { timeout: 30000 });
            let soundState = await page.evaluate(() => window.__KMATE__.state().sound);
            assert.strictEqual(soundState.backend, 'html-audio-sprite', 'reliable HTML audio backend was not selected');
            assert.strictEqual(soundState.enabled, true, 'sound did not remain enabled');

            await page.click('#startButton');
            await page.waitForSelector('#gameView:not([hidden])', { timeout: 30000 });
            await page.waitForSelector('#board .piece.vector-piece svg', { timeout: 30000 });
            assert.strictEqual(await page.locator('#board .sq').count(), 64, 'board did not render 64 squares');
            assert.ok(await page.locator('#board .piece.vector-piece svg').count() >= 10, 'vector chess pieces did not render');

            const layout = await page.evaluate(() => {
              const hint = document.querySelector('#hintCard');
              const board = document.querySelector('#board');
              const boardWrap = document.querySelector('.boardwrap');
              const firstPiece = document.querySelector('#board .piece.vector-piece');
              const firstSquare = firstPiece?.closest('.sq');
              const hintRect = hint.getBoundingClientRect();
              const boardRect = board.getBoundingClientRect();
              const pieceRect = firstPiece.getBoundingClientRect();
              const squareRect = firstSquare.getBoundingClientRect();
              return {
                hintParent: hint.parentElement?.className || '',
                hintBottom: hintRect.bottom,
                boardTop: boardRect.top,
                hintBeforeBoard: Boolean(hint.compareDocumentPosition(boardWrap) & Node.DOCUMENT_POSITION_FOLLOWING),
                ratio: Math.max(pieceRect.width / squareRect.width, pieceRect.height / squareRect.height),
              };
            });
            assert.ok(layout.hintParent.includes('boardcol'), 'hint is not attached to the board column');
            assert.ok(layout.hintBeforeBoard, 'hint does not precede the board');
            assert.ok(layout.hintBottom <= layout.boardTop + 5, 'hint is not directly above the board');
            assert.ok(layout.ratio <= 0.82 && layout.ratio >= 0.55, `piece-to-square ratio is not mobile friendly: ${layout.ratio}`);

            await waitForUserTurn(page);
            const moved = await makeFirstLegalMove(page);
            assert.ok(moved, 'could not make a legal move');
            await page.waitForFunction(() => window.__KMATE__?.state?.()?.sound?.lastKind, null, { timeout: 30000 });
            soundState = await page.evaluate(() => window.__KMATE__.state().sound);
            assert.ok(['move', 'capture', 'check'].includes(soundState.lastKind), `unexpected move sound kind: ${soundState.lastKind}`);
            const playCalls = await page.evaluate(() => window.__kmateAudioPlayCalls);
            assert.ok(playCalls >= 2, `audio play was not invoked enough times: ${playCalls}`);

            await page.screenshot({ path: '/tmp/kmate-v19-mobile.png', fullPage: true });
            if (errors.length) throw new Error(errors.join('\n'));
            console.log(JSON.stringify({ ok: true, layout, soundState, playCalls }, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Commit K-Mate v19
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kmate-trainer/index.html kmate-trainer/styles-v7.css kmate-trainer/app-v7.js kmate-trainer/app-v7-part1.txt kmate-trainer/app-v7-part6.txt
          git commit -m 'K-Mate v19: board hints, reliable audio, and vector pieces' || exit 0
          git push
