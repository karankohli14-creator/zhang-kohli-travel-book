name: K-Mate cache bump v37 (one time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kmate-cache-bump-v37-once.yml"

permissions:
  contents: write

jobs:
  deploy-cache-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump the public K-Mate module URL
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('kmate-trainer/index.html')
          text = page.read_text(encoding='utf-8')
          old = './app-v7.js?v=36.0.0'
          new = './app-v7.js?v=37.0.0'
          if old in text:
              text = text.replace(old, new, 1)
              page.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected K-Mate app module reference was not found')
          PY

      - name: Remove this one-time workflow and publish
        run: |
          rm -f .github/workflows/kmate-cache-bump-v37-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "K-Mate v37 cache reference is already current."
            exit 0
          fi
          git commit -m "Deploy K-Mate importer hardening v37"
          git push origin HEAD:main
