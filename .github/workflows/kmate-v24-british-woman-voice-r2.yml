name: K-Mate v24 British woman voice r2
on:
  push:
    paths:
      - '.github/workflows/kmate-v24-british-woman-voice-r2.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply K-Mate v24 voice update
        run: |
          python -m py_compile .github/scripts/kmate_v24_british_woman_voice.py
          python .github/scripts/kmate_v24_british_woman_voice.py
      - name: Validate JavaScript and voice markers
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v24-r2-combined.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v24-r2-combined.js
          grep -q "BRITISH_WOMAN_PROFILE = 'british-woman'" kmate-trainer/app-v7-part1.txt
          grep -q "voiceProfile: settings.coachVoiceURI === 'british-woman'" kmate-trainer/app-v7-part6.txt
          grep -q 'value="british-woman"' kmate-trainer/index.html
          grep -q "version: '24.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
      - name: Install Playwright API and serve K-Mate
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v24-r2-server.log 2>&1 &
      - name: Verify British woman preference and manual voice override
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.BROWSER_PATH,
              args: ['--no-sandbox'],
            });
            const context = await browser.newContext({ viewport: { width: 1180, height: 900 } });
            await context.addInitScript(() => {
              window.__voiceCalls = [];
              const voices = [
                { name: 'System Robot', lang: 'en-US', voiceURI: 'robot', localService: true },
                { name: 'Daniel Neural', lang: 'en-GB', voiceURI: 'daniel-neural', localService: true },
                { name: 'Ava Premium', lang: 'en-US', voiceURI: 'ava-premium', localService: true },
                { name: 'Sonia Natural', lang: 'en-GB', voiceURI: 'sonia-natural', localService: true },
              ];
              class TestUtterance {
                constructor(text) {
                  this.text = text;
                  this.voice = null;
                  this.lang = '';
                  this.rate = 1;
                  this.pitch = 1;
                  this.volume = 1;
                  this.onstart = null;
                  this.onend = null;
                  this.onerror = null;
                }
              }
              const synth = {
                speaking: false,
                pending: false,
                paused: false,
                getVoices: () => voices,
                addEventListener: () => {},
                cancel() { this.speaking = false; },
                speak(utterance) {
                  this.speaking = true;
                  window.__voiceCalls.push({
                    text: utterance.text,
                    voice: utterance.voice?.name || null,
                    lang: utterance.lang,
                    rate: utterance.rate,
                  });
                  utterance.onstart?.();
                  setTimeout(() => {
                    this.speaking = false;
                    utterance.onend?.();
                  }, 60);
                },
              };
              Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
              Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
              HTMLMediaElement.prototype.play = function () { return Promise.resolve(); };
              HTMLMediaElement.prototype.pause = function () {};
            });

            const page = await context.newPage();
            const fatalErrors = [];
            page.on('pageerror', error => fatalErrors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Failed to load resource') && text.includes('404')) return;
              fatalErrors.push(`console: ${text}`);
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => Boolean(window.__KMATE__?.state), null, { timeout: 120000 });
            await page.waitForFunction(() => document.querySelectorAll('#coachVoiceSelect option').length >= 6);

            let state = await page.evaluate(() => window.__KMATE__.state());
            assert.strictEqual(state.replay.voiceURI, 'british-woman');
            assert.strictEqual(state.replay.voiceProfile, 'generic British woman');
            assert.strictEqual(state.replay.resolvedVoice, 'Sonia Natural');
            assert.strictEqual(await page.locator('#coachVoiceSelect').inputValue(), 'british-woman');
            assert.ok((await page.locator('#coachVoiceSelect option').first().textContent()).includes('British woman'));
            const menuText = await page.locator('#coachVoiceSelect').textContent();
            assert.ok(menuText.includes('Sonia Natural'));
            assert.ok(!/Magnus|Hikaru/i.test(menuText));

            await page.evaluate(() => { window.__voiceCalls = []; window.__KMATE__.test.speakCoach(); });
            await page.waitForFunction(() => window.__voiceCalls.length > 0);
            let spoken = await page.evaluate(() => window.__voiceCalls[0]);
            assert.strictEqual(spoken.voice, 'Sonia Natural');
            assert.strictEqual(spoken.lang, 'en-GB');

            await page.locator('#coachVoiceSelect').evaluate((select) => {
              select.value = 'daniel-neural';
              select.dispatchEvent(new Event('change', { bubbles: true }));
            });
            await page.waitForFunction(() => window.__KMATE__.state().replay.voiceURI === 'daniel-neural');
            await page.evaluate(() => { window.__voiceCalls = []; window.__KMATE__.test.speakCoach(); });
            await page.waitForFunction(() => window.__voiceCalls.length > 0);
            spoken = await page.evaluate(() => window.__voiceCalls[0]);
            assert.strictEqual(spoken.voice, 'Daniel Neural');
            assert.strictEqual(spoken.lang, 'en-GB');

            await page.locator('#coachVoiceSelect').evaluate((select) => {
              select.value = 'british-woman';
              select.dispatchEvent(new Event('change', { bubbles: true }));
            });
            await page.waitForFunction(() => window.__KMATE__.state().replay.voiceURI === 'british-woman');
            state = await page.evaluate(() => window.__KMATE__.state());
            assert.strictEqual(state.replay.resolvedVoice, 'Sonia Natural');
            assert.strictEqual(state.replay.voiceProfile, 'generic British woman');
            if (fatalErrors.length) throw new Error(fatalErrors.join('\n'));

            console.log(JSON.stringify({ ok: true, selected: state.replay, manualOverride: spoken }, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Commit and publish K-Mate v24
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kmate-trainer/index.html kmate-trainer/app-v7.js kmate-trainer/app-v7-part1.txt kmate-trainer/app-v7-part6.txt
          git commit -m 'K-Mate v24: prefer a generic British woman coach voice'
          git pull --rebase origin main
          git push
