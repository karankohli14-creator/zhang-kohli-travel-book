name: K-Mate v21 replay transition debug
on:
  push:
    paths:
      - '.github/workflows/kmate-v21-replay-debug.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v21 in working tree
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/kmate_v21_avatar_voice_mobile.py')
          text = path.read_text().replace(
              'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)',
              'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)',
              1,
          )
          path.write_text(text)
          PY
          python .github/scripts/kmate_v21_avatar_voice_mobile.py
      - name: Install Chromium
        run: |
          npm install playwright@1.55.0 --no-save --silent
          npx playwright install --with-deps chromium
      - name: Serve app
        run: |
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-debug-server.log 2>&1 &
      - name: Log replay frames and transition
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            page.on('console', m => console.log('BROWSER', m.type(), m.text()));
            page.on('pageerror', e => console.log('PAGEERROR', e.message));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1', null, { timeout: 120000 });
            await page.click('#startButton');
            await page.waitForFunction(() => {
              const s = window.__KMATE__?.state?.();
              return s && !s.finalized && s.turn === s.userColor;
            }, null, { timeout: 90000 });
            const moved = await page.evaluate(() => {
              const cls = window.__KMATE__.state().userColor === 'w' ? 'white' : 'black';
              for (const square of document.querySelectorAll('#board .sq')) {
                if (!square.querySelector(`.piece.${cls}`)) continue;
                square.click();
                const target = document.querySelector('#board .sq.legal, #board .sq.capture');
                if (target) { target.click(); return true; }
              }
              return false;
            });
            assert.ok(moved);
            const beforeTimeout = await page.evaluate(() => window.__KMATE__.state());
            console.log('BEFORE_TIMEOUT', JSON.stringify(beforeTimeout));
            await page.evaluate(() => window.__KMATE__.test.forceTimeout(window.__KMATE__.state().userColor));
            await page.waitForSelector('#resultDialog[open]');
            console.log('AFTER_TIMEOUT', JSON.stringify(await page.evaluate(() => window.__KMATE__.state())));
            console.log('REPLAY_DISABLED', await page.locator('#resultReplay').isDisabled());
            await page.click('#resultReplay');
            await page.waitForSelector('#replayDialog[open]');
            console.log('REPLAY_OPEN', JSON.stringify(await page.evaluate(() => window.__KMATE__.state().replay)));
            console.log('NEXT_DISABLED', await page.locator('#replayNext').isDisabled());
            console.log('COMPARISON_HIDDEN_START', await page.locator('#replayComparison').isHidden());
            console.log('COACH_START', await page.locator('#replayCoachText').textContent());
            if (!(await page.locator('#replayNext').isDisabled())) await page.click('#replayNext');
            await page.waitForTimeout(500);
            console.log('REPLAY_AFTER_NEXT', JSON.stringify(await page.evaluate(() => window.__KMATE__.state().replay)));
            console.log('COMPARISON_HIDDEN_AFTER', await page.locator('#replayComparison').isHidden());
            console.log('COACH_AFTER', await page.locator('#replayCoachText').textContent());
            console.log('WHY_AFTER', await page.locator('#replayWhyText').textContent());
            console.log('BEST_AFTER', await page.locator('#replayBestText').textContent());
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
