name: K-Mate v35.5 iPhone Coach Review safe area

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kmate-v35-5-iphone-safe-area.yml'
      - '.github/scripts/kmate_v35_5_iphone_safe_area_patch.py'
      - '.github/scripts/kmate_v35_5_iphone_safe_area_verify.js'

permissions:
  contents: write

concurrency:
  group: kmate-v35-5-iphone-safe-area
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply K-Mate v35.5 safe-area patch
        run: |
          python -m py_compile .github/scripts/kmate_v35_5_iphone_safe_area_patch.py
          python .github/scripts/kmate_v35_5_iphone_safe_area_patch.py

      - name: Validate patched source
        run: |
          grep -q "K-Mate v35.5 — iPhone-safe Coach Review frame" kmate-trainer/styles-v7.css
          grep -q "styles-v7.css?v=35.5.0" kmate-trainer/index.html
          grep -q "review-v35-4.js?v=35.5.0" kmate-trainer/index.html
          node --check .github/scripts/kmate_v35_5_iphone_safe_area_verify.js
          node --check kmate-trainer/app-v7.js
          node --check kmate-trainer/appflow-v35.js
          node --check kmate-trainer/review-v35-4.js

      - name: Install WebKit
        run: |
          npm install playwright@1.55.0 --no-save --silent
          npx playwright install --with-deps webkit

      - name: Verify an iPhone-sized review locally
        run: |
          python3 -m http.server 4173 --directory . >/tmp/kmate-v35-5-server.log 2>&1 &
          node .github/scripts/kmate_v35_5_iphone_safe_area_verify.js

      - name: Commit the verified app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kmate-trainer/styles-v7.css kmate-trainer/index.html
          if git diff --cached --quiet; then
            echo "K-Mate v35.5 is already applied."
          else
            git commit -m "Keep iPhone Coach Review below the status bar"
            git push origin HEAD:main
          fi

      - name: Wait for GitHub Pages to serve v35.5
        env:
          PUBLIC_ROOT: https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer
        run: |
          for attempt in $(seq 1 42); do
            html="$(curl -fsSL "$PUBLIC_ROOT/?safe-area=v35.5-$GITHUB_RUN_ID-$attempt" || true)"
            css="$(curl -fsSL "$PUBLIC_ROOT/styles-v7.css?v=35.5.0&run=$GITHUB_RUN_ID-$attempt" || true)"
            if printf '%s' "$html" | grep -q "styles-v7.css?v=35.5.0" && printf '%s' "$css" | grep -q "K-Mate v35.5 — iPhone-safe Coach Review frame"; then
              echo "GitHub Pages is serving K-Mate v35.5."
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not expose K-Mate v35.5 in time."
          exit 1

      - name: Verify the public site in iPhone WebKit
        env:
          KMATE_URL: https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/?safe-area=v35.5-public-${{ github.run_id }}
        run: node .github/scripts/kmate_v35_5_iphone_safe_area_verify.js
