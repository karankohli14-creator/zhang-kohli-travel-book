name: K-Mate v30 persistent balanced Live Coach
on:
  push:
    paths:
      - '.github/workflows/kmate-v30-persistent-balanced-live-coach.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply persistent balanced Live Coach redesign
        run: |
          python -m py_compile .github/scripts/kmate_v30_persistent_balanced_live_coach.py
          python .github/scripts/kmate_v30_persistent_balanced_live_coach.py
          rm -f .github/workflows/kmate-v29-inline-live-coach.yml

      - name: Validate assembled application
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v30.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v30.js
          grep -q "version: '30.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q 'id="liveCoachPauseBanner"' kmate-trainer/index.html
          grep -q 'id="liveCoachReplayHighlightsButton"' kmate-trainer/index.html
          grep -q '>Resume game<' kmate-trainer/index.html
          grep -q 'function markLiveCoachAnalysisSlow' kmate-trainer/app-v7-part1.txt
          grep -q 'function replayLiveCoachBoardHighlights' kmate-trainer/app-v7-part1.txt
          grep -q 'autoResume: false' kmate-trainer/app-v7-part6.txt
          grep -q 'grid-template-columns:minmax(0,1fr) minmax(0,1fr)' kmate-trainer/styles-v7.css
          grep -q 'grid-template-rows:minmax(0,1fr) minmax(0,1fr)' kmate-trainer/styles-v7.css
          ! grep -q 'continueAfterLiveCoach({ automatic: true })' kmate-trainer/app-v7-part1.txt

      - name: Install Playwright and serve K-Mate
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v30-server.log 2>&1 &

      - name: Verify persistence, manual resume, and 50-50 mobile layout
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.BROWSER_PATH,
              args: ['--no-sandbox', '--autoplay-policy=no-user-gesture-required'],
            });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.addInitScript(() => {
              const voices = [{ name: 'Sonia Natural', lang: 'en-GB', voiceURI: 'sonia-natural', localService: true }];
              class TestUtterance {
                constructor(text) { this.text = text; this.voice = null; this.lang = ''; this.rate = 1; this.pitch = 1; this.volume = 1; this.onstart = null; this.onend = null; this.onerror = null; }
              }
              const synth = {
                speaking: false,
                getVoices: () => voices,
                addEventListener: () => {},
                cancel() { this.speaking = false; },
                speak(utterance) {
                  this.speaking = true;
                  utterance.onstart?.();
                  setTimeout(() => { this.speaking = false; utterance.onend?.(); }, 30);
                },
              };
              Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
              Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
            });

            const page = await context.newPage();
            page.setDefaultTimeout(120000);
            const fatalErrors = [];
            page.on('pageerror', error => fatalErrors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Failed to load resource') && text.includes('404')) return;
              fatalErrors.push(`console: ${text}`);
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1');

            const demo = await page.evaluate(() => window.__KMATE__.test.startTeachingDemo());
            assert.ok(demo.paused);
            await page.waitForSelector('#principlesDialog[open]');
            await page.click('#principlesStartButton');
            await page.waitForFunction(() => !window.__KMATE__.state().principleReviewPending);

            await page.click('#board .sq[data-square="e2"]');
            await page.click('#board .sq[data-square="e4"]');
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.awaiting && window.__KMATE__.state().clockPaused);
            assert.ok(await page.evaluate(() => window.__KMATE__.test.forceLiveCoachSlowState()));
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.slowNoticeShown);
            let state = await page.evaluate(() => window.__KMATE__.state());
            assert.ok(state.clockPaused);
            assert.ok(state.liveCoach.panelVisible);
            assert.strictEqual(state.liveCoach.autoResume, false);
            assert.ok((await page.locator('#liveCoachPauseText').textContent()).includes('No automatic countdown'));

            const injected = await page.evaluate(() => window.__KMATE__.test.forceLiveCoachIntervention());
            assert.ok(injected && injected.bestMove);
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.open);
            await page.waitForTimeout(1450);
            state = await page.evaluate(() => window.__KMATE__.state());
            assert.ok(state.liveCoach.open);
            assert.ok(state.liveCoach.panelVisible);
            assert.ok(state.clockPaused);

            const inspection = await page.evaluate(() => {
              const board = document.querySelector('#board').getBoundingClientRect();
              const panel = document.querySelector('#liveCoachBoardPanel').getBoundingClientRect();
              const stage = document.querySelector('#boardCoachStage').getBoundingClientRect();
              const resume = document.querySelector('#liveCoachContinueButton').getBoundingClientRect();
              const panelStyle = getComputedStyle(document.querySelector('#liveCoachBoardPanel'));
              return {
                board: { width: board.width, height: board.height, top: board.top, bottom: board.bottom },
                panel: { width: panel.width, height: panel.height, top: panel.top, bottom: panel.bottom, overflowY: panelStyle.overflowY },
                stage: { width: stage.width, height: stage.height },
                resume: { text: document.querySelector('#liveCoachContinueButton').textContent.trim(), top: resume.top, bottom: resume.bottom },
                ratio: board.height / panel.height,
                arrows: document.querySelectorAll('#board .live-coach-board-arrows line').length,
                pauseBanner: document.querySelector('#liveCoachPauseBanner').textContent.trim(),
                noOverflow: document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1,
              };
            });

            assert.strictEqual(inspection.resume.text, 'Resume game');
            assert.ok(inspection.ratio >= 0.80 && inspection.ratio <= 1.20, inspection);
            assert.ok(inspection.board.width >= 215, inspection);
            assert.ok(inspection.panel.width > 330, inspection);
            assert.ok(inspection.arrows >= 2, inspection);
            assert.ok(inspection.pauseBanner.includes('Review at your own pace'), inspection);
            assert.ok(inspection.pauseBanner.includes('paused'), inspection);
            assert.ok(inspection.noOverflow, inspection);

            await page.click('#liveCoachReplayHighlightsButton');
            assert.ok(await page.locator('#board').evaluate(board => board.classList.contains('replay-live-coach-highlights')));

            await page.click('#liveCoachContinueButton');
            await page.waitForFunction(() => !window.__KMATE__.state().liveCoach.open && !window.__KMATE__.state().clockPaused);
            const after = await page.evaluate(() => ({
              hidden: document.querySelector('#liveCoachBoardPanel').hidden,
              active: document.querySelector('#gameView').classList.contains('live-coach-active'),
              clockPaused: window.__KMATE__.state().clockPaused,
            }));
            assert.ok(after.hidden, after);
            assert.ok(!after.active, after);
            assert.ok(!after.clockPaused, after);

            if (fatalErrors.length) throw new Error(fatalErrors.join('\n'));
            console.log(JSON.stringify({ ok: true, inspection, after }, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit and publish K-Mate v30
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v30: persistent 50-50 Live Coach review'
          git push
