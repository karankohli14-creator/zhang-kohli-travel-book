name: K-Mate v42 boot diagnostic
on:
  push:
    paths:
      - '.github/workflows/kmate-v42-boot-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Make v42 builder compatible with current v41 initializer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/kmate_v42_deep_start_fix.py')
          text = path.read_text()
          old = '''part6 = replace_once(
              part6,
              "bindControls();\\nsyncGameViewportLayout();",
              "bindControls();\\ninstallGeneratePositionActivationFallback();\\nsyncGameViewportLayout();",
              "activation fallback initialization",
          )'''
          new = '''if "bindControls();\\ninstallGeneratePositionActivationFallback();\\nsyncGameViewportLayout();" not in part6:
              part6 = replace_once(
                  part6,
                  "bindControls();\\nsyncGameViewportLayout();",
                  "bindControls();\\ninstallGeneratePositionActivationFallback();\\nsyncGameViewportLayout();",
                  "activation fallback initialization",
              )'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('v42 initializer marker missing')
          path.write_text(text)
          PY
          python .github/scripts/kmate_v42_deep_start_fix.py

      - name: Validate and serve
        run: |
          node --check kmate-v42/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-v42/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v42.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v42.js
          python3 -m http.server 4173 --directory . >/tmp/kmate-v42-diagnostic-server.log 2>&1 &
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:4173/kmate-v42/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kmate-v42-diagnostic-server.log
          exit 1

      - name: Install Playwright API
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"

      - name: Dump boot state and failures
        run: node .github/scripts/kmate_v42_boot_diagnostic.js
