name: K-Mate v15 move-list ratings
on:
  push:
    paths:
      - '.github/workflows/kmate-v15-move-list-ratings.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply move-list rating patch
        run: python .github/scripts/kmate_v15_move_list_ratings.py
      - name: Validate assembled application JavaScript
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{n}.txt').read_text() for n in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v15-combined.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v15-combined.js
      - name: Confirm requested labels and sounds
        run: |
          grep -q "label: 'Best'" kmate-trainer/app-v7-part1.txt
          grep -q "label: 'Excellent'" kmate-trainer/app-v7-part1.txt
          grep -q "label: 'Good'" kmate-trainer/app-v7-part1.txt
          grep -q "label: 'Inaccurate'" kmate-trainer/app-v7-part1.txt
          grep -q "label: 'Miss'" kmate-trainer/app-v7-part1.txt
          grep -q "label: 'Blunder'" kmate-trainer/app-v7-part1.txt
          grep -q "playMoveSound" kmate-trainer/app-v7-part1.txt
          grep -q "move-rating" kmate-trainer/app-v7-part2.txt
      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kmate-trainer/index.html kmate-trainer/styles-v7.css kmate-trainer/app-v7.js kmate-trainer/app-v7-part1.txt kmate-trainer/app-v7-part2.txt kmate-trainer/app-v7-part3.txt
          git commit -m 'K-Mate v15: rate moves beside notation' || exit 0
          git push
