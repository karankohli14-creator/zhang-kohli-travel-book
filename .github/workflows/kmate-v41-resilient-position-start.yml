name: K-Mate v41 resilient position start
on:
  push:
    paths:
      - '.github/workflows/kmate-v41-resilient-position-start.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply K-Mate v41
        run: |
          python -m py_compile .github/scripts/kmate_v41_resilient_start.py
          python .github/scripts/kmate_v41_resilient_start.py
          rm -f .github/workflows/kmate-v40-warm-setup-start-navigation.yml
          rm -f .github/workflows/kmate-v40-warm-setup-start-navigation-r2.yml
          rm -f .github/workflows/kmate-v40-warm-setup-start-navigation-r3.yml
          rm -f .github/workflows/kmate-v40-warm-setup-start-navigation-r4.yml

      - name: Add deterministic localhost recovery test hook
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('kmate-trainer/app-v7-part6.txt')
          text = path.read_text()
          marker = """  window.__KMATE__.test = {
              testCoachVoice: () => testCoachVoice(),"""
          replacement = """  window.__KMATE__.test = {
              injectInvalidQueuedPosition: () => {
                queuedCustomPosition = {
                  id: 'invalid-start-recovery-test', custom: false, generated: false,
                  phase: 'middlegame', opening: 'Recovery test', rating: 1600,
                  title: 'Invalid recovery test', theme: 'Recovery', tags: ['calculation'],
                  fen: 'this is not a valid fen', description: 'Intentional localhost-only recovery test.',
                };
                return true;
              },
              testCoachVoice: () => testCoachVoice(),"""
          if marker not in text:
              raise SystemExit('Local test hook marker missing')
          path.write_text(text.replace(marker, replacement, 1))
          PY

      - name: Validate assembled application
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v41.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v41.js
          grep -q "version: '41.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q "function repairGeneratedPositionCache" kmate-trainer/app-v7-part1.txt
          grep -q "function safeCuratedRecoveryPosition" kmate-trainer/app-v7-part1.txt
          grep -q "window.__KMATE_GENERATE_POSITION__ = handleGeneratePosition" kmate-trainer/app-v7-part1.txt
          grep -q "installGeneratePositionActivationFallback" kmate-trainer/app-v7-part6.txt
          grep -q 'onclick="window.__KMATE_GENERATE_POSITION__' kmate-trainer/index.html
          grep -q 'K-Mate v41' kmate-trainer/styles-v7.css

      - name: Install Playwright and serve K-Mate
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v41-server.log 2>&1 &

      - name: Verify Generate position always opens the board
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          function speechMock() {
            window.__speechCalls = [];
            const voices = [{ name: 'Serena Enhanced', lang: 'en-GB', voiceURI: 'serena-enhanced', localService: true }];
            class TestUtterance {
              constructor(text) {
                this.text = text; this.voice = null; this.lang = ''; this.rate = 1; this.pitch = 1; this.volume = 1;
                this.onstart = null; this.onend = null; this.onerror = null;
              }
            }
            const synth = {
              speaking: false, pending: false,
              getVoices: () => voices, addEventListener: () => {}, resume() {},
              cancel() { this.speaking = false; this.pending = false; },
              speak(utterance) {
                window.__speechCalls.push(utterance.text);
                this.speaking = true;
                utterance.onstart?.();
                setTimeout(() => { this.speaking = false; utterance.onend?.(); }, 20);
              },
            };
            Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
            Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
          }

          function corruptLegacyCache() {
            const invalid = Array.from({ length: 18 }, (_, index) => ({
              id: `legacy-invalid-${index}`,
              fen: index % 2 ? 'not a fen' : '8/8/8/8/8/8/8/8 w - - 0 1',
              seedId: 'london-mid-1600',
              phase: 'middlegame',
              opening: 'London System',
              rating: 1600,
              depth: 8,
            }));
            localStorage.setItem('kmate-generation-tree-v23', JSON.stringify(invalid));
            localStorage.setItem('kmate-generated-v23', JSON.stringify(['not a fen', '8/8/8/8/8/8/8/8 w - - 0 1']));
          }

          function collectErrors(page) {
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.stack || error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Failed to load resource') && text.includes('404')) return;
              errors.push(`console: ${text}`);
            });
            return errors;
          }

          async function openApp(browser, { viewport, corrupt = false, userAgent = null } = {}) {
            const context = await browser.newContext({
              viewport,
              ...(userAgent ? { userAgent } : {}),
            });
            await context.addInitScript(speechMock);
            if (corrupt) await context.addInitScript(corruptLegacyCache);
            const page = await context.newPage();
            page.setDefaultTimeout(60000);
            const errors = collectErrors(page);
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1' && window.__KMATE__?.state && window.__KMATE__?.test);
            return { context, page, errors };
          }

          async function reachGenerateButton(page) {
            await page.click('#introProceedButton');
            await page.click('#challengeNextButton');
            await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'coach');
            await page.waitForTimeout(120);
            const button = await page.evaluate(() => {
              const element = document.querySelector('#startButton');
              const rect = element.getBoundingClientRect();
              return {
                disabled: element.disabled,
                text: element.textContent.trim(),
                visible: rect.width > 0 && rect.height > 0,
                activationFallback: element.dataset.activationFallback,
              };
            });
            assert.ok(!button.disabled && button.text === 'Generate position' && button.visible, JSON.stringify(button));
            assert.strictEqual(button.activationFallback, '1', JSON.stringify(button));
          }

          async function assertBoardOpened(page, label) {
            await page.waitForFunction(() => document.body.classList.contains('game-mode') && !document.querySelector('#gameView').hidden && window.__KMATE__.state().current);
            await page.waitForFunction(() => document.querySelectorAll('#board .piece').length > 0);
            const snapshot = await page.evaluate(() => {
              const state = window.__KMATE__.state();
              const board = document.querySelector('#board').getBoundingClientRect();
              return {
                version: window.__KMATE__.version,
                current: state.current,
                fen: state.fen,
                phase: state.phase,
                pieces: document.querySelectorAll('#board .piece').length,
                gameMode: document.body.classList.contains('game-mode'),
                gameHidden: document.querySelector('#gameView').hidden,
                start: state.start,
                cacheRepair: state.generator.cacheRepair,
                board: { top: board.top, bottom: board.bottom, width: board.width },
                viewportHeight: window.innerHeight,
                scrollY: window.scrollY,
                errorText: document.querySelector('#loadError')?.textContent?.trim() || '',
                speechCalls: window.__speechCalls.slice(),
              };
            });
            console.log(label, JSON.stringify(snapshot));
            assert.strictEqual(snapshot.version, '41.0-commercial-beta', JSON.stringify(snapshot));
            assert.ok(snapshot.current && snapshot.fen && snapshot.gameMode && !snapshot.gameHidden, JSON.stringify(snapshot));
            assert.ok(snapshot.pieces >= 2, JSON.stringify(snapshot));
            assert.ok(snapshot.board.top >= 0 && snapshot.board.bottom <= snapshot.viewportHeight + 1, JSON.stringify(snapshot));
            assert.strictEqual(snapshot.scrollY, 0, JSON.stringify(snapshot));
            assert.strictEqual(snapshot.errorText, '', JSON.stringify(snapshot));
            assert.ok(!snapshot.speechCalls.some(text => /coach voice ready/i.test(text)), JSON.stringify(snapshot));
            return snapshot;
          }

          async function verifyLegacyCacheRepair(browser) {
            const { context, page, errors } = await openApp(browser, { viewport: { width: 1440, height: 900 }, corrupt: true });
            await reachGenerateButton(page);
            await page.click('#startButton');
            const snapshot = await assertBoardOpened(page, 'LEGACY_CACHE_START');
            assert.ok(snapshot.cacheRepair.removed >= 18, JSON.stringify(snapshot));
            assert.strictEqual(snapshot.start.error, null, JSON.stringify(snapshot));
            if (errors.length) throw new Error(errors.join('\n'));
            await context.close();
            return snapshot;
          }

          async function verifyAutomaticRecovery(browser) {
            const { context, page, errors } = await openApp(browser, { viewport: { width: 1365, height: 820 } });
            await reachGenerateButton(page);
            await page.evaluate(() => window.__KMATE__.test.injectInvalidQueuedPosition());
            await page.click('#startButton');
            const snapshot = await assertBoardOpened(page, 'AUTOMATIC_RECOVERY_START');
            assert.ok(snapshot.start.recovery, JSON.stringify(snapshot));
            assert.ok(/curated seed/i.test(snapshot.start.recovery.action), JSON.stringify(snapshot));
            assert.strictEqual(snapshot.start.error, null, JSON.stringify(snapshot));
            if (errors.length) throw new Error(errors.join('\n'));
            await context.close();
            return snapshot;
          }

          async function verifyTouchActivation(browser) {
            const { context, page, errors } = await openApp(browser, {
              viewport: { width: 390, height: 844 },
              corrupt: true,
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148',
            });
            await reachGenerateButton(page);
            await page.evaluate(() => {
              const button = document.querySelector('#startButton');
              button.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, pointerType: 'touch', isPrimary: true }));
            });
            const snapshot = await assertBoardOpened(page, 'TOUCH_START');
            assert.ok(snapshot.cacheRepair.removed >= 18, JSON.stringify(snapshot));
            if (errors.length) throw new Error(errors.join('\n'));
            await context.close();
            return snapshot;
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.BROWSER_PATH,
              args: ['--no-sandbox', '--autoplay-policy=no-user-gesture-required'],
            });
            try {
              const legacy = await verifyLegacyCacheRepair(browser);
              const recovery = await verifyAutomaticRecovery(browser);
              const touch = await verifyTouchActivation(browser);
              console.log(JSON.stringify({ ok: true, legacy, recovery, touch }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit and publish K-Mate v41
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v41: guarantee Generate position opens the game board'
          git pull --rebase origin main
          git push
