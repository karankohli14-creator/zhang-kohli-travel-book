name: K-Mate v42 unfreeze coaching screen
on:
  push:
    paths:
      - '.github/workflows/kmate-v42-unfreeze-coaching-screen.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply K-Mate v42
        run: |
          python -m py_compile .github/scripts/kmate_v42_unfreeze_coaching_screen.py
          python .github/scripts/kmate_v42_unfreeze_coaching_screen.py
          rm -f .github/workflows/kmate-v41-webkit-freeze-diagnostic.yml
          rm -f .github/workflows/kmate-v41-public-smoke.yml
          rm -f .github/workflows/kmate-v41-resilient-position-start.yml

      - name: Validate assembled application
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v42.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v42.js
          grep -q "version: '42.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q "function closeSetupBlockingDialogs" kmate-trainer/app-v7-part1.txt
          grep -q "NON-MODAL" kmate-trainer/app-v7-part1.txt
          grep -q "function ensureSetupPageInteractive" kmate-trainer/app-v7-part6.txt
          grep -q "K-Mate v42" kmate-trainer/styles-v7.css
          grep -q "setup-supplement-hidden" kmate-trainer/styles-v7.css

      - name: Install browser test dependencies
        run: |
          npm install playwright@1.55.0 --no-save --silent
          CHROMIUM_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$CHROMIUM_PATH"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
          npx playwright install --with-deps webkit
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v42-server.log 2>&1 &

      - name: Verify coaching setup remains interactive in Chromium and WebKit
        run: |
          node <<'NODE'
          const { chromium, webkit, devices } = require('playwright');
          const assert = require('assert');

          function installSpeechMock() {
            const voices = [{ name: 'Serena Enhanced', lang: 'en-GB', voiceURI: 'serena-enhanced', localService: true }];
            class TestUtterance {
              constructor(text) { this.text = text; this.onstart = null; this.onend = null; this.onerror = null; }
            }
            const synth = {
              speaking: false,
              getVoices: () => voices,
              addEventListener: () => {},
              resume() {},
              cancel() { this.speaking = false; },
              speak(u) { this.speaking = true; u.onstart?.(); setTimeout(() => { this.speaking = false; u.onend?.(); }, 20); },
            };
            Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
            Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
          }

          async function openReady(browserType, name, launchOptions = {}) {
            const browser = await browserType.launch({ headless: true, ...launchOptions });
            const context = await browser.newContext({
              ...devices['iPhone 14'],
              viewport: { width: 390, height: 844 },
            });
            await context.addInitScript(installSpeechMock);
            const page = await context.newPage();
            page.setDefaultTimeout(90000);
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.stack || error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Failed to load resource') && text.includes('404')) return;
              errors.push(`console: ${text}`);
            });
            await page.goto('http://127.0.0.1:4173/?v=42-test', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1' && window.__KMATE__?.state);
            return { browser, context, page, errors, name };
          }

          async function centerHit(page, selector) {
            return page.evaluate(selector => {
              const element = document.querySelector(selector);
              const rect = element?.getBoundingClientRect();
              if (!element || !rect) return null;
              const x = rect.left + rect.width / 2;
              const y = rect.top + rect.height / 2;
              const hit = document.elementFromPoint(x, y);
              return {
                selector,
                rect: { left: rect.left, top: rect.top, right: rect.right, bottom: rect.bottom, width: rect.width, height: rect.height },
                hit: hit ? { tag: hit.tagName, id: hit.id, cls: hit.className } : null,
                ownsHit: Boolean(hit && (hit === element || element.contains(hit) || hit.contains(element))),
                pointerEvents: getComputedStyle(element).pointerEvents,
                disabled: Boolean(element.disabled),
                inert: Boolean(element.inert || element.closest('[inert]')),
              };
            }, selector);
          }

          async function verify(browserType, name, launchOptions = {}) {
            const { browser, context, page, errors } = await openReady(browserType, name, launchOptions);
            try {
              await page.click('#introProceedButton');
              await page.click('#challengeNextButton');
              await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'coach');
              await page.waitForTimeout(180);

              // The complete page, including native checkboxes and footer buttons,
              // must be actual hit-test targets rather than a picture behind an overlay.
              const selectors = ['#coachBackButton', '#blindCalibration', '#autoHints', '#principleReview', '#liveCoach', '#liveCoachVoice', '#startButton'];
              const hits = {};
              for (const selector of selectors) {
                hits[selector] = await centerHit(page, selector);
                assert.ok(hits[selector], `${name}: missing ${selector}`);
                assert.ok(hits[selector].ownsHit, `${name}: ${selector} is covered: ${JSON.stringify(hits[selector])}`);
                assert.strictEqual(hits[selector].pointerEvents, 'auto', `${name}: ${selector} pointer-events`);
                assert.ok(!hits[selector].inert, `${name}: ${selector} is inert`);
              }

              const initialPrinciples = await page.isChecked('#principleReview');
              await page.click('#principleReview');
              assert.notStrictEqual(await page.isChecked('#principleReview'), initialPrinciples, `${name}: principle checkbox did not toggle`);
              // Ensure principle review is ON for the exact previously freezing path.
              if (!(await page.isChecked('#principleReview'))) await page.click('#principleReview');

              const initialCoach = await page.isChecked('#liveCoach');
              await page.click('#liveCoach');
              assert.notStrictEqual(await page.isChecked('#liveCoach'), initialCoach, `${name}: Live Coach checkbox did not toggle`);

              await page.click('#coachBackButton');
              await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'challenge');
              await page.click('#challengeNextButton');
              await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'coach');

              // Reproduce a stale invisible modal from a prior session. Entering the
              // coaching page must close it and restore all controls.
              await page.evaluate(() => {
                const stale = document.querySelector('#voiceCloneDialog');
                try { stale.showModal(); } catch { stale.setAttribute('open', ''); }
                document.querySelector('#coachBackButton').click();
              });
              await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'challenge');
              await page.evaluate(() => {
                const stale = document.querySelector('#voiceCloneDialog');
                try { stale.showModal(); } catch { stale.setAttribute('open', ''); }
                document.querySelector('#challengeNextButton').click();
              });
              await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'coach');
              const staleState = await page.evaluate(() => ({
                open: [...document.querySelectorAll('dialog[open]')].map(dialog => dialog.id),
                inert: Boolean(document.querySelector('.setup-flow-page.active')?.inert || document.querySelector('.setup-flow-page.active')?.closest('[inert]')),
              }));
              assert.deepStrictEqual(staleState.open, [], `${name}: stale modal remained open: ${JSON.stringify(staleState)}`);
              assert.ok(!staleState.inert, `${name}: coach page remained inert`);

              if (!(await page.isChecked('#principleReview'))) await page.click('#principleReview');
              await page.click('#startButton');
              await page.waitForFunction(() => document.body.classList.contains('game-mode') && document.querySelector('#principlesDialog')?.open, null, { timeout: 30000 });
              await page.waitForTimeout(180);

              const principleState = await page.evaluate(() => {
                const dialog = document.querySelector('#principlesDialog');
                const button = document.querySelector('#principlesStartButton');
                const rect = dialog.getBoundingClientRect();
                let modal = false;
                try { modal = dialog.matches(':modal'); } catch {}
                const buttonRect = button.getBoundingClientRect();
                const hit = document.elementFromPoint(buttonRect.left + buttonRect.width / 2, buttonRect.top + buttonRect.height / 2);
                return {
                  open: dialog.open,
                  modal,
                  className: dialog.className,
                  rect: { left: rect.left, top: rect.top, right: rect.right, bottom: rect.bottom, width: rect.width, height: rect.height },
                  buttonHit: hit ? { tag: hit.tagName, id: hit.id, cls: hit.className } : null,
                  buttonOwnsHit: Boolean(hit && (hit === button || button.contains(hit) || hit.contains(button))),
                  setup: window.__KMATE__.state().setupFlow,
                  pieces: document.querySelectorAll('#board .piece').length,
                };
              });
              assert.ok(principleState.open, `${name}: principles screen did not open`);
              assert.ok(!principleState.modal, `${name}: principles screen incorrectly made the app inert`);
              assert.ok(principleState.rect.width >= 380 && principleState.rect.height >= 700, `${name}: principles screen is not visible`);
              assert.ok(principleState.buttonOwnsHit, `${name}: Start clock is covered: ${JSON.stringify(principleState)}`);
              assert.ok(principleState.pieces >= 2, `${name}: board was not prepared behind principles screen`);

              await page.click('#principlesStartButton');
              await page.waitForFunction(() => !document.querySelector('#principlesDialog')?.open && document.body.classList.contains('game-mode'));
              const started = await page.evaluate(() => ({
                gameMode: document.body.classList.contains('game-mode'),
                dialogOpen: document.querySelector('#principlesDialog').open,
                pieces: document.querySelectorAll('#board .piece').length,
                clockPaused: window.__KMATE__.state().clockPaused,
                scrollY: window.scrollY,
                scrollHeight: document.documentElement.scrollHeight,
                viewportHeight: window.innerHeight,
              }));
              assert.ok(started.gameMode && !started.dialogOpen && started.pieces >= 2, `${name}: positional play did not start: ${JSON.stringify(started)}`);
              assert.ok(!started.clockPaused, `${name}: clock stayed paused`);
              assert.strictEqual(started.scrollY, 0, `${name}: document moved`);
              assert.ok(started.scrollHeight <= started.viewportHeight + 2, `${name}: gameplay scrolls`);

              if (errors.length) throw new Error(`${name}: ${errors.join('\n')}`);
              console.log(JSON.stringify({ name, hits, staleState, principleState, started }, null, 2));
            } finally {
              await context.close();
              await browser.close();
            }
          }

          (async () => {
            await verify(chromium, 'Chromium', { executablePath: process.env.CHROMIUM_PATH, args: ['--no-sandbox', '--autoplay-policy=no-user-gesture-required'] });
            await verify(webkit, 'WebKit');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit and publish K-Mate v42
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v42: unfreeze coaching setup and make principle review nonmodal'
          git pull --rebase origin main
          git push
