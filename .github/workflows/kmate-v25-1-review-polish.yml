name: K-Mate v25.1 review polish
on:
  push:
    paths:
      - '.github/workflows/kmate-v25-1-review-polish.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply K-Mate v25.1 update
        run: |
          python -m py_compile .github/scripts/kmate_v25_1_review_polish.py
          python .github/scripts/kmate_v25_1_review_polish.py
      - name: Validate assembled application
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v25-1-combined.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v25-1-combined.js
          grep -q 'async function extendPrincipalVariation' kmate-trainer/app-v7-part1.txt
          grep -q "version: '25.1-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q "?v=20260828-25-1" kmate-trainer/app-v7-part1.txt
      - name: Install Playwright API and serve K-Mate
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v25-1-server.log 2>&1 &
      - name: Verify richer line, strict UCI handling, and replay cleanup
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await chromium.launch({ headless: true, executablePath: process.env.BROWSER_PATH, args: ['--no-sandbox'] });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.addInitScript(() => {
              const voices = [{ name: 'Sonia Natural', lang: 'en-GB', voiceURI: 'sonia-natural', localService: true }];
              class TestUtterance {
                constructor(text) { this.text = text; this.voice = null; this.lang = ''; this.rate = 1; this.pitch = 1; this.volume = 1; this.onstart = null; this.onend = null; this.onerror = null; }
              }
              const synth = {
                speaking: false, getVoices: () => voices, addEventListener: () => {}, cancel() { this.speaking = false; },
                speak(utterance) { this.speaking = true; utterance.onstart?.(); setTimeout(() => { this.speaking = false; utterance.onend?.(); }, 25); },
              };
              Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
              Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
              HTMLMediaElement.prototype.play = function () { return Promise.resolve(); };
              HTMLMediaElement.prototype.pause = function () {};
            });
            const page = await context.newPage();
            const fatalErrors = [];
            page.on('pageerror', error => fatalErrors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Failed to load resource') && text.includes('404')) return;
              fatalErrors.push(`console: ${text}`);
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1', null, { timeout: 120000 });

            const invalid = await page.evaluate(() => window.__KMATE__.test.repairMoveRecord({ uci: '(none)', bestMove: '(none)', cpLoss: 500, quality: 'blunder' }));
            assert.notStrictEqual(invalid.exactBest, true);

            const result = await page.evaluate(() => window.__KMATE__.test.openBestLineDemo());
            assert.strictEqual(result.analysis.cpLoss, 0);
            assert.strictEqual(result.analysis.bestMove, result.discovery.move);
            assert.ok(result.analysis.bestLine.length >= 4, `expected a multi-move line, got ${result.analysis.bestLine.length}`);

            await page.waitForSelector('#replayDialog[open]');
            await page.waitForSelector('#replayBestLineButton:not([hidden])');
            await page.click('#replayBestLineButton');
            await page.waitForFunction(() => window.__KMATE__.state().replay.bestLineIndex >= 2, null, { timeout: 15000 });
            const state = await page.evaluate(() => window.__KMATE__.state());
            assert.ok(state.replay.bestLineFrames >= 5);
            assert.ok(await page.locator('#replayBestLineStatus').isVisible());
            assert.ok(await page.locator('#replayBoard .best-line-preview-square').count() >= 1);

            const bodyScroll = await page.evaluate(() => document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1);
            assert.ok(bodyScroll, 'mobile replay introduced horizontal overflow');
            if (fatalErrors.length) throw new Error(fatalErrors.join('\n'));
            console.log(JSON.stringify({ ok: true, bestLineLength: result.analysis.bestLine.length, replay: state.replay }, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Commit and publish K-Mate v25.1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kmate-trainer/index.html kmate-trainer/app-v7.js kmate-trainer/app-v7-part1.txt kmate-trainer/app-v7-part6.txt
          git commit -m 'K-Mate v25.1: strengthen best-line replay and review guards'
          git pull --rebase origin main
          git push
