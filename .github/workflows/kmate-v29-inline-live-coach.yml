name: K-Mate v29 inline live coach
on:
  push:
    paths:
      - '.github/workflows/kmate-v29-inline-live-coach.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply inline Live Coach redesign
        run: |
          python -m py_compile .github/scripts/kmate_v29_inline_live_coach.py
          python .github/scripts/kmate_v29_inline_live_coach.py
          rm -f .github/workflows/kmate-v28-live-coach-principles-crisp-sound-r6.yml

      - name: Validate assembled application
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v29.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v29.js
          grep -q "version: '29.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q 'id="liveCoachBoardPanel"' kmate-trainer/index.html
          grep -q 'id="boardCoachStage"' kmate-trainer/index.html
          grep -q 'function renderLiveCoachBoardArrows' kmate-trainer/app-v7-part1.txt
          grep -q 'function renderLiveCoachPending' kmate-trainer/app-v7-part1.txt
          grep -q 'live-coach-active' kmate-trainer/styles-v7.css
          grep -q 'live-played-to' kmate-trainer/styles-v7.css
          grep -q 'live-best-to' kmate-trainer/styles-v7.css
          ! grep -q 'id="liveCoachDialog"' kmate-trainer/index.html
          ! grep -q "openDialog('liveCoachDialog')" kmate-trainer/app-v7-part1.txt

      - name: Install Playwright and serve K-Mate
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v29-server.log 2>&1 &

      - name: Verify board remains visible during inline coaching on mobile
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.BROWSER_PATH,
              args: ['--no-sandbox', '--autoplay-policy=no-user-gesture-required'],
            });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.addInitScript(() => {
              const voices = [{ name: 'Sonia Natural', lang: 'en-GB', voiceURI: 'sonia-natural', localService: true }];
              class TestUtterance {
                constructor(text) { this.text = text; this.voice = null; this.lang = ''; this.rate = 1; this.pitch = 1; this.volume = 1; this.onstart = null; this.onend = null; this.onerror = null; }
              }
              const synth = {
                speaking: false,
                getVoices: () => voices,
                addEventListener: () => {},
                cancel() { this.speaking = false; },
                speak(utterance) {
                  this.speaking = true;
                  utterance.onstart?.();
                  setTimeout(() => { this.speaking = false; utterance.onend?.(); }, 30);
                },
              };
              Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
              Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
            });

            const page = await context.newPage();
            page.setDefaultTimeout(120000);
            const fatalErrors = [];
            page.on('pageerror', error => fatalErrors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Failed to load resource') && text.includes('404')) return;
              fatalErrors.push(`console: ${text}`);
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1');
            assert.strictEqual(await page.locator('#liveCoachDialog').count(), 0);

            const demo = await page.evaluate(() => window.__KMATE__.test.startTeachingDemo());
            assert.ok(demo.paused);
            await page.waitForSelector('#principlesDialog[open]');
            await page.click('#principlesStartButton');
            await page.waitForFunction(() => !window.__KMATE__.state().principleReviewPending);

            await page.click('#board .sq[data-square="e2"]');
            await page.click('#board .sq[data-square="e4"]');
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.awaiting && window.__KMATE__.state().clockPaused);
            await page.waitForSelector('#liveCoachBoardPanel:not([hidden])');

            const injected = await page.evaluate(() => window.__KMATE__.test.forceLiveCoachIntervention());
            assert.ok(injected && injected.bestMove);
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.open);
            await page.waitForTimeout(120);

            const inspection = await page.evaluate(() => {
              const board = document.querySelector('#board').getBoundingClientRect();
              const panel = document.querySelector('#liveCoachBoardPanel').getBoundingClientRect();
              const stage = document.querySelector('#boardCoachStage').getBoundingClientRect();
              const playedLabels = document.querySelectorAll('#board .live-coach-square-label.played').length;
              const bestLabels = document.querySelectorAll('#board .live-coach-square-label.best').length;
              const arrows = document.querySelectorAll('#board .live-coach-board-arrows line').length;
              return {
                board: { width: board.width, height: board.height, top: board.top, bottom: board.bottom },
                panel: { width: panel.width, height: panel.height, top: panel.top, bottom: panel.bottom },
                stage: { width: stage.width, height: stage.height },
                gameActive: document.querySelector('#gameView').classList.contains('live-coach-active'),
                panelHidden: document.querySelector('#liveCoachBoardPanel').hidden,
                playedLabels,
                bestLabels,
                arrows,
                rating: document.querySelector('#liveCoachRating').textContent.trim(),
                bestMove: document.querySelector('#liveCoachBestMove').textContent.trim(),
                whyLength: document.querySelector('#liveCoachWhy').textContent.trim().length,
                bestLength: document.querySelector('#liveCoachBestText').textContent.trim().length,
                noOverflow: document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1,
              };
            });

            assert.ok(inspection.gameActive, inspection);
            assert.ok(!inspection.panelHidden, inspection);
            assert.strictEqual(inspection.rating, 'Blunder');
            assert.ok(inspection.board.width >= 185 && inspection.board.width <= 275, inspection);
            assert.ok(inspection.panel.width > 300, inspection);
            assert.ok(inspection.playedLabels >= 1, inspection);
            assert.ok(inspection.bestLabels >= 1, inspection);
            assert.ok(inspection.arrows >= 2, inspection);
            assert.ok(inspection.bestMove.length >= 2, inspection);
            assert.ok(inspection.whyLength > 30, inspection);
            assert.ok(inspection.bestLength > 30, inspection);
            assert.ok(inspection.noOverflow, inspection);

            await page.click('#liveCoachContinueButton');
            await page.waitForFunction(() => !window.__KMATE__.state().liveCoach.open && !window.__KMATE__.state().clockPaused);
            const after = await page.evaluate(() => ({
              hidden: document.querySelector('#liveCoachBoardPanel').hidden,
              active: document.querySelector('#gameView').classList.contains('live-coach-active'),
              arrows: document.querySelectorAll('#board .live-coach-board-arrows line').length,
            }));
            assert.ok(after.hidden, after);
            assert.ok(!after.active, after);
            assert.strictEqual(after.arrows, 0, after);

            if (fatalErrors.length) throw new Error(fatalErrors.join('\n'));
            console.log(JSON.stringify({ ok: true, inspection, after }, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit and publish K-Mate v29
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v29: keep Live Coach on the board'
          git push
