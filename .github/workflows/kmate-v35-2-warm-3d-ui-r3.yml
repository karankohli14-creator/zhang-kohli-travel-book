name: K-Mate v35.2 warm 3D interface r3

on:
  push:
    paths:
      - '.github/workflows/kmate-v35-2-warm-3d-ui-r3.yml'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply warm dimensional interface and button sounds
        run: |
          grep -q "FLOW_VERSION = '35.1-app-flow'" kmate-trainer/appflow-v35.js
          python -m py_compile .github/scripts/kmate_v35_2_warm_3d_ui.py
          python .github/scripts/kmate_v35_2_warm_3d_ui.py
          python -m py_compile .github/scripts/kmate_v35_2_ui_sound_diagnostics.py
          python .github/scripts/kmate_v35_2_ui_sound_diagnostics.py
          python -m py_compile .github/scripts/kmate_v35_2_verify_wait_patch.py
          python .github/scripts/kmate_v35_2_verify_wait_patch.py
          node --check kmate-trainer/appflow-v35.js
          node --check kmate-trainer/app-v7.js
          cat kmate-trainer/app-v7-part{1,2,3,4,5,6}.txt > /tmp/kmate-v35-module.js
          node --check /tmp/kmate-v35-module.js
          grep -q "FLOW_VERSION = '35.2-warm-3d'" kmate-trainer/appflow-v35.js
          grep -q "playUiWoodTap" kmate-trainer/appflow-v35.js
          grep -q "styles-v7.css?v=35.2.0" kmate-trainer/index.html

      - name: Install Chromium and WebKit
        run: |
          npm install playwright@1.55.0 --no-save --silent
          npx playwright install --with-deps chromium webkit

      - name: Verify desktop and phone interface locally
        run: |
          python3 -m http.server 4173 --directory . >/tmp/kmate-v35-2-r3-server.log 2>&1 &
          node .github/scripts/kmate_v35_2_warm_ui_verify.js

      - name: Commit and publish verified K-Mate v35.2
        run: |
          rm -f .github/workflows/kmate-v35-2-warm-3d-ui.yml
          rm -f .github/workflows/kmate-v35-2-warm-3d-ui-r2.yml
          rm -f .github/workflows/kmate-v35-2-warm-3d-ui-r3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v35.2: warm 3D controls, bottom actions, and UI sounds'
          git pull --rebase origin main
          git push

      - name: Wait for GitHub Pages to serve v35.2
        run: |
          for attempt in $(seq 1 100); do
            flow="$(curl -fsSL "https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/appflow-v35.js?verify=$RANDOM" || true)"
            page="$(curl -fsSL "https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/?verify=$RANDOM" || true)"
            if printf '%s' "$flow" | grep -q "35.2-warm-3d" && printf '%s' "$page" | grep -q "styles-v7.css?v=35.2.0"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify deployed public app in phone WebKit
        env:
          KMATE_PUBLIC_URL: https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/?ui=v35-2-public-r3
        run: node .github/scripts/kmate_v35_2_warm_ui_verify.js
