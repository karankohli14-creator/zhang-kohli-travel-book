name: K-Mate v55 dialog home position patch

on:
  push:
    branches: [kmate-coach-ux-v55]
    paths:
      - ".github/workflows/kmate-v55-dialog-home.yml"

permissions:
  contents: write

jobs:
  patch-dialog-home:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: kmate-coach-ux-v55
          fetch-depth: 0

      - name: Move K-Mate home away from dialog close controls
        run: python3 .github/scripts/kmate-v55-dialog-home.py

      - name: Commit the patch and remove temporary files
        run: |
          git rm .github/workflows/kmate-v55-dialog-home.yml
          git rm .github/scripts/kmate-v55-dialog-home.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kmate-trainer/coach-layout-v55.css
          git commit -m "Keep dialog home clear of close controls"
          git push origin HEAD:kmate-coach-ux-v55
