name: K-Mate v10 strength and mobile patch
on:
  push:
    paths:
      - '.github/workflows/kmate-v10-strength-mobile.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch K-Mate v10
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new))

          # Versioned assets + opponent slider.
          replace('kmate-trainer/index.html', './styles-v7.css?v=9.0.0', './styles-v7.css?v=10.0.0')
          replace('kmate-trainer/index.html', 'id="opponentRating" type="range" min="1000" max="2200" step="100" value="1600"', 'id="opponentRating" type="range" min="1000" max="3500" step="100" value="1600"')
          replace('kmate-trainer/index.html', 'Opponent play now uses Stockfish 18 with its limited-strength Elo setting from 1320 upward. Ratings remain training approximations rather than official FIDE or Chess.com ratings; move-quality analysis is still a local estimate.', 'Opponent play uses Stockfish 18. The 1000–2200 band is deliberately strength-boosted to better match online rapid feel; 2300–3500 progressively approaches unrestricted engine play. 3500 means MAX engine strength, not an official human Elo.')

          # Stronger user-facing descriptors.
          replace('kmate-trainer/app-v7-part1.txt', "  if (rating <= 2000) return 'Highly accurate tactical and positional resistance.';\n  return 'Master-style calculation with very few deliberate errors.';", "  if (rating <= 2000) return 'Highly accurate tactical and positional resistance.';\n  if (rating <= 2200) return 'Very strong master-style resistance — substantially boosted from the previous calibration.';\n  if (rating <= 2600) return 'Engine-strength play with deep tactical reliability.';\n  if (rating <= 3000) return 'Near-maximal engine resistance.';\n  if (rating < 3500) return 'Elite engine resistance with extended calculation.';\n  return 'MAX Stockfish strength — unrestricted engine play.';")
          replace('kmate-trainer/app-v7-part1.txt', "  $('#opponentValue').textContent = settings.opponentRating;", "  $('#opponentValue').textContent = settings.opponentRating >= 3500 ? '3500 · MAX' : settings.opponentRating;")

          # Stockfish calibration: boost 1000–2200 across the full native UCI_Elo range,
          # then use unrestricted Stockfish above 2200. Higher tiers also receive more think time.
          replace('kmate-trainer/app-v7-part6.txt', "    const requested = Math.max(1000, Math.min(2200, Number(rating) || 1600));\n    if (requested >= STOCKFISH_MIN_ELO) {\n      this.send('setoption name Skill Level value 20');\n      this.send('setoption name UCI_LimitStrength value true');\n      this.send(`setoption name UCI_Elo value ${Math.max(STOCKFISH_MIN_ELO, Math.min(STOCKFISH_MAX_ELO, requested))}`);\n    } else {\n      const skill = Math.max(0, Math.min(4, Math.round((requested - 1000) / 65)));\n      this.send('setoption name UCI_LimitStrength value false');\n      this.send(`setoption name Skill Level value ${skill}`);\n    }", "    const requested = Math.max(1000, Math.min(3500, Number(rating) || 1600));\n    if (requested <= 2200) {\n      // Re-map the UI scale across Stockfish's entire native limited-Elo range.\n      // This intentionally makes 1600–2200 much stronger than K-Mate v9.\n      const mapped = Math.round(STOCKFISH_MIN_ELO + ((requested - 1000) / 1200) * (STOCKFISH_MAX_ELO - STOCKFISH_MIN_ELO));\n      this.send('setoption name Skill Level value 20');\n      this.send('setoption name UCI_LimitStrength value true');\n      this.send(`setoption name UCI_Elo value ${Math.max(STOCKFISH_MIN_ELO, Math.min(STOCKFISH_MAX_ELO, mapped))}`);\n    } else {\n      this.send('setoption name UCI_LimitStrength value false');\n      this.send('setoption name Skill Level value 20');\n    }")
          replace('kmate-trainer/app-v7-part6.txt', "      this.send(`go movetime ${Math.max(120, Math.round(movetime || 600))}`);", "      const requested = Math.max(1000, Math.min(3500, Number(rating) || 1600));\n      const baseTime = Math.max(120, Math.round(movetime || 600));\n      const maxTierTime = requested > 2200 ? Math.round(500 + (requested - 2200) * 2.7) : baseTime;\n      const thinkTime = Math.max(baseTime, maxTierTime);\n      this.send(`go movetime ${thinkTime}`);")
          replace('kmate-trainer/app-v7-part6.txt', "      const bestMoveLine = this.waitFor((line) => line.startsWith('bestmove '), Math.max(15000, movetime + 12000));", "      const requestedForTimeout = Math.max(1000, Math.min(3500, Number(rating) || 1600));\n      const maxThinkForTimeout = requestedForTimeout > 2200 ? Math.round(500 + (requestedForTimeout - 2200) * 2.7) : (movetime || 600);\n      const bestMoveLine = this.waitFor((line) => line.startsWith('bestmove '), Math.max(18000, maxThinkForTimeout + 12000));")

          # Mobile board: smaller pieces, tighter bars, more board breathing room.
          p = Path('kmate-trainer/styles-v7.css')
          s = p.read_text()
          s = s.replace('.piece{font-size:clamp(35px,11.2vw,60px)}', '.piece{font-size:clamp(27px,8.4vw,40px);transform:translateY(-1%) scale(.94)}')
          s = s.replace('  .playerbar{min-height:59px}', '  .playerbar{min-height:52px;padding:6px 8px}')
          s = s.replace('  .clock{min-width:82px;font-size:22px}', '  .clock{min-width:72px;padding:6px 8px;font-size:19px}')
          s = s.replace('  .boardwrap{padding:4px}', '  .boardwrap{padding:2px}')
          mobile_extra = "\n  .avatar{width:34px;height:34px;border-radius:10px;font-size:22px}\n  .identity{gap:7px}\n  .identity small{display:none}\n  .playtop h1{font-size:24px}\n  .board{border-radius:6px}\n  .coord{font-size:8px}\n  .coord.rank{left:2px;top:2px}\n  .coord.file{right:2px;bottom:2px}\n  .status{min-height:44px;margin-top:7px;padding:8px 10px;font-size:12px}\n"
          marker = '  .result-grid{grid-template-columns:1fr 1fr}\n}'
          if marker not in s:
              raise SystemExit('Mobile CSS marker missing')
          s = s.replace(marker, '  .result-grid{grid-template-columns:1fr 1fr}' + mobile_extra + '}')
          p.write_text(s)

          # Bust part and position caches.
          p = Path('kmate-trainer/app-v7.js')
          s = p.read_text().replace("./positions-v7.js?v=9.0.0", "./positions-v7.js?v=10.0.0").replace(".txt?v=9.0.0", ".txt?v=10.0.0")
          p.write_text(s)

      - name: Validate JavaScript syntax
        run: |
          node --check kmate-trainer/app-v7.js
          cat kmate-trainer/app-v7-part{1..6}.txt > /tmp/kmate-v10-combined.js
          node --check /tmp/kmate-v10-combined.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kmate-trainer/index.html kmate-trainer/styles-v7.css kmate-trainer/app-v7.js kmate-trainer/app-v7-part1.txt kmate-trainer/app-v7-part6.txt
          git commit -m 'K-Mate v10: stronger engine tiers and mobile board' || exit 0
          git push
