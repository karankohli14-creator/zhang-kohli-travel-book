name: Prepare K-Mate v44 loader

on:
  push:
    branches: [kmate-svg-board-v44]
    paths:
      - ".github/workflows/kmate-svg-board-v44-prepare.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out v44 branch
        uses: actions/checkout@v4
        with:
          ref: kmate-svg-board-v44
          fetch-depth: 0

      - name: Point the public page at v44
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('kmate-trainer/index.html')
          text = path.read_text()
          old = 'app-v7.js?v=43.0.0'
          new = 'app-v7.js?v=44.0.0'
          if old not in text and new not in text:
              raise SystemExit('Expected K-Mate loader was not found.')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit the loader update
        run: |
          git config user.name "K-Mate release bot"
          git config user.email "actions@users.noreply.github.com"
          git add kmate-trainer/index.html
          if git diff --cached --quiet; then
            echo "Loader already points at v44."
            exit 0
          fi
          git commit -m "Point K-Mate page at v44"
          git pull --rebase origin kmate-svg-board-v44
          git push origin HEAD:kmate-svg-board-v44
