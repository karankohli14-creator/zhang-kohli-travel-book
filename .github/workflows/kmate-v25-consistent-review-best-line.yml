name: K-Mate v25 consistent review and best line
on:
  push:
    paths:
      - '.github/workflows/kmate-v25-consistent-review-best-line.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply K-Mate v25 update
        run: |
          python -m py_compile .github/scripts/kmate_v25_consistent_review_best_line.py
          python .github/scripts/kmate_v25_consistent_review_best_line.py
      - name: Validate assembled application and feature markers
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v25-combined.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v25-combined.js
          grep -q 'go ${rootClause}movetime' kmate-trainer/app-v7-part1.txt
          grep -q 'equal-time-root-restricted' kmate-trainer/app-v7-part1.txt
          grep -q 'sameUciMove(selectedMove, bestMove)' kmate-trainer/app-v7-part1.txt
          grep -q 'id="replayBestLineButton"' kmate-trainer/index.html
          grep -q 'replay-best-line-status' kmate-trainer/styles-v7.css
          grep -q "version: '25.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
      - name: Install Playwright API and serve K-Mate
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v25-server.log 2>&1 &
      - name: Verify exact-best consistency and animated continuation
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.BROWSER_PATH,
              args: ['--no-sandbox'],
            });
            const context = await browser.newContext({ viewport: { width: 1180, height: 900 } });
            await context.addInitScript(() => {
              const voices = [{ name: 'Sonia Natural', lang: 'en-GB', voiceURI: 'sonia-natural', localService: true }];
              class TestUtterance {
                constructor(text) {
                  this.text = text; this.voice = null; this.lang = ''; this.rate = 1; this.pitch = 1; this.volume = 1;
                  this.onstart = null; this.onend = null; this.onerror = null;
                }
              }
              const synth = {
                speaking: false,
                getVoices: () => voices,
                addEventListener: () => {},
                cancel() { this.speaking = false; },
                speak(utterance) {
                  this.speaking = true;
                  utterance.onstart?.();
                  setTimeout(() => { this.speaking = false; utterance.onend?.(); }, 30);
                },
              };
              Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
              Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
              HTMLMediaElement.prototype.play = function () { return Promise.resolve(); };
              HTMLMediaElement.prototype.pause = function () {};
            });

            const page = await context.newPage();
            const fatalErrors = [];
            page.on('pageerror', error => fatalErrors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Failed to load resource') && text.includes('404')) return;
              fatalErrors.push(`console: ${text}`);
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1', null, { timeout: 120000 });

            const repaired = await page.evaluate(() => window.__KMATE__.test.repairMoveRecord({
              id: 'synthetic',
              uci: 'e2e4',
              bestMove: 'e2e4',
              cpLoss: 549,
              quality: 'blunder',
              bestScore: 38,
              selectedScore: -511,
              bestLine: ['e2e4', 'e7e5'],
            }));
            assert.strictEqual(repaired.cpLoss, 0);
            assert.strictEqual(repaired.quality, 'best');
            assert.strictEqual(repaired.effectiveLoss, 0);
            assert.strictEqual(repaired.band.key, 'best');
            assert.strictEqual(repaired.exactBest, true);

            const result = await page.evaluate(() => window.__KMATE__.test.analyzeBestMove());
            assert.ok(result.discovery.move, 'Stockfish did not return a best move');
            assert.strictEqual(result.analysis.bestMove, result.discovery.move);
            assert.strictEqual(result.analysis.cpLoss, 0);
            assert.strictEqual(result.analysis.exactBest, true);
            assert.strictEqual(result.analysis.analysisConsistency, 'exact-engine-match');
            assert.ok(result.analysis.bestLine.length >= 1);
            assert.strictEqual(result.analysis.bestLine[0], result.discovery.move);
            assert.ok(result.frames.length >= 2, 'No playable best-line frames were produced');

            await page.evaluate(() => window.__KMATE__.test.openBestLineDemo());
            await page.waitForSelector('#replayDialog[open]');
            await page.waitForSelector('#replayBestLineButton:not([hidden])');
            const rating = (await page.locator('#replayRating').textContent()).trim();
            assert.strictEqual(rating, 'Best');

            await page.click('#replayBestLineButton');
            await page.waitForFunction(() => {
              const replay = window.__KMATE__.state().replay;
              return replay.bestLineIndex >= 1;
            }, null, { timeout: 15000 });
            assert.ok(await page.locator('#replayBestLineStatus').isVisible());
            assert.ok((await page.locator('#replayBestLineStatus').textContent()).includes('Best line'));
            assert.ok(await page.locator('#replayBoard .best-line-preview-square').count() >= 1);
            const replayState = await page.evaluate(() => window.__KMATE__.state().replay);
            assert.ok(replayState.bestLineFrames >= 2);

            if (fatalErrors.length) throw new Error(fatalErrors.join('\n'));
            console.log(JSON.stringify({ ok: true, repaired, analysis: result.analysis, replay: replayState }, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Commit and publish K-Mate v25
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kmate-trainer/index.html kmate-trainer/styles-v7.css kmate-trainer/app-v7.js kmate-trainer/app-v7-part1.txt kmate-trainer/app-v7-part6.txt
          git commit -m 'K-Mate v25: fix contradictory ratings and animate best line'
          git pull --rebase origin main
          git push
