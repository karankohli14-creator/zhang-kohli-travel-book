name: K-Mate v35.6 all-screen iPhone safe area r5

on:
  push:
    paths:
      - '.github/workflows/kmate-v35-6-all-screen-safe-area.yml'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply K-Mate v35.6 all-screen safe areas
        run: |
          python -m py_compile .github/scripts/kmate_v35_6_all_screens_safe_area_patch.py
          python .github/scripts/kmate_v35_6_all_screens_safe_area_patch.py

      - name: Validate patched source
        run: |
          grep -q 'apple-mobile-web-app-status-bar-style" content="black"' kmate-trainer/index.html
          grep -q 'safe-area-v35-6.css?v=35.6.0' kmate-trainer/index.html
          grep -q 'styles-v7.css?v=35.6.0' kmate-trainer/index.html
          grep -q 'review-v35-4.js?v=35.6.0' kmate-trainer/index.html
          grep -q 'K-Mate v35.6 — every iPhone screen' kmate-trainer/safe-area-v35-6.css
          grep -q '#positionImportDialog' kmate-trainer/safe-area-v35-6.css
          grep -q '#aboutBetaDialog' kmate-trainer/safe-area-v35-6.css
          grep -q '#promotionDialog' kmate-trainer/safe-area-v35-6.css
          grep -q '#resultDialog' kmate-trainer/safe-area-v35-6.css
          grep -q '#principlesDialog.kmate-principles-v354' kmate-trainer/safe-area-v35-6.css
          grep -q '#replayDialog.replay-modal' kmate-trainer/safe-area-v35-6.css
          grep -q '#voiceCloneDialog' kmate-trainer/safe-area-v35-6.css
          node --check kmate-trainer/app-v7.js
          node --check kmate-trainer/appflow-v35.js
          node --check kmate-trainer/review-v35-4.js
          node --check .github/scripts/kmate_v35_6_all_screens_safe_area_verify.js

      - name: Install iPhone WebKit test browser
        run: |
          npm install playwright@1.55.0 --no-save --silent
          npx playwright install --with-deps webkit

      - name: Isolate toast animation from its safe-area geometry check
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/kmate_v35_6_all_screens_safe_area_verify.js')
          text = path.read_text()
          old_fixture = "await page.evaluate(() => document.querySelector('#toast').classList.add('show'));"
          new_fixture = "await page.evaluate(() => { const toast = document.querySelector('#toast'); toast.textContent = 'Safe area check'; toast.classList.add('show'); });"
          if old_fixture not in text:
              raise SystemExit('Toast fixture marker missing')
          text = text.replace(old_fixture, new_fixture, 1)
          old_assertion = "assertInside(toast, safe, view, 'toast');"
          new_assertion = "assertInside({ ...toast, visible: true }, safe, view, 'toast');"
          if old_assertion not in text:
              raise SystemExit('Toast geometry marker missing')
          path.write_text(text.replace(old_assertion, new_assertion, 1))
          PY

      - name: Verify every screen in iPhone portrait and landscape
        run: |
          python3 -m http.server 4173 --directory . >/tmp/kmate-v35-6-server.log 2>&1 &
          node .github/scripts/kmate_v35_6_all_screens_safe_area_verify.js

      - name: Commit the verified app update
        run: |
          rm -f .github/workflows/kmate-v35-5-iphone-safe-area.yml
          rm -f .github/workflows/kmate-v35-6-all-screen-safe-area.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'Keep every K-Mate screen inside the iPhone safe area'
          git pull --rebase origin main
          git push

      - name: Wait for GitHub Pages to serve v35.6
        run: |
          for attempt in $(seq 1 100); do
            page="$(curl -fsSL "https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/?safe-area=v35-6-$RANDOM" || true)"
            css="$(curl -fsSL "https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/safe-area-v35-6.css?verify=$RANDOM" || true)"
            if printf '%s' "$page" | grep -q 'safe-area-v35-6.css?v=35.6.0' && printf '%s' "$css" | grep -q 'every iPhone screen respects'; then
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for v35.6 GitHub Pages deployment.' >&2
          exit 1

      - name: Verify every screen on the deployed public iPhone app
        env:
          KMATE_URL: https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/?safe-area=v35-6-public
        run: node .github/scripts/kmate_v35_6_all_screens_safe_area_verify.js
