name: K-Mate v53 index cache wiring

on:
  push:
    branches: [kmate-mobile-fit-v53]
    paths:
      - ".github/workflows/kmate-v53-index-bump.yml"

permissions:
  contents: write

jobs:
  wire-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: kmate-mobile-fit-v53
          fetch-depth: 0

      - name: Add v53 containment CSS, bump app cache key, and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kmate-trainer/index.html')
          text = path.read_text()
          stylesheet = '  <link rel="stylesheet" href="./reference-board-fit-v53.css?v=53.0.0">\n'
          anchor = '  <link rel="stylesheet" href="./classic-board-v46.css?v=46.0.0">\n'
          if stylesheet not in text:
              if anchor not in text:
                  raise SystemExit('Expected classic-board stylesheet anchor was not found.')
              text = text.replace(anchor, anchor + stylesheet)
          text = text.replace('app-v7.js?v=52.0.0', 'app-v7.js?v=53.0.0')
          if 'app-v7.js?v=53.0.0' not in text:
              raise SystemExit('The v53 app cache key could not be installed.')
          path.write_text(text)
          PY
          git rm .github/workflows/kmate-v53-index-bump.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kmate-trainer/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wire K-Mate v53 mobile board fit"
          git push origin HEAD:kmate-mobile-fit-v53
