name: K-Mate v36 paged app shell
on:
  push:
    paths:
      - '.github/workflows/kmate-v36-paged-app-shell.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply paged app-shell redesign
        run: |
          python -m py_compile .github/scripts/kmate_v36_paged_app_shell.py
          python .github/scripts/kmate_v36_paged_app_shell.py
          rm -f .github/workflows/kmate-v35-live-coach-board-visibility.yml

      - name: Validate assembled application
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v36.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v36.js
          grep -q "version: '36.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q 'function initializePagedSetup' kmate-trainer/app-v7-part6.txt
          grep -q "showSetupFlowPage('challenge')" kmate-trainer/app-v7-part6.txt
          grep -q 'setup-flow-page' kmate-trainer/styles-v7.css
          grep -q 'overflow:hidden' kmate-trainer/styles-v7.css

      - name: Install Playwright and serve app
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v36-server.log 2>&1 &

      - name: Verify desktop and mobile no-scroll setup pages and full-screen play
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          async function verify(viewport) {
            const browser = await chromium.launch({ headless: true, executablePath: process.env.BROWSER_PATH, args: ['--no-sandbox'] });
            const context = await browser.newContext({ viewport });
            await context.addInitScript(() => {
              const voices = [{ name: 'Sonia Natural', lang: 'en-GB', voiceURI: 'sonia-natural', localService: true }];
              class U { constructor(text) { this.text = text; this.onstart = null; this.onend = null; this.onerror = null; } }
              const synth = { speaking:false, getVoices:()=>voices, addEventListener:()=>{}, resume(){}, cancel(){}, speak(u){u.onstart?.(); setTimeout(()=>u.onend?.(),20);} };
              Object.defineProperty(window,'speechSynthesis',{configurable:true,value:synth});
              Object.defineProperty(window,'SpeechSynthesisUtterance',{configurable:true,value:U});
            });
            const page = await context.newPage();
            page.setDefaultTimeout(120000);
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1' && window.__KMATE__?.state().setupFlow?.paged);

            async function inspect(expectedPage) {
              return await page.evaluate((expectedPage) => {
                const active = document.querySelector(`.setup-flow-page[data-setup-page="${expectedPage}"]`);
                const rect = active.getBoundingClientRect();
                return {
                  state: window.__KMATE__.state().setupFlow,
                  activeVisible: !active.hidden,
                  rect: { top: rect.top, bottom: rect.bottom, height: rect.height },
                  scrollY: window.scrollY,
                  scrollHeight: document.documentElement.scrollHeight,
                  viewportHeight: window.innerHeight,
                  overflowBody: getComputedStyle(document.body).overflow,
                  overflowHtml: getComputedStyle(document.documentElement).overflow,
                  horizontal: document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1,
                };
              }, expectedPage);
            }

            let snap = await inspect('intro');
            assert.strictEqual(snap.state.page, 'intro', snap);
            assert.ok(snap.activeVisible, snap);
            assert.strictEqual(snap.scrollY, 0, snap);
            assert.ok(snap.scrollHeight <= snap.viewportHeight + 2, snap);
            assert.strictEqual(snap.overflowBody, 'hidden', snap);
            assert.strictEqual(snap.overflowHtml, 'hidden', snap);
            assert.ok(snap.horizontal, snap);

            await page.click('#introProceedButton');
            snap = await inspect('challenge');
            assert.strictEqual(snap.state.page, 'challenge', snap);
            assert.strictEqual(snap.scrollY, 0, snap);
            assert.ok(snap.scrollHeight <= snap.viewportHeight + 2, snap);

            await page.click('#challengeNextButton');
            snap = await inspect('coach');
            assert.strictEqual(snap.state.page, 'coach', snap);
            assert.strictEqual(snap.scrollY, 0, snap);
            assert.ok(snap.scrollHeight <= snap.viewportHeight + 2, snap);
            assert.ok(await page.locator('#startButton').isVisible());

            await page.waitForFunction(() => !document.querySelector('#startButton').disabled);
            await page.click('#startButton');
            await page.waitForFunction(() => document.body.classList.contains('game-mode'));
            await page.waitForTimeout(200);
            const game = await page.evaluate(() => {
              const board = document.querySelector('#board').getBoundingClientRect();
              return {
                scrollY: window.scrollY,
                scrollHeight: document.documentElement.scrollHeight,
                viewportHeight: window.innerHeight,
                board: { top: board.top, bottom: board.bottom, width: board.width, height: board.height },
                appbar: getComputedStyle(document.querySelector('.appbar')).display,
              };
            });
            assert.strictEqual(game.scrollY, 0, game);
            assert.ok(game.scrollHeight <= game.viewportHeight + 2, game);
            assert.ok(game.board.top >= 0 && game.board.bottom <= game.viewportHeight + 1, game);
            assert.strictEqual(game.appbar, 'none', game);

            await browser.close();
            return { viewport, snap, game };
          }

          (async () => {
            const desktop = await verify({ width: 1440, height: 900 });
            const mobile = await verify({ width: 390, height: 844 });
            console.log(JSON.stringify({ ok:true, desktop, mobile }, null, 2));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit and publish v36
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v36: use paged no-scroll app interface'
          git pull --rebase origin main
          git push
