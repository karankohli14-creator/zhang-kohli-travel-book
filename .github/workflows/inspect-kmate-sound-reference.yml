name: Inspect K-Mate sound reference
on:
  push:
    paths:
      - '.github/workflows/inspect-kmate-sound-reference.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read public YouTube metadata without downloading media
        run: |
          python -m pip install --quiet --disable-pip-version-check yt-dlp
          yt-dlp --skip-download --no-playlist --print 'title=%(title)s' --print 'channel=%(channel)s' --print 'duration=%(duration_string)s' 'https://www.youtube.com/watch?v=tncbdDB0-FQ'
