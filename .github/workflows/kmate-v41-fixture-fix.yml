name: Fix K-Mate v41 test fixture

on:
  push:
    branches: [kmate-relevance-v41]
    paths:
      - ".github/workflows/kmate-v41-fixture-fix.yml"

permissions:
  contents: write

jobs:
  patch-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kmate-relevance-v41
          fetch-depth: 0
      - name: Keep the first fixture nearest the target rating
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('kmate-trainer/tests/learning-relevance-v41.spec.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'rating: 1280 + index * 20,'
          new = 'rating: 1400 + index * 20,'
          if text.count(old) != 1:
              raise SystemExit('Expected fixture rating expression was not found exactly once.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit deterministic fixture
        run: |
          git config user.name "K-Mate test bot"
          git config user.email "actions@users.noreply.github.com"
          git add kmate-trainer/tests/learning-relevance-v41.spec.mjs
          git commit -m "Keep the first v41 puzzle fixture deterministic"
          git pull --rebase origin kmate-relevance-v41
          git push origin HEAD:kmate-relevance-v41
