name: K-Mate v39 setup and principles cleanup r3
on:
  push:
    paths:
      - '.github/workflows/kmate-v39-setup-principles-cleanup-r3.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v39
        run: |
          python -m py_compile .github/scripts/kmate_v39_setup_principles_cleanup.py
          python .github/scripts/kmate_v39_setup_principles_cleanup.py
          rm -f .github/workflows/kmate-v39-setup-principles-cleanup.yml
          rm -f .github/workflows/kmate-v39-setup-principles-cleanup-r2.yml
          rm -f .github/workflows/kmate-v38-setup-visual-redesign.yml
          rm -f .github/workflows/kmate-v37-fixed-screen-app-shell.yml
      - name: Validate assembled app
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts=[Path(f'kmate-trainer/app-v7-part{n}.txt').read_text() for n in range(1,7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'): parts[0]=parts[0][:-2]
          Path('/tmp/kmate-v39.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v39.js
          grep -q "version: '39.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q "Set your chess challenge" kmate-trainer/app-v7-part6.txt
          grep -q "Choose your coaching" kmate-trainer/app-v7-part6.txt
          grep -q "renderCompactPrincipleReview" kmate-trainer/app-v7-part6.txt
      - name: Install Playwright and serve app
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v39-r3-server.log 2>&1 &
      - name: Verify fixed setup and principle layouts directly
        run: |
          node <<'NODE'
          const {chromium}=require('playwright'); const assert=require('assert');
          async function check(viewport){
            const browser=await chromium.launch({headless:true,executablePath:process.env.BROWSER_PATH,args:['--no-sandbox']});
            const context=await browser.newContext({viewport}); const page=await context.newPage(); page.setDefaultTimeout(30000);
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.documentElement.dataset.ready==='1');
            await page.click('#introProceedButton');
            let x=await page.evaluate(()=>{const p=document.querySelector('[data-setup-page="challenge"]');const h=p.querySelector('h1').getBoundingClientRect();const e=document.querySelector('[data-phase="endgame"]').getBoundingClientRect();return{txt:p.querySelector('h1').textContent.trim(),ht:h.top,hb:h.bottom,ew:e.width,eh:e.height,y:scrollY,dh:document.documentElement.scrollHeight,vh:innerHeight}});
            assert.strictEqual(x.txt,'Set your chess challenge'); assert.ok(x.ht>=0&&x.hb<=x.vh,x); assert.ok(x.ew>70&&x.eh>35,x); assert.strictEqual(x.y,0); assert.ok(x.dh<=x.vh+2,x);
            await page.click('#challengeNextButton');
            x=await page.evaluate(()=>{const p=document.querySelector('[data-setup-page="coach"]');const h=p.querySelector('h1').getBoundingClientRect();return{txt:p.querySelector('h1').textContent.trim(),ht:h.top,hb:h.bottom,advanced:getComputedStyle(document.querySelector('.compact-beta-tools')).display,y:scrollY,dh:document.documentElement.scrollHeight,vh:innerHeight}});
            assert.strictEqual(x.txt,'Choose your coaching'); assert.ok(x.ht>=0&&x.hb<=x.vh,x); assert.strictEqual(x.advanced,'none'); assert.strictEqual(x.y,0); assert.ok(x.dh<=x.vh+2,x);
            const p=await page.evaluate(()=>{
              const dialog=document.querySelector('#principlesDialog'); const list=document.querySelector('#principlesList');
              list.innerHTML=''; ['Check forcing moves first','Count loose pieces','Improve your least active piece','Protect your king before attacking','Compare two serious candidates'].forEach((text,i)=>{const a=document.createElement('article');a.className='principle-compact-row';const n=document.createElement('span');n.className='principle-compact-number';n.textContent=String(i+1);const b=document.createElement('b');b.textContent=text;a.append(n,b);list.append(a)});
              document.querySelector('#principlesPositionTitle').textContent='5 key principles for this position'; dialog.showModal();
              const t=document.querySelector('#principlesPositionTitle').getBoundingClientRect(), start=document.querySelector('#principlesStartButton').getBoundingClientRect(); const rows=[...document.querySelectorAll('.principle-compact-row')].map(el=>{const r=el.getBoundingClientRect();return{top:r.top,bottom:r.bottom,text:el.textContent}});
              return{title:{top:t.top,bottom:t.bottom},start:{top:start.top,bottom:start.bottom},rows,ds:dialog.scrollHeight,dc:dialog.clientHeight,y:scrollY,dh:document.documentElement.scrollHeight,vh:innerHeight};
            });
            assert.strictEqual(p.rows.length,5); assert.ok(p.rows.every(r=>r.top>=0&&r.bottom<=p.vh&&r.text.length>3),p); assert.ok(p.title.top>=0&&p.title.bottom<=p.vh,p); assert.ok(p.start.top>=0&&p.start.bottom<=p.vh,p); assert.ok(p.ds<=p.dc+2,p); assert.strictEqual(p.y,0); assert.ok(p.dh<=p.vh+2,p);
            await browser.close(); return p;
          }
          (async()=>{const desktop=await check({width:1440,height:900});const mobile=await check({width:390,height:844});console.log(JSON.stringify({ok:true,desktop,mobile},null,2));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit and publish v39
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/scripts/kmate_v39_setup_principles_cleanup.py .github/workflows
          git commit -m 'K-Mate v39: streamline setup and principle review'
          git pull --rebase origin main
          git push
