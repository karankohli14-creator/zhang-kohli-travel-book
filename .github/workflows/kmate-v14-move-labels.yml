name: K-Mate v14 move-quality labels
on:
  push:
    paths:
      - '.github/workflows/kmate-v14-move-labels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply move-quality label patch
        run: python .github/scripts/kmate_v14_move_labels.py
      - name: Validate assembled JavaScript
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts=[Path(f'kmate-trainer/app-v7-part{n}.txt').read_text() for n in range(1,7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0]=parts[0][:-2]
          Path('/tmp/kmate-v14.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v14.js
      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kmate-trainer/index.html kmate-trainer/styles-v7.css kmate-trainer/app-v7.js kmate-trainer/app-v7-part1.txt kmate-trainer/app-v7-part3.txt kmate-trainer/app-v7-part4.txt
          git commit -m 'K-Mate v14: live color-coded move quality' || exit 0
          git push
