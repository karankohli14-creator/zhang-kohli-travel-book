name: K-Mate v50 one-time branch patch

on:
  push:
    branches: [kmate-full-page-hints-v50]
    paths:
      - ".github/workflows/kmate-v50-branch-patch.yml"

permissions:
  contents: write

jobs:
  patch-v50:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: kmate-full-page-hints-v50
          fetch-depth: 0

      - name: Patch loader, cache key, compatibility checks, and v50 controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('kmate-trainer/app-v7.js')
          text = app.read_text()
          old_v49 = """try {
            // v49 makes phone play genuinely board-first, provides a dependable CSS
            // fullscreen fallback, restores coach narration through the browser's native
            // speech method, and attenuates the wooden movement cue again.
            await import('./mobile-board-focus-v49.js?v=49.0.0');
            try {
              // This tiny, later style layer deliberately outranks v48's phone rule so the
              // explicit coach-audio button remains available beside fullscreen.
              await import('./mobile-board-focus-v49-overrides.js?v=49.0.1');
            } catch (error) {
              console.warn('Optional v49 compact-control specificity fix could not load.', error);
            }
          } catch (error) {
            console.warn('Optional v49 board-focus and coach-voice repair could not load.', error);
          }

          """
          if old_v49 not in text:
              raise SystemExit('Expected v49 import block was not found')
          text = text.replace(old_v49, '')
          anchor = """  if (window.__KMATE_CLASSIC_BOARD_V46__?.state?.().active !== false) {
            try {
              // v47 replaces only the piece artwork on the stable production board.
              // It keeps the white/green board and all input, chess, puzzle, clock,
              // and audio behavior. The retired ?legacySvg=1 renderer retains its
              // original v44 pieces so its fallback contract stays deterministic.
              await import('./sculpted-pieces-v47.js?v=47.0.0');
            } catch (error) {
              console.warn('Optional v47 sculpted chess-piece artwork could not load.', error);
            }
          }

          """
          addition = anchor + """  try {
            // v50 is the production phone-play layer: the game occupies the full
            // viewport, titles never reserve space, hints stay behind one light-bulb
            // control, candidate reveal remains interactive, and pawns use the new
            // pointed finial silhouette. It also preserves concise coach narration.
            await import('./mobile-full-page-v50.js?v=50.0.0');
          } catch (error) {
            console.warn('Optional v50 full-page game layer could not load.', error);
          }

          """
          if anchor not in text:
              raise SystemExit('Expected v47 import anchor was not found')
          text = text.replace(anchor, addition, 1)
          text = text.replace('v48/v49\n  // own the single quieter wooden movement sample', 'v48/v50\n  // own the single quieter wooden movement sample')
          app.write_text(text)

          index = Path('kmate-trainer/index.html')
          text = index.read_text()
          old = '<script type="module" src="./app-v7.js?v=49.0.0"></script>'
          new = '<script type="module" src="./app-v7.js?v=50.0.0"></script>'
          if old not in text:
              raise SystemExit('Expected v49 app loader was not found')
          index.write_text(text.replace(old, new, 1))

          js = Path('kmate-trainer/mobile-full-page-v50.js')
          text = js.read_text()
          old_hint = """  button = km50StripOldButtonListener('#kmateHintEdgeButton', 'kmateV50HintBound') || button;
            button.type = 'button';
            button.addEventListener('click', (event) => {
              event.preventDefault();
              event.stopPropagation();
              km50ToggleHint();
            });
            km50UpdateHintButton();
          """
          new_hint = """  button = km50StripOldButtonListener('#kmateHintEdgeButton', 'kmateV50HintBound') || button;
            button.type = 'button';
            if (button.dataset.kmateV50Listener !== KMATE_MOBILE_FULL_PAGE_V50) {
              button.dataset.kmateV50Listener = KMATE_MOBILE_FULL_PAGE_V50;
              button.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopPropagation();
                km50ToggleHint();
              });
            }
            km50UpdateHintButton();
          """
          if old_hint not in text:
              raise SystemExit('Expected v50 hint listener block was not found')
          text = text.replace(old_hint, new_hint, 1)

          old_fullscreen = """  button = km50StripOldButtonListener('#fullscreenButton', 'kmateV50FullscreenBound') || button;
            button.addEventListener('click', (event) => {
              event.preventDefault();
              event.stopPropagation();
              void km50SetImmersive(!km50Immersive);
            });
            km50UpdateFullscreenButton();
          """
          new_fullscreen = """  button = km50StripOldButtonListener('#fullscreenButton', 'kmateV50FullscreenBound') || button;
            if (button.dataset.kmateV50Listener !== KMATE_MOBILE_FULL_PAGE_V50) {
              button.dataset.kmateV50Listener = KMATE_MOBILE_FULL_PAGE_V50;
              button.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopPropagation();
                void km50SetImmersive(!km50Immersive);
              });
            }
            km50UpdateFullscreenButton();
          """
          if old_fullscreen not in text:
              raise SystemExit('Expected v50 fullscreen listener block was not found')
          text = text.replace(old_fullscreen, new_fullscreen, 1)
          js.write_text(text)

          css = Path('kmate-trainer/mobile-full-page-v50.css')
          text = css.read_text()
          insertion = """
          html.kmate-mobile-full-page-v50 body:not(.game-mode) label.hint-toggle {
            display: none !important;
          }

          """
          marker = 'html.kmate-mobile-full-page-v50 body.game-mode {'
          if marker not in text:
              raise SystemExit('Expected v50 CSS marker was not found')
          css.write_text(text.replace(marker, insertion + marker, 1))

          workflow = Path('.github/workflows/kmate-classic-board-v46.yml')
          text = workflow.read_text()
          old_check = "grep -Eq 'app-v7\\.js\\?v=(46|49)\\.0\\.0' kmate-trainer/index.html"
          new_check = "grep -Eq 'app-v7\\.js\\?v=(46|49|50)\\.0\\.0' kmate-trainer/index.html"
          if old_check not in text:
              raise SystemExit('Expected classic-board loader check was not found')
          workflow.write_text(text.replace(old_check, new_check, 1))
          PY

      - name: Commit patched files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            kmate-trainer/app-v7.js \
            kmate-trainer/index.html \
            kmate-trainer/mobile-full-page-v50.js \
            kmate-trainer/mobile-full-page-v50.css \
            .github/workflows/kmate-classic-board-v46.yml
          git commit -m "Wire K-Mate v50 full-page game layer"
          git push origin HEAD:kmate-full-page-hints-v50
