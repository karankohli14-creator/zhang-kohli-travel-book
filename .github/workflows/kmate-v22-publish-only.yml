name: Publish verified K-Mate v22 build
on:
  push:
    paths:
      - '.github/workflows/kmate-v22-publish-only.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build verified K-Mate v22 assets
        run: |
          python .github/scripts/kmate_v22_natural_voice_drag.py
          python .github/scripts/kmate_v22_native_drag_pointer_fix.py
      - name: Validate assembled JavaScript and release markers
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{n}.txt').read_text() for n in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v22-publish.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v22-publish.js
          grep -q 'glyph.draggable = piece.color === userColor' kmate-trainer/app-v7-part1.txt
          grep -q 'pointer-events:auto!important' kmate-trainer/styles-v7.css
          grep -q 'id="coachVoiceSelect"' kmate-trainer/index.html
          grep -q 'id="coachRateRange"' kmate-trainer/index.html
          grep -q 'id="voiceCloneDialog"' kmate-trainer/index.html
          grep -q "version: '22.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
      - name: Commit K-Mate v22
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kmate-trainer/index.html kmate-trainer/styles-v7.css kmate-trainer/app-v7.js kmate-trainer/app-v7-part1.txt kmate-trainer/app-v7-part6.txt
          git commit -m 'K-Mate v22: natural coach voice and native piece dragging' || exit 0
          git push
