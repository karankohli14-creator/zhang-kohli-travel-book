name: K-Mate v53 mobile board fit QA

on:
  push:
    branches: [main]
    paths:
      - "kmate-trainer/reference-board-fit-v53.css"
      - "kmate-trainer/index.html"
      - "kmate-trainer/tests/mobile-board-fit-v53.spec.mjs"
      - ".github/workflows/kmate-mobile-fit-v53.yml"
  pull_request:
    paths:
      - "kmate-trainer/reference-board-fit-v53.css"
      - "kmate-trainer/index.html"
      - "kmate-trainer/tests/mobile-board-fit-v53.spec.mjs"
      - ".github/workflows/kmate-mobile-fit-v53.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-fit-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate v53 source wiring
        run: |
          node --check kmate-trainer/tests/mobile-board-fit-v53.spec.mjs
          grep -Fq "reference-board-fit-v53.css?v=53.0.0" kmate-trainer/index.html
          grep -Fq "app-v7.js?v=53.0.0" kmate-trainer/index.html
          grep -Fq -- "--km53-board-gutter" kmate-trainer/reference-board-fit-v53.css
          grep -Fq "box-sizing: border-box !important" kmate-trainer/reference-board-fit-v53.css
          grep -Fq "overflow: hidden !important" kmate-trainer/reference-board-fit-v53.css
          grep -Fq -- "--km52-coordinate-size: clamp(13px" kmate-trainer/reference-board-fit-v53.css
          grep -Fq "phone landscape" kmate-trainer/tests/mobile-board-fit-v53.spec.mjs

      - name: Install browser dependencies
        run: npm install --no-save @playwright/test@1.55.0 chess.js@1.4.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static K-Mate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kmate-v53-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/kmate-trainer/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kmate-v53-http.log
          exit 1

      - name: Test board containment and notation alignment across phone sizes
        env:
          KMATE_APP_URL: http://127.0.0.1:4173/kmate-trainer/?nativeBoard=1
        run: >-
          npx playwright test
          kmate-trainer/tests/mobile-board-fit-v53.spec.mjs
          --workers=1
          --reporter=line

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmate-mobile-fit-v53-failure
          path: |
            test-results
            /tmp/kmate-v53-http.log
          if-no-files-found: ignore
          retention-days: 7
