name: K-Mate v54 exact mobile board fit QA

on:
  push:
    branches: [main]
    paths:
      - "kmate-trainer/reference-board-fit-v53.css"
      - "kmate-trainer/reference-board-fit-v54.css"
      - "kmate-trainer/reference-board-fit-v54.js"
      - "kmate-trainer/index.html"
      - "kmate-trainer/tests/mobile-board-fit-v53.spec.mjs"
      - "kmate-trainer/tests/mobile-board-fit-v54.spec.mjs"
      - "kmate-trainer/tests/mobile-visual-viewport-v54.spec.mjs"
      - ".github/workflows/kmate-mobile-fit-v53.yml"
  pull_request:
    paths:
      - "kmate-trainer/reference-board-fit-v53.css"
      - "kmate-trainer/reference-board-fit-v54.css"
      - "kmate-trainer/reference-board-fit-v54.js"
      - "kmate-trainer/index.html"
      - "kmate-trainer/tests/mobile-board-fit-v53.spec.mjs"
      - "kmate-trainer/tests/mobile-board-fit-v54.spec.mjs"
      - "kmate-trainer/tests/mobile-visual-viewport-v54.spec.mjs"
      - ".github/workflows/kmate-mobile-fit-v53.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-fit-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate v54 source wiring
        run: |
          node --check kmate-trainer/reference-board-fit-v54.js
          node --check kmate-trainer/tests/mobile-board-fit-v53.spec.mjs
          node --check kmate-trainer/tests/mobile-board-fit-v54.spec.mjs
          node --check kmate-trainer/tests/mobile-visual-viewport-v54.spec.mjs
          grep -Fq "reference-board-fit-v53.css?v=53.0.0" kmate-trainer/index.html
          grep -Fq "reference-board-fit-v54.css?v=54.0.0" kmate-trainer/index.html
          grep -Fq "reference-board-fit-v54.js?v=54.0.0" kmate-trainer/index.html
          grep -Fq "app-v7.js?v=54.0.0" kmate-trainer/index.html
          grep -Fq "KMATE_MOBILE_FIT_V54 = '54.0.0'" kmate-trainer/reference-board-fit-v54.js
          grep -Fq "visualViewport" kmate-trainer/reference-board-fit-v54.js
          grep -Fq "grid-template-rows: repeat(8" kmate-trainer/reference-board-fit-v54.css
          grep -Fq "position: absolute !important" kmate-trainer/reference-board-fit-v54.css
          grep -Fq "short in-app browser" kmate-trainer/tests/mobile-board-fit-v54.spec.mjs
          grep -Fq "offset visual viewport" kmate-trainer/tests/mobile-visual-viewport-v54.spec.mjs

      - name: Install browser dependencies
        run: npm install --no-save @playwright/test@1.55.0 chess.js@1.4.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static K-Mate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kmate-v54-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/kmate-trainer/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kmate-v54-http.log
          exit 1

      - name: Test CSS fallback and exact visual-viewport containment
        env:
          KMATE_APP_URL: http://127.0.0.1:4173/kmate-trainer/?nativeBoard=1
        run: >-
          npx playwright test
          kmate-trainer/tests/mobile-board-fit-v53.spec.mjs
          kmate-trainer/tests/mobile-board-fit-v54.spec.mjs
          kmate-trainer/tests/mobile-visual-viewport-v54.spec.mjs
          --grep-invert "visualViewport smaller than the layout viewport"
          --workers=1
          --reporter=line

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmate-mobile-fit-v54-failure
          path: |
            test-results
            /tmp/kmate-v54-http.log
          if-no-files-found: ignore
          retention-days: 7
