name: Harden K-Mate v44 SVG discovery

on:
  push:
    branches: [kmate-svg-board-v44]
    paths:
      - ".github/workflows/kmate-svg-board-v44-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-svg-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kmate-svg-board-v44
          fetch-depth: 0
      - name: Ignore SVG overlay mutations in global discovery
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('kmate-trainer/svg-board-v44.js')
          text = path.read_text()
          old = "svg44GlobalObserver = new MutationObserver(() => { window.clearTimeout(svg44ControlTimer); svg44ControlTimer = window.setTimeout(svg44Discover, 20); });"
          new = """svg44GlobalObserver = new MutationObserver((mutations) => {
            const selector = '#board,#km42PuzzleBoard,.play-actions,.km42-puzzle-topbar';
            const relevant = mutations.some((mutation) => [...mutation.addedNodes].some((node) => (
              node instanceof Element
              && (node.matches(selector) || Boolean(node.querySelector(selector)))
            )));
            if (!relevant) return;
            window.clearTimeout(svg44ControlTimer);
            svg44ControlTimer = window.setTimeout(svg44Discover, 20);
          });"""
          if old not in text:
              raise SystemExit('Expected SVG discovery observer was not found.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit hardening
        run: |
          git config user.name "K-Mate release bot"
          git config user.email "actions@users.noreply.github.com"
          git add kmate-trainer/svg-board-v44.js
          git commit -m "Avoid self-triggered SVG board discovery loops"
          git pull --rebase origin kmate-svg-board-v44
          git push origin HEAD:kmate-svg-board-v44
