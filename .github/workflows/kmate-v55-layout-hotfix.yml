name: K-Mate v55 layout hotfix

on:
  push:
    branches: [kmate-coach-ux-v55]
    paths:
      - ".github/workflows/kmate-v55-layout-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: kmate-coach-ux-v55
          fetch-depth: 0

      - name: Apply active phone sizing and candidate reveal fixes
        run: python3 .github/scripts/kmate-v55-hotfix.py

      - name: Commit the hotfix and remove temporary files
        run: |
          git rm .github/workflows/kmate-v55-layout-hotfix.yml
          git rm .github/scripts/kmate-v55-hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kmate-trainer/coach-layout-v55.js kmate-trainer/coach-layout-v55.css
          git commit -m "Harden v55 mobile coach sizing and candidate reveal"
          git push origin HEAD:kmate-coach-ux-v55
