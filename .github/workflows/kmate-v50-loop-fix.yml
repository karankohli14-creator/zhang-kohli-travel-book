name: K-Mate v50 one-time render-loop repair

on:
  push:
    branches: [kmate-full-page-hints-v50]
    paths:
      - ".github/workflows/kmate-v50-loop-fix.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: kmate-full-page-hints-v50
          fetch-depth: 0

      - name: Remove observer feedback loops
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kmate-trainer/mobile-full-page-v50.js')
          text = path.read_text()

          text = text.replace(
              "let km50ScaledMediaPlays = 0;\n",
              "let km50ScaledMediaPlays = 0;\nlet km50LastGameMode = null;\nlet km50SyncingGameMode = false;\n",
              1,
          )

          old_close = """function km50CloseHint() {
            km50HintOpen = false;
            document.body?.classList.remove('km50-hint-open', 'km48-hint-open', 'km49-hint-open');
            const card = km50HintCard();
            if (card) {
              card.hidden = true;
              card.setAttribute('aria-hidden', 'true');
            }
            km50UpdateHintButton();
          }
          """
          new_close = """function km50CloseHint() {
            km50HintOpen = false;
            document.body?.classList.remove('km50-hint-open', 'km48-hint-open', 'km49-hint-open');
            const card = km50HintCard();
            if (card) {
              if (!card.hidden) card.hidden = true;
              if (card.getAttribute('aria-hidden') !== 'true') card.setAttribute('aria-hidden', 'true');
            }
            km50UpdateHintButton();
          }
          """
          if old_close not in text:
              raise SystemExit('Expected hint-close block was not found')
          text = text.replace(old_close, new_close, 1)

          old_wait = "  if (/waiting for your turn|hints unavailable/i.test(title)) km50CloseHint();\n"
          new_wait = "  if (/waiting for your turn|hints unavailable/i.test(title) && (km50HintOpen || !card.hidden)) km50CloseHint();\n"
          if old_wait not in text:
              raise SystemExit('Expected hint-state close condition was not found')
          text = text.replace(old_wait, new_wait, 1)

          old_sync = """function km50SyncGameMode() {
            const gameMode = Boolean(document.body?.classList.contains('game-mode'));
            document.documentElement.classList.add('kmate-mobile-full-page-v50');
            document.body?.classList.toggle('km50-full-page-game', gameMode);
            km50HidePositionTitle();
            km50DisableAutomaticHints();
            km50EnsureHintControls();
            km50EnsureFullscreenControl();
            if (!gameMode) {
              km50CloseHint();
              km50Immersive = false;
              document.body?.classList.remove('km50-immersive', 'board-focus');
              km50UpdateFullscreenButton();
            }
            window.requestAnimationFrame(() => window.dispatchEvent(new Event('resize')));
          }

          function km50InstallGameObserver() {
            if (km50BodyObserver || !document.body) return;
            km50BodyObserver = new MutationObserver(km50SyncGameMode);
            km50BodyObserver.observe(document.body, { attributes: true, attributeFilter: ['class'] });
          }
          """
          new_sync = """function km50SyncGameMode() {
            if (km50SyncingGameMode || !document.body) return;
            km50SyncingGameMode = true;
            try {
              const gameMode = document.body.classList.contains('game-mode');
              km50LastGameMode = gameMode;
              document.documentElement.classList.add('kmate-mobile-full-page-v50');
              if (document.body.classList.contains('km50-full-page-game') !== gameMode) {
                document.body.classList.toggle('km50-full-page-game', gameMode);
              }
              km50HidePositionTitle();
              km50DisableAutomaticHints();
              km50EnsureHintControls();
              km50EnsureFullscreenControl();
              if (!gameMode) {
                const card = km50HintCard();
                if (
                  km50HintOpen
                  || !card?.hidden
                  || document.body.classList.contains('km50-hint-open')
                  || document.body.classList.contains('km48-hint-open')
                  || document.body.classList.contains('km49-hint-open')
                ) km50CloseHint();
                if (km50Immersive) km50Immersive = false;
                if (document.body.classList.contains('km50-immersive')) document.body.classList.remove('km50-immersive');
                if (document.body.classList.contains('board-focus')) document.body.classList.remove('board-focus');
                km50UpdateFullscreenButton();
              }
            } finally {
              km50SyncingGameMode = false;
            }
          }

          function km50InstallGameObserver() {
            if (km50BodyObserver || !document.body) return;
            km50LastGameMode = document.body.classList.contains('game-mode');
            km50BodyObserver = new MutationObserver(() => {
              const gameMode = document.body.classList.contains('game-mode');
              if (gameMode !== km50LastGameMode) km50SyncGameMode();
            });
            km50BodyObserver.observe(document.body, { attributes: true, attributeFilter: ['class'] });
          }
          """
          if old_sync not in text:
              raise SystemExit('Expected game-mode observer block was not found')
          text = text.replace(old_sync, new_sync, 1)
          path.write_text(text)
          PY

      - name: Remove temporary export and repair workflows
        run: |
          git rm -f .github/workflows/kmate-v50-export.yml .github/workflows/kmate-v50-loop-fix.yml

      - name: Validate and publish repair
        run: |
          node --check kmate-trainer/mobile-full-page-v50.js
          grep -Fq "km50SyncingGameMode" kmate-trainer/mobile-full-page-v50.js
          ! grep -Fq "requestAnimationFrame(() => window.dispatchEvent(new Event('resize')))" kmate-trainer/mobile-full-page-v50.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kmate-trainer/mobile-full-page-v50.js .github/workflows
          git commit -m "Stop v50 layout observer feedback loops"
          git push origin HEAD:kmate-full-page-hints-v50
