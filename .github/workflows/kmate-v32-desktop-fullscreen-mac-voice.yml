name: K-Mate v32 desktop viewport and Mac voice
on:
  push:
    paths:
      - '.github/workflows/kmate-v32-desktop-fullscreen-mac-voice.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply viewport, scroll, and voice fixes
        run: |
          python -m py_compile .github/scripts/kmate_v32_desktop_fullscreen_voice.py
          python .github/scripts/kmate_v32_desktop_fullscreen_voice.py
          rm -f .github/workflows/kmate-v31-live-coach-voice-principles.yml

      - name: Validate assembled application
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v32.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v32.js
          grep -q "version: '32.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q 'id="gameFullscreenButton"' kmate-trainer/index.html
          grep -q 'id="testLiveCoachVoiceButton"' kmate-trainer/index.html
          grep -q 'function startLiveCoachSpeech' kmate-trainer/app-v7-part1.txt
          grep -q 'function captureLiveCoachViewport' kmate-trainer/app-v7-part1.txt
          grep -q 'kmate-game-mode' kmate-trainer/styles-v7.css
          grep -q 'position:fixed!important' kmate-trainer/styles-v7.css
          ! grep -q "scrollIntoView.*boardCoachStage" kmate-trainer/app-v7-part1.txt

      - name: Install Playwright and serve K-Mate
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v32-server.log 2>&1 &

      - name: Verify desktop fit, stable resume, and Mac-style speech queue
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.BROWSER_PATH,
              args: ['--no-sandbox', '--autoplay-policy=no-user-gesture-required'],
            });
            const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
            await context.addInitScript(() => {
              window.__speechCalls = [];
              let voicesReady = false;
              const voiceListeners = new Set();
              const voices = [{ name: 'Sonia Natural', lang: 'en-GB', voiceURI: 'sonia-natural', localService: true }];
              class TestUtterance {
                constructor(text) {
                  this.text = text; this.voice = null; this.lang = ''; this.rate = 1; this.pitch = 1; this.volume = 1;
                  this.onstart = null; this.onend = null; this.onerror = null;
                }
              }
              const synth = {
                speaking: false,
                getVoices: () => voicesReady ? voices : [],
                addEventListener(type, callback) {
                  if (type !== 'voiceschanged') return;
                  voiceListeners.add(callback);
                  setTimeout(() => {
                    voicesReady = true;
                    for (const listener of [...voiceListeners]) listener();
                  }, 45);
                },
                removeEventListener(type, callback) { if (type === 'voiceschanged') voiceListeners.delete(callback); },
                resume() {},
                cancel() { this.speaking = false; },
                speak(utterance) {
                  window.__speechCalls.push({ text: utterance.text, voice: utterance.voice?.name || null, rate: utterance.rate });
                  this.speaking = true;
                  utterance.onstart?.();
                  setTimeout(() => { this.speaking = false; utterance.onend?.(); }, 55);
                },
              };
              Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
              Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
              HTMLMediaElement.prototype.play = function () { return Promise.resolve(); };
              HTMLMediaElement.prototype.pause = function () {};
            });

            const page = await context.newPage();
            page.setDefaultTimeout(120000);
            const fatalErrors = [];
            page.on('pageerror', error => fatalErrors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Failed to load resource') && text.includes('404')) return;
              fatalErrors.push(`console: ${text}`);
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1');

            await page.click('#testLiveCoachVoiceButton');
            await page.waitForTimeout(550);
            const testVoice = await page.evaluate(() => window.__speechCalls.map(call => call.text));
            assert.ok(testVoice.length >= 2, testVoice);
            assert.ok(testVoice.join(' ').includes('K-Mate Live Coach is ready'), testVoice);

            const demo = await page.evaluate(() => window.__KMATE__.test.startLiveCoachPrincipleDemo());
            assert.strictEqual(demo.voice, true);
            await page.waitForSelector('#gameView:not([hidden])');
            await page.waitForTimeout(120);

            const normalLayout = await page.evaluate(() => {
              const game = document.querySelector('#gameView').getBoundingClientRect();
              const board = document.querySelector('#board').getBoundingClientRect();
              const side = document.querySelector('.sidepanel').getBoundingClientRect();
              return {
                bodyOverflow: getComputedStyle(document.body).overflowY,
                bodyMode: document.body.classList.contains('kmate-game-mode'),
                game: { top: game.top, left: game.left, width: game.width, height: game.height, bottom: game.bottom },
                board: { top: board.top, left: board.left, width: board.width, height: board.height, bottom: board.bottom },
                side: { top: side.top, bottom: side.bottom, height: side.height },
                fullscreenButton: Boolean(document.querySelector('#gameFullscreenButton')),
                scrollY: window.scrollY,
              };
            });
            assert.ok(normalLayout.bodyMode, normalLayout);
            assert.strictEqual(normalLayout.bodyOverflow, 'hidden');
            assert.ok(Math.abs(normalLayout.game.top) < 2 && Math.abs(normalLayout.game.height - 900) < 3, normalLayout);
            assert.ok(normalLayout.board.width >= 500 && Math.abs(normalLayout.board.width - normalLayout.board.height) < 2, normalLayout);
            assert.ok(normalLayout.board.top >= 0 && normalLayout.board.bottom <= 900, normalLayout);
            assert.ok(normalLayout.side.top >= 0 && normalLayout.side.bottom <= 900, normalLayout);
            assert.ok(normalLayout.fullscreenButton, normalLayout);

            await page.click('#board .sq[data-square="e2"]');
            await page.click('#board .sq[data-square="e4"]');
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.awaiting && window.__KMATE__.state().clockPaused);
            const injected = await page.evaluate(() => window.__KMATE__.test.forceLiveCoachIntervention());
            assert.ok(injected?.bestMove, injected);
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.open);
            await page.waitForTimeout(900);

            const review = await page.evaluate(() => {
              const board = document.querySelector('#board').getBoundingClientRect();
              const panel = document.querySelector('#liveCoachBoardPanel').getBoundingClientRect();
              const speech = window.__speechCalls.map(call => call.text);
              const state = window.__KMATE__.state();
              return {
                board: { top: board.top, bottom: board.bottom, width: board.width, height: board.height },
                panel: { top: panel.top, bottom: panel.bottom, width: panel.width, height: panel.height },
                ratio: board.width / panel.width,
                speech,
                diagnoses: state.liveCoach.principleDiagnoses.length,
                scrollY: window.scrollY,
                bodyMode: document.body.classList.contains('kmate-game-mode'),
              };
            });
            assert.ok(review.bodyMode, review);
            assert.ok(review.board.top >= 0 && review.board.bottom <= 900, review);
            assert.ok(review.panel.top >= 0 && review.panel.bottom <= 900, review);
            assert.ok(review.ratio >= 0.72 && review.ratio <= 1.28, review);
            assert.ok(review.diagnoses >= 1, review);
            assert.ok(review.speech.length >= 5, review.speech);
            assert.ok(review.speech.join(' ').includes('Principle diagnosis'), review.speech);

            const scrollBeforeResume = await page.evaluate(() => window.scrollY);
            await page.click('#liveCoachContinueButton');
            await page.waitForFunction(() => !window.__KMATE__.state().liveCoach.open && !window.__KMATE__.state().clockPaused);
            await page.waitForTimeout(250);
            const after = await page.evaluate(() => {
              const board = document.querySelector('#board').getBoundingClientRect();
              return {
                scrollY: window.scrollY,
                bodyMode: document.body.classList.contains('kmate-game-mode'),
                boardBottom: board.bottom,
                panelHidden: document.querySelector('#liveCoachBoardPanel').hidden,
              };
            });
            assert.strictEqual(after.scrollY, scrollBeforeResume, after);
            assert.ok(after.bodyMode, after);
            assert.ok(after.boardBottom <= 900, after);
            assert.ok(after.panelHidden, after);

            if (fatalErrors.length) throw new Error(fatalErrors.join('\n'));
            console.log(JSON.stringify({ ok: true, normalLayout, review: { ...review, speech: review.speech.length }, after }, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit and publish K-Mate v32
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v32: fit desktop play to viewport and fix Mac coach audio'
          git pull --rebase origin main
          git push
