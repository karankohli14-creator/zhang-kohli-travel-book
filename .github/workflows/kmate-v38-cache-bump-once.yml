name: K-Mate v38 one-time cache bump

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kmate-v38-cache-bump-once.yml"

permissions:
  contents: write

jobs:
  deploy-cache-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump the public K-Mate module URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("kmate-trainer/index.html")
          text = path.read_text()
          old = './app-v7.js?v=37.0.0'
          new = './app-v7.js?v=38.0.0'
          if old not in text and new not in text:
              raise SystemExit("Expected K-Mate v37 or v38 script reference was not found")
          path.write_text(text.replace(old, new))
          PY

      - name: Remove this one-time workflow and publish
        shell: bash
        run: |
          git config user.name "K-Mate release bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/kmate-v38-cache-bump-once.yml
          git add kmate-trainer/index.html
          git commit -m "Deploy K-Mate Chess.com position fix v38"
          git push origin HEAD:main
