name: K-Mate v21 corrected final verification
on:
  push:
    paths:
      - '.github/workflows/kmate-v21-final2.yml'
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build corrected v21 working tree
        run: |
          python - <<'PY'
          from pathlib import Path
          script = Path('.github/scripts/kmate_v21_avatar_voice_mobile.py')
          text = script.read_text().replace(
              'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)',
              'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)',
              1,
          )
          script.write_text(text)
          PY
          python .github/scripts/kmate_v21_avatar_voice_mobile.py
          python - <<'PY'
          from pathlib import Path
          css_path = Path('kmate-trainer/styles-v7.css')
          css = css_path.read_text()
          rule = '.replay-comparison[hidden],.replay-line[hidden],.replay-best-button[hidden]{display:none!important}'
          if rule not in css:
              css += '\n' + rule + '\n'
          css_path.write_text(css)

          app_path = Path('kmate-trainer/app-v7-part1.txt')
          app = app_path.read_text()
          old = "    if (finalized) renderPostGameReview(currentSession);"
          new = "    if (finalized) {\n      renderPostGameReview(currentSession);\n      if ($('#replayDialog')?.open && replayState.session?.id === sessionId) renderCoachReplay();\n    }"
          if old not in app:
              raise SystemExit('analysis refresh marker missing')
          app_path.write_text(app.replace(old, new, 1))
          PY
      - name: Validate build and prepare corrected browser test
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          import textwrap, wave
          parts = [Path(f'kmate-trainer/app-v7-part{n}.txt').read_text() for n in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v21-final.js').write_text(''.join(parts))
          with wave.open('kmate-trainer/sounds/kmate-sounds-v21.wav', 'rb') as wav:
              assert wav.getnchannels() == 2 and wav.getframerate() == 44100
              assert wav.getnframes() / wav.getframerate() > 7.0

          workflow = Path('.github/workflows/kmate-v21-final-verify.yml').read_text()
          marker = "          node <<'NODE'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n          NODE', start)
          test = textwrap.dedent(workflow[start:end])
          test = test.replace('            assert.strictEqual(window === undefined, false);\n', '')
          Path('/tmp/kmate-v21-browser-test.js').write_text(test)
          PY
          node --check /tmp/kmate-v21-final.js
          node --check /tmp/kmate-v21-browser-test.js
          grep -q 'id="coachAvatar"' kmate-trainer/index.html
          grep -q 'id="replayWhyText"' kmate-trainer/index.html
          grep -q 'id="replayBestText"' kmate-trainer/index.html
          grep -q "version: '21.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
      - name: Install Chromium and serve K-Mate
        run: |
          npm install playwright@1.55.0 --no-save --silent
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v21-final2-server.log 2>&1 &
      - name: Run corrected mobile browser verification
        run: node /tmp/kmate-v21-browser-test.js
      - name: Commit K-Mate v21
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/kmate_v21_avatar_voice_mobile.py kmate-trainer/index.html kmate-trainer/styles-v7.css kmate-trainer/app-v7.js kmate-trainer/app-v7-part1.txt kmate-trainer/app-v7-part6.txt kmate-trainer/sounds/kmate-sounds-v21.wav
          git commit -m 'K-Mate v21: Coach K voice and one-screen mobile review' || exit 0
          git push
