name: Deploy K-Mate v35.3 compact principles and game summary

on:
  push:
    paths:
      - '.github/workflows/kmate-v35-3-principles-summary-r4.yml'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm the verified v35.2 baseline
        run: |
          grep -q "version: '35.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q "FLOW_VERSION = '35.2-warm-3d'" kmate-trainer/appflow-v35.js
          test -f kmate-trainer/review-v35-3.js

      - name: Build the requested principle and review redesign
        run: |
          python -m py_compile .github/scripts/kmate_v35_3_principles_summary.py
          python .github/scripts/kmate_v35_3_principles_summary.py
          python -m py_compile .github/scripts/kmate_v35_3_principle_polish.py
          python .github/scripts/kmate_v35_3_principle_polish.py
          python -m py_compile .github/scripts/kmate_v35_3_verify_assertion_fix.py
          python .github/scripts/kmate_v35_3_verify_assertion_fix.py
          node --check kmate-trainer/review-v35-3.js
          node --check kmate-trainer/appflow-v35.js
          node --check kmate-trainer/app-v7.js
          cat kmate-trainer/app-v7-part{1,2,3,4,5,6}.txt > /tmp/kmate-v35-module.js
          node --check /tmp/kmate-v35-module.js
          grep -q "FLOW_VERSION = '35.3-principles-summary'" kmate-trainer/appflow-v35.js
          grep -q "review-v35-3.js?v=35.3.0" kmate-trainer/index.html
          grep -q "K-Mate v35.3 — compact principles and game-rating summary" kmate-trainer/styles-v7.css
          grep -A2 "principle-mini-description" kmate-trainer/styles-v7.css | grep -q "display:none"
          ! grep -q "Orient yourself before replaying" kmate-trainer/review-v35-3.js

      - name: Install Chromium and WebKit
        run: |
          npm install playwright@1.55.0 --no-save --silent
          npx playwright install --with-deps chromium webkit

      - name: Verify real desktop and iPhone-size flows before publishing
        run: |
          python3 -m http.server 4173 --directory . >/tmp/kmate-v35-3-r4-server.log 2>&1 &
          node .github/scripts/kmate_v35_3_verify.js

      - name: Commit and push the verified app
        run: |
          git restore .github/scripts/kmate_v35_3_verify.js
          rm -f .github/workflows/kmate-v35-3-principles-summary.yml
          rm -f .github/workflows/kmate-v35-3-principles-summary-r2.yml
          rm -f .github/workflows/kmate-v35-3-principles-summary-r3.yml
          rm -f .github/workflows/kmate-v35-3-principles-summary-r4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git diff --cached --quiet && { echo 'No application changes were staged.'; exit 1; }
          git commit -m 'K-Mate v35.3: make principles scroll-free and add game summary'
          git push origin HEAD:main

      - name: Wait for GitHub Pages to serve v35.3
        run: |
          for attempt in $(seq 1 100); do
            page="$(curl -fsSL "https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/?verify=$RANDOM" || true)"
            review="$(curl -fsSL "https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/review-v35-3.js?verify=$RANDOM" || true)"
            if printf '%s' "$page" | grep -q "review-v35-3.js?v=35.3.0" && printf '%s' "$review" | grep -q "35.3-principles-summary"; then
              echo 'GitHub Pages is serving K-Mate v35.3.'
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for GitHub Pages.' >&2
          exit 1

      - name: Verify the deployed public app in phone WebKit
        env:
          KMATE_PUBLIC_URL: https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/?review=v35-3-public-final
        run: node .github/scripts/kmate_v35_3_verify.js
