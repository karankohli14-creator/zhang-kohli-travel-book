name: K-Mate v55 app cache bump

on:
  push:
    branches: [kmate-coach-ux-v55]
    paths:
      - ".github/workflows/kmate-v55-cache-bump.yml"

permissions:
  contents: write

jobs:
  bump-cache-key:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: kmate-coach-ux-v55
          fetch-depth: 0

      - name: Bump the K-Mate application loader cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('kmate-trainer/index.html')
          text = path.read_text()
          old = 'app-v7.js?v=54.0.0'
          new = 'app-v7.js?v=55.0.0'
          if old not in text and new not in text:
              raise SystemExit('Expected K-Mate application loader was not found.')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kmate-trainer/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Bump K-Mate app loader to v55"
          git push origin HEAD:kmate-coach-ux-v55
