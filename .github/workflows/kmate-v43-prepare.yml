name: Prepare K-Mate v43 loader

on:
  push:
    branches: [kmate-training-plans-v43]
    paths:
      - ".github/workflows/kmate-v43-prepare.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kmate-training-plans-v43
          fetch-depth: 0
      - name: Point the public page at v43
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('kmate-trainer/index.html')
          text = path.read_text()
          old = 'app-v7.js?v=42.0.0'
          new = 'app-v7.js?v=43.0.0'
          if old not in text and new not in text:
              raise SystemExit('Expected K-Mate loader was not found.')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit the loader update
        run: |
          git config user.name "K-Mate release bot"
          git config user.email "actions@users.noreply.github.com"
          git add kmate-trainer/index.html
          if git diff --cached --quiet; then
            echo "Loader already points at v43."
            exit 0
          fi
          git commit -m "Point K-Mate page at v43"
          git push origin HEAD:kmate-training-plans-v43
