name: K-Mate v38 setup visual redesign
on:
  push:
    paths:
      - '.github/workflows/kmate-v38-setup-visual-redesign.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply setup visual redesign
        run: |
          python -m py_compile .github/scripts/kmate_v38_setup_visual_redesign.py
          python .github/scripts/kmate_v38_setup_visual_redesign.py
          rm -f .github/workflows/kmate-v37-true-noscroll-shell.yml

      - name: Validate assembled app
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{n}.txt').read_text() for n in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v38.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v38.js
          grep -q "version: '38.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q 'styles-v7.css?v=38.0.0' kmate-trainer/index.html
          grep -q 'data-phase="endgame"' kmate-trainer/index.html
          grep -q 'K-Mate v38' kmate-trainer/styles-v7.css

      - name: Install Playwright and serve app
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v38-server.log 2>&1 &

      - name: Verify large centered setup controls on desktop and phone
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          async function verify(viewport) {
            const browser = await chromium.launch({ headless: true, executablePath: process.env.BROWSER_PATH, args: ['--no-sandbox'] });
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            page.setDefaultTimeout(120000);
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1');
            await page.click('#introProceedButton');
            await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'challenge');
            await page.waitForTimeout(120);

            const challenge = await page.evaluate(() => {
              const buttons = [...document.querySelectorAll('#phaseSeg button')].map(button => {
                const rect = button.getBoundingClientRect();
                const label = button.querySelector('b');
                const labelRect = label.getBoundingClientRect();
                const buttonStyle = getComputedStyle(button);
                const labelStyle = getComputedStyle(label);
                return {
                  phase: button.dataset.phase,
                  text: label.textContent.trim(),
                  visible: rect.width > 0 && rect.height > 0 && buttonStyle.visibility !== 'hidden' && buttonStyle.display !== 'none',
                  width: rect.width,
                  height: rect.height,
                  labelFont: parseFloat(labelStyle.fontSize),
                  centerDx: Math.abs((labelRect.left + labelRect.width / 2) - (rect.left + rect.width / 2)),
                  centerDy: Math.abs((labelRect.top + labelRect.height / 2) - (rect.top + rect.height / 2)),
                };
              });
              const activePage = document.querySelector('.setup-flow-page[data-setup-page="challenge"]');
              return {
                buttons,
                scrollY: window.scrollY,
                scrollHeight: document.documentElement.scrollHeight,
                viewportHeight: window.innerHeight,
                pageRect: activePage.getBoundingClientRect().toJSON(),
                headingFont: parseFloat(getComputedStyle(activePage.querySelector('.setup-screen-copy h1')).fontSize),
                fieldLabelFont: parseFloat(getComputedStyle(activePage.querySelector('.challenge-fields-grid label')).fontSize),
              };
            });
            assert.strictEqual(challenge.buttons.length, 3, JSON.stringify(challenge));
            assert.deepStrictEqual(challenge.buttons.map(b => b.phase), ['middlegame', 'late-middlegame', 'endgame'], JSON.stringify(challenge));
            for (const button of challenge.buttons) {
              assert.ok(button.visible, JSON.stringify(challenge));
              assert.ok(button.height >= (viewport.width <= 760 ? 43 : 54), JSON.stringify(challenge));
              assert.ok(button.labelFont >= (viewport.width <= 760 ? 12 : 15), JSON.stringify(challenge));
              assert.ok(button.centerDx <= 2.5 && button.centerDy <= 3.5, JSON.stringify(challenge));
            }
            assert.strictEqual(challenge.scrollY, 0, JSON.stringify(challenge));
            assert.ok(challenge.scrollHeight <= challenge.viewportHeight + 2, JSON.stringify(challenge));
            assert.ok(challenge.headingFont >= (viewport.width <= 760 ? 22 : 28), JSON.stringify(challenge));
            assert.ok(challenge.fieldLabelFont >= (viewport.width <= 760 ? 10.5 : 13.5), JSON.stringify(challenge));

            await page.click('#challengeNextButton');
            await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'coach');
            await page.waitForTimeout(100);
            const coach = await page.evaluate(() => {
              const page = document.querySelector('.setup-flow-page[data-setup-page="coach"]');
              const first = page.querySelector('.calibration-toggle');
              const firstRect = first.getBoundingClientRect();
              return {
                scrollY: window.scrollY,
                scrollHeight: document.documentElement.scrollHeight,
                viewportHeight: window.innerHeight,
                headingFont: parseFloat(getComputedStyle(page.querySelector('.setup-screen-copy h1')).fontSize),
                toggleLabelFont: parseFloat(getComputedStyle(first.querySelector('b')).fontSize),
                toggleHeight: firstRect.height,
              };
            });
            assert.strictEqual(coach.scrollY, 0, JSON.stringify(coach));
            assert.ok(coach.scrollHeight <= coach.viewportHeight + 2, JSON.stringify(coach));
            assert.ok(coach.headingFont >= (viewport.width <= 760 ? 22 : 28), JSON.stringify(coach));
            assert.ok(coach.toggleLabelFont >= (viewport.width <= 760 ? 10.5 : 13.5), JSON.stringify(coach));
            assert.ok(coach.toggleHeight >= (viewport.width <= 760 ? 45 : 60), JSON.stringify(coach));

            await browser.close();
            return { challenge, coach };
          }

          (async () => {
            const desktop = await verify({ width: 1440, height: 900 });
            const mobile = await verify({ width: 390, height: 844 });
            console.log(JSON.stringify({ ok: true, desktop, mobile }, null, 2));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit and publish v38
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v38: enlarge and clarify setup interface'
          git pull --rebase origin main
          git push
