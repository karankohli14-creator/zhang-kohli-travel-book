name: K-Mate v50 one-time compatibility patch

on:
  push:
    branches: [kmate-full-page-hints-v50]
    paths:
      - ".github/workflows/kmate-v50-compat-patch.yml"

permissions:
  contents: write

jobs:
  patch-v50-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: kmate-full-page-hints-v50
          fetch-depth: 0

      - name: Keep coach audio visible, simplify clocks, and update legacy QA
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = Path('kmate-trainer/mobile-full-page-v50.css')
          text = css.read_text()
          rules = """html.kmate-mobile-full-page-v50 body.game-mode #gameCoachAudioButton {
            display: grid !important;
          }

          html.kmate-mobile-full-page-v50 body.game-mode .playerbar .avatar {
            display: none !important;
          }

          """
          marker = '/* The play grid, clocks, and board now use the entire viewport. */'
          if rules not in text:
              if marker not in text:
                  raise SystemExit('Expected v50 play-grid marker was not found')
              text = text.replace(marker, rules + marker, 1)
          css.write_text(text)

          test = Path('kmate-trainer/tests/mobile-game-ux-v48.spec.mjs')
          text = test.read_text()
          old = """    v49: window.__KMATE_BOARD_FOCUS_V49__?.state?.() || null,
            }));
            expect(voiceStartup.spoken.some((text) => /^coach voice ready/i.test(text))).toBe(false);
            expect((voiceStartup.ux.suppressedReadyPrompts || 0) + (voiceStartup.v49?.suppressedReadyPrompts || 0)).toBeGreaterThan(0);
          """
          new = """    v49: window.__KMATE_BOARD_FOCUS_V49__?.state?.() || null,
              v50: window.__KMATE_MOBILE_FULL_PAGE_V50__?.state?.() || null,
            }));
            expect(voiceStartup.spoken.some((text) => /^coach voice ready/i.test(text))).toBe(false);
            expect(
              (voiceStartup.ux.suppressedReadyPrompts || 0)
              + (voiceStartup.v49?.suppressedReadyPrompts || 0)
              + (voiceStartup.v50?.suppressedReadyPrompts || 0),
            ).toBeGreaterThan(0);
          """
          if old not in text:
              raise SystemExit('Expected v48 readiness assertion was not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '// v49 deliberately restores this explicit control after removing the noisy',
              '// v50 keeps this explicit control after removing the noisy',
              1,
          )
          test.write_text(text)
          PY

      - name: Commit compatibility updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kmate-trainer/mobile-full-page-v50.css kmate-trainer/tests/mobile-game-ux-v48.spec.mjs
          git commit -m "Keep v50 coach audio visible and align compatibility QA"
          git push origin HEAD:kmate-full-page-hints-v50
