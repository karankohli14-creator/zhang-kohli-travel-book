name: K-Mate v49 one-time index cache bust

on:
  push:
    branches: [kmate-board-focus-v49]
    paths:
      - ".github/workflows/kmate-v49-index-patch.yml"

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: kmate-board-focus-v49
          fetch-depth: 0

      - name: Bump the production module URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('kmate-trainer/index.html')
          text = path.read_text()
          old = '<script type="module" src="./app-v7.js?v=46.0.0"></script>'
          new = '<script type="module" src="./app-v7.js?v=49.0.0"></script>'
          if old not in text and new not in text:
              raise SystemExit('Expected app-v7 module tag was not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit cache-bust change
        run: |
          if git diff --quiet -- kmate-trainer/index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kmate-trainer/index.html
          git commit -m "Bump K-Mate app loader to v49"
          git push origin HEAD:kmate-board-focus-v49
