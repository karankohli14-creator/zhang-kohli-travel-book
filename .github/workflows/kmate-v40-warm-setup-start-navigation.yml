name: K-Mate v40 warm setup, reliable start, and review navigation
on:
  push:
    paths:
      - '.github/workflows/kmate-v40-warm-setup-start-navigation.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply K-Mate v40
        run: |
          python -m py_compile .github/scripts/kmate_v40_warm_setup_start_navigation.py
          python .github/scripts/kmate_v40_warm_setup_start_navigation.py
          rm -f .github/workflows/kmate-v39-setup-principles-cleanup.yml
          rm -f .github/workflows/kmate-v39-setup-principles-cleanup-r2.yml
          rm -f .github/workflows/kmate-v39-setup-principles-cleanup-r3.yml
          rm -f .github/workflows/kmate-v39-setup-principles-cleanup-r4.yml
          rm -f .github/workflows/kmate-v38-setup-visual-redesign.yml
          rm -f .github/workflows/kmate-v37-true-noscroll-shell.yml

      - name: Validate assembled application
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v40.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v40.js
          grep -q "version: '40.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q "function handleGeneratePosition" kmate-trainer/app-v7-part1.txt
          grep -q "Generate position" kmate-trainer/index.html
          grep -q "function goHomeFromReview" kmate-trainer/app-v7-part1.txt
          grep -q 'id="replayHomeButton"' kmate-trainer/index.html
          grep -q 'id="replayNewPositionButton"' kmate-trainer/index.html
          grep -q 'K-Mate v40' kmate-trainer/styles-v7.css
          ! grep -q "SpeechSynthesisUtterance('Coach voice ready.')" kmate-trainer/app-v7-part1.txt

      - name: Install Playwright and serve app
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v40-server.log 2>&1 &

      - name: Verify single-title setup, immediate play, and post-game exits
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          function installSpeechMock() {
            window.__speechCalls = [];
            const voices = [{ name: 'Serena Enhanced', lang: 'en-GB', voiceURI: 'serena-enhanced', localService: true }];
            class TestUtterance {
              constructor(text) {
                this.text = text;
                this.voice = null;
                this.lang = '';
                this.rate = 1;
                this.pitch = 1;
                this.volume = 1;
                this.onstart = null;
                this.onend = null;
                this.onerror = null;
              }
            }
            const synth = {
              speaking: false,
              pending: false,
              getVoices: () => voices,
              addEventListener: () => {},
              resume() {},
              cancel() { this.speaking = false; this.pending = false; },
              speak(utterance) {
                window.__speechCalls.push(utterance.text);
                this.speaking = true;
                utterance.onstart?.();
                setTimeout(() => {
                  this.speaking = false;
                  utterance.onend?.();
                }, 25);
              },
            };
            Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
            Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
          }

          function collectErrors(page) {
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.stack || error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Failed to load resource') && text.includes('404')) return;
              errors.push(`console: ${text}`);
            });
            return errors;
          }

          async function openApp(browser, viewport) {
            const context = await browser.newContext({ viewport });
            await context.addInitScript(installSpeechMock);
            const page = await context.newPage();
            page.setDefaultTimeout(120000);
            const errors = collectErrors(page);
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1' && window.__KMATE__?.state);
            return { context, page, errors };
          }

          async function inspectSetupPage(page, expectedPage, expectedTitle, minimumTitleSize) {
            await page.waitForFunction(expected => window.__KMATE__.state().setupFlow.page === expected, expectedPage);
            return page.evaluate(({ expectedPage, expectedTitle, minimumTitleSize }) => {
              const screen = document.querySelector(`.setup-flow-page[data-setup-page="${expectedPage}"]`);
              const header = screen.querySelector('.setup-screen-header');
              const visibleTitles = [...header.querySelectorAll('h1')].filter(element => {
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
              });
              const title = visibleTitles[0];
              const rect = title?.getBoundingClientRect();
              const progress = header.querySelector('.setup-progress')?.getBoundingClientRect();
              return {
                expectedTitle,
                titleText: title?.textContent?.trim() || '',
                visibleTitleCount: visibleTitles.length,
                subtitleCount: [...header.querySelectorAll('p')].filter(el => getComputedStyle(el).display !== 'none').length,
                titleSize: title ? Number.parseFloat(getComputedStyle(title).fontSize) : 0,
                titleRect: rect ? { top: rect.top, right: rect.right, bottom: rect.bottom, left: rect.left } : null,
                progressRect: progress ? { top: progress.top, right: progress.right, bottom: progress.bottom, left: progress.left } : null,
                minimumTitleSize,
                scrollY: window.scrollY,
                scrollHeight: document.documentElement.scrollHeight,
                viewportHeight: window.innerHeight,
                noHorizontalOverflow: document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1,
              };
            }, { expectedPage, expectedTitle, minimumTitleSize });
          }

          async function verifyDesktop(browser) {
            const { context, page, errors } = await openApp(browser, { width: 1440, height: 900 });
            await page.click('#introProceedButton');
            const challenge = await inspectSetupPage(page, 'challenge', 'Set your chess challenge', 28);
            assert.strictEqual(challenge.titleText, challenge.expectedTitle, JSON.stringify(challenge));
            assert.strictEqual(challenge.visibleTitleCount, 1, JSON.stringify(challenge));
            assert.strictEqual(challenge.subtitleCount, 0, JSON.stringify(challenge));
            assert.ok(challenge.titleSize >= challenge.minimumTitleSize, JSON.stringify(challenge));
            assert.ok(challenge.titleRect.top >= 0 && challenge.titleRect.bottom <= challenge.viewportHeight, JSON.stringify(challenge));
            assert.ok(challenge.titleRect.right + 8 <= challenge.progressRect.left, JSON.stringify(challenge));
            assert.strictEqual(challenge.scrollY, 0, JSON.stringify(challenge));
            assert.ok(challenge.scrollHeight <= challenge.viewportHeight + 2, JSON.stringify(challenge));
            assert.ok(challenge.noHorizontalOverflow, JSON.stringify(challenge));

            await page.click('#sideSeg [data-side="w"]');
            await page.click('#challengeNextButton');
            const coach = await inspectSetupPage(page, 'coach', 'Choose your coaching', 28);
            assert.strictEqual(coach.titleText, coach.expectedTitle, JSON.stringify(coach));
            assert.strictEqual(coach.visibleTitleCount, 1, JSON.stringify(coach));
            assert.strictEqual(coach.subtitleCount, 0, JSON.stringify(coach));
            assert.ok(coach.titleSize >= coach.minimumTitleSize, JSON.stringify(coach));
            assert.ok(coach.titleRect.right + 8 <= coach.progressRect.left, JSON.stringify(coach));
            assert.strictEqual(coach.scrollY, 0, JSON.stringify(coach));
            assert.ok(coach.scrollHeight <= coach.viewportHeight + 2, JSON.stringify(coach));

            await page.evaluate(() => {
              document.querySelector('#principleReview').checked = false;
              document.querySelector('#liveCoach').checked = false;
            });
            await page.waitForFunction(() => {
              const button = document.querySelector('#startButton');
              return button && !button.disabled && button.textContent.includes('Generate position');
            });
            const speechBeforeStart = await page.evaluate(() => window.__speechCalls.length);
            await page.click('#startButton');
            await page.waitForFunction(() => document.body.classList.contains('game-mode') && !document.querySelector('#gameView').hidden && window.__KMATE__.state().current);
            await page.waitForFunction(() => document.querySelectorAll('#board .piece').length > 0);
            const started = await page.evaluate(() => ({
              current: window.__KMATE__.state().current,
              gameMode: document.body.classList.contains('game-mode'),
              gameHidden: document.querySelector('#gameView').hidden,
              pieces: document.querySelectorAll('#board .piece').length,
              speechCalls: window.__speechCalls.slice(),
              startError: document.querySelector('#loadError')?.textContent?.trim() || '',
              scrollY: window.scrollY,
              scrollHeight: document.documentElement.scrollHeight,
              viewportHeight: window.innerHeight,
            }));
            assert.ok(started.current && started.gameMode && !started.gameHidden, JSON.stringify(started));
            assert.ok(started.pieces >= 2, JSON.stringify(started));
            assert.strictEqual(started.speechCalls.length, speechBeforeStart, JSON.stringify(started));
            assert.ok(!started.speechCalls.some(text => /coach voice ready/i.test(text)), JSON.stringify(started));
            assert.strictEqual(started.startError, '', JSON.stringify(started));
            assert.strictEqual(started.scrollY, 0, JSON.stringify(started));
            assert.ok(started.scrollHeight <= started.viewportHeight + 2, JSON.stringify(started));

            await page.waitForFunction(() => {
              const state = window.__KMATE__.state();
              return !state.finalized && !state.thinking && state.turn === state.userColor;
            });
            const legal = await page.evaluate(() => window.__KMATE__.test.firstLegalDrag());
            assert.ok(legal?.from && legal?.to, JSON.stringify(legal));
            await page.click(`#board .sq[data-square="${legal.from}"]`);
            await page.click(`#board .sq[data-square="${legal.to}"]`);
            await page.waitForFunction(() => window.__KMATE__.state().lastMove?.actor === 'user');
            await page.evaluate(() => window.__KMATE__.test.forceTimeout(window.__KMATE__.state().userColor));
            await page.waitForSelector('#resultDialog[open]');
            await page.waitForFunction(() => !document.querySelector('#resultReplay').disabled);
            await page.click('#resultReplay');
            await page.waitForSelector('#replayDialog[open]');

            const exits = await page.evaluate(() => {
              const ids = ['replayBackToReview', 'replayHomeButton', 'replayNewPositionButton'];
              return Object.fromEntries(ids.map(id => {
                const el = document.getElementById(id);
                const rect = el?.getBoundingClientRect();
                return [id, { visible: Boolean(el && rect && rect.width > 0 && rect.height > 0), text: el?.textContent?.trim() || '' }];
              }));
            });
            assert.ok(exits.replayBackToReview.visible, JSON.stringify(exits));
            assert.ok(exits.replayHomeButton.visible, JSON.stringify(exits));
            assert.ok(exits.replayNewPositionButton.visible, JSON.stringify(exits));

            await page.click('#replayHomeButton');
            await page.waitForFunction(() => !document.body.classList.contains('game-mode') && window.__KMATE__.state().setupFlow.page === 'intro');
            const home = await page.evaluate(() => ({
              replayOpen: document.querySelector('#replayDialog').open,
              resultOpen: document.querySelector('#resultDialog').open,
              page: window.__KMATE__.state().setupFlow.page,
              setupHidden: document.querySelector('#setupView').hidden,
            }));
            assert.ok(!home.replayOpen && !home.resultOpen && home.page === 'intro' && !home.setupHidden, JSON.stringify(home));

            await page.evaluate(() => window.__KMATE__.test.openReplay());
            await page.waitForSelector('#replayDialog[open]');
            await page.click('#replayNewPositionButton');
            await page.waitForFunction(() => document.body.classList.contains('game-mode') && !document.querySelector('#gameView').hidden && !document.querySelector('#replayDialog').open);
            const newPosition = await page.evaluate(() => ({
              current: window.__KMATE__.state().current,
              gameMode: document.body.classList.contains('game-mode'),
              replayOpen: document.querySelector('#replayDialog').open,
              resultOpen: document.querySelector('#resultDialog').open,
              pieces: document.querySelectorAll('#board .piece').length,
            }));
            assert.ok(newPosition.current && newPosition.gameMode && !newPosition.replayOpen && !newPosition.resultOpen && newPosition.pieces >= 2, JSON.stringify(newPosition));

            if (errors.length) throw new Error(errors.join('\n'));
            await context.close();
            return { challenge, coach, started, exits, home, newPosition };
          }

          async function verifyMobile(browser) {
            const { context, page, errors } = await openApp(browser, { width: 390, height: 844 });
            await page.click('#introProceedButton');
            const challenge = await inspectSetupPage(page, 'challenge', 'Set your chess challenge', 22);
            assert.strictEqual(challenge.titleText, challenge.expectedTitle, JSON.stringify(challenge));
            assert.strictEqual(challenge.visibleTitleCount, 1, JSON.stringify(challenge));
            assert.strictEqual(challenge.subtitleCount, 0, JSON.stringify(challenge));
            assert.ok(challenge.titleSize >= challenge.minimumTitleSize, JSON.stringify(challenge));
            assert.ok(challenge.titleRect.top >= 0 && challenge.titleRect.bottom <= challenge.viewportHeight, JSON.stringify(challenge));
            assert.ok(challenge.noHorizontalOverflow, JSON.stringify(challenge));
            assert.strictEqual(challenge.scrollY, 0, JSON.stringify(challenge));
            assert.ok(challenge.scrollHeight <= challenge.viewportHeight + 2, JSON.stringify(challenge));

            await page.click('#challengeNextButton');
            const coach = await inspectSetupPage(page, 'coach', 'Choose your coaching', 22);
            assert.strictEqual(coach.titleText, coach.expectedTitle, JSON.stringify(coach));
            assert.strictEqual(coach.visibleTitleCount, 1, JSON.stringify(coach));
            assert.strictEqual(coach.subtitleCount, 0, JSON.stringify(coach));
            assert.ok(coach.titleSize >= coach.minimumTitleSize, JSON.stringify(coach));
            assert.ok(coach.noHorizontalOverflow, JSON.stringify(coach));
            assert.strictEqual(coach.scrollY, 0, JSON.stringify(coach));
            assert.ok(coach.scrollHeight <= coach.viewportHeight + 2, JSON.stringify(coach));

            await page.evaluate(() => document.querySelector('#principleReview').checked = false);
            await page.waitForFunction(() => !document.querySelector('#startButton').disabled);
            await page.click('#startButton');
            await page.waitForFunction(() => document.body.classList.contains('game-mode') && window.__KMATE__.state().current);
            const game = await page.evaluate(() => {
              const board = document.querySelector('#board').getBoundingClientRect();
              return {
                pieces: document.querySelectorAll('#board .piece').length,
                board: { top: board.top, bottom: board.bottom, width: board.width },
                viewportHeight: window.innerHeight,
                scrollY: window.scrollY,
                scrollHeight: document.documentElement.scrollHeight,
              };
            });
            assert.ok(game.pieces >= 2, JSON.stringify(game));
            assert.ok(game.board.top >= 0 && game.board.bottom <= game.viewportHeight + 1, JSON.stringify(game));
            assert.strictEqual(game.scrollY, 0, JSON.stringify(game));
            assert.ok(game.scrollHeight <= game.viewportHeight + 2, JSON.stringify(game));

            if (errors.length) throw new Error(errors.join('\n'));
            await context.close();
            return { challenge, coach, game };
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.BROWSER_PATH,
              args: ['--no-sandbox', '--autoplay-policy=no-user-gesture-required'],
            });
            try {
              const desktop = await verifyDesktop(browser);
              const mobile = await verifyMobile(browser);
              console.log(JSON.stringify({ ok: true, desktop, mobile }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit and publish K-Mate v40
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v40: simplify setup, fix position start, and add review exits'
          git pull --rebase origin main
          git push
