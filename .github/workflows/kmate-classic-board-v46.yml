name: K-Mate v54 uploaded-SVG board theme QA

on:
  push:
    branches: [main]
    paths:
      - "kmate-trainer/classic-board-v46.js"
      - "kmate-trainer/classic-board-v46.css"
      - "kmate-trainer/sculpted-pieces-v47.js"
      - "kmate-trainer/reference-board-v52.css"
      - "kmate-trainer/reference-board-fit-v53.css"
      - "kmate-trainer/reference-board-fit-v54.css"
      - "kmate-trainer/reference-board-fit-v54.js"
      - "kmate-trainer/move-sound-v45.js"
      - "kmate-trainer/app-v7.js"
      - "kmate-trainer/index.html"
      - "kmate-trainer/tests/classic-board-v46.spec.mjs"
      - "kmate-trainer/tests/sculpted-pieces-v47.spec.mjs"
      - "kmate-trainer/tests/mobile-board-fit-v54.spec.mjs"
      - "kmate-trainer/tests/mobile-visual-viewport-v54.spec.mjs"
      - ".github/workflows/kmate-classic-board-v46.yml"
  pull_request:
    paths:
      - "kmate-trainer/classic-board-v46.js"
      - "kmate-trainer/classic-board-v46.css"
      - "kmate-trainer/sculpted-pieces-v47.js"
      - "kmate-trainer/reference-board-v52.css"
      - "kmate-trainer/reference-board-fit-v53.css"
      - "kmate-trainer/reference-board-fit-v54.css"
      - "kmate-trainer/reference-board-fit-v54.js"
      - "kmate-trainer/move-sound-v45.js"
      - "kmate-trainer/app-v7.js"
      - "kmate-trainer/index.html"
      - "kmate-trainer/tests/classic-board-v46.spec.mjs"
      - "kmate-trainer/tests/sculpted-pieces-v47.spec.mjs"
      - "kmate-trainer/tests/mobile-board-fit-v54.spec.mjs"
      - "kmate-trainer/tests/mobile-visual-viewport-v54.spec.mjs"
      - ".github/workflows/kmate-classic-board-v46.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-theme-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate v52 theme and v54 fit wiring
        run: |
          node --check kmate-trainer/classic-board-v46.js
          node --check kmate-trainer/sculpted-pieces-v47.js
          node --check kmate-trainer/reference-board-fit-v54.js
          node --check kmate-trainer/move-sound-v45.js
          node --check kmate-trainer/app-v7.js
          node --check kmate-trainer/tests/classic-board-v46.spec.mjs
          node --check kmate-trainer/tests/sculpted-pieces-v47.spec.mjs
          node --check kmate-trainer/tests/mobile-board-fit-v54.spec.mjs
          node --check kmate-trainer/tests/mobile-visual-viewport-v54.spec.mjs
          grep -Fq "classic-board-v46.js?v=46.0.0" kmate-trainer/app-v7.js
          grep -Fq "sculpted-pieces-v47.js?v=52.0.0" kmate-trainer/app-v7.js
          grep -Fq "KMATE_REFERENCE_THEME_V52 = '52.0.0'" kmate-trainer/sculpted-pieces-v47.js
          grep -Fq "reference-board-v52.css" kmate-trainer/sculpted-pieces-v47.js
          grep -Fq "uploaded-svg-reference-theme" kmate-trainer/sculpted-pieces-v47.js
          grep -Fq "exactSilhouetteExtraction: true" kmate-trainer/sculpted-pieces-v47.js
          grep -Fq -- "--km52-light-square: #d3cebd" kmate-trainer/reference-board-v52.css
          grep -Fq -- "--km52-dark-square: #758e72" kmate-trainer/reference-board-v52.css
          grep -Fq -- "--km52-coordinate: #d55236" kmate-trainer/reference-board-v52.css
          grep -Fq "repeating-linear-gradient" kmate-trainer/reference-board-v52.css
          grep -Fq "reference-board-fit-v54.css?v=54.0.0" kmate-trainer/index.html
          grep -Fq "reference-board-fit-v54.js?v=54.0.0" kmate-trainer/index.html
          grep -Fq "app-v7.js?v=55.0.0" kmate-trainer/index.html
          grep -Fq "KMATE_MOBILE_FIT_V54 = '54.0.0'" kmate-trainer/reference-board-fit-v54.js
          grep -Fq "grid-template-rows: repeat(8" kmate-trainer/reference-board-fit-v54.css
          grep -Fq "KMATE_MOVE_SOUND_VERSION = '45.2.0'" kmate-trainer/move-sound-v45.js
          grep -Fq "legacySvg" kmate-trainer/app-v7.js

      - name: Install browser dependencies
        run: npm install --no-save @playwright/test@1.55.0 chess.js@1.4.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static K-Mate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kmate-v54-theme-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/kmate-trainer/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kmate-v54-theme-http.log
          exit 1

      - name: Test detailed pieces, texture, frame, exact fit, coordinates, and movement
        env:
          KMATE_APP_URL: http://127.0.0.1:4173/kmate-trainer/?nativeBoard=1
        run: >-
          npx playwright test
          kmate-trainer/tests/classic-board-v46.spec.mjs
          kmate-trainer/tests/sculpted-pieces-v47.spec.mjs
          kmate-trainer/tests/mobile-board-fit-v54.spec.mjs
          kmate-trainer/tests/mobile-visual-viewport-v54.spec.mjs
          --grep-invert "visualViewport smaller than the layout viewport|stable native board uses the uploaded-SVG textures"
          --workers=1
          --reporter=line

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmate-reference-theme-v54-failure
          path: |
            test-results
            /tmp/kmate-v54-theme-http.log
          if-no-files-found: ignore
          retention-days: 7
