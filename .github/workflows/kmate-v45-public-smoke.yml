name: Verify K-Mate v45 public site

on:
  push:
    paths:
      - '.github/workflows/kmate-v45-public-smoke.yml'

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser driver
        run: |
          npm install playwright-core@1.55.0 --no-save --silent
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Test deployed desktop and mobile app
        run: |
          node <<'NODE'
          const assert = require('assert');
          const { chromium } = require('playwright-core');
          const PUBLIC_URL = `https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/?v=20260830-45-public-${Date.now()}`;

          async function scenario(browser, name, contextOptions) {
            const context = await browser.newContext(contextOptions);
            const page = await context.newPage();
            page.setDefaultTimeout(20000);
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.stack || error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (/favicon|404|Failed to load resource/i.test(text)) return;
              errors.push(`console: ${text}`);
            });

            const response = await page.goto(PUBLIC_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            assert.ok(response && response.ok(), `${name}: public URL returned HTTP ${response?.status()}`);
            assert.ok(!/404|file not found/i.test(await page.title()), `${name}: public URL returned a missing-page title`);
            assert.strictEqual(new URL(page.url()).pathname, '/zhang-kohli-travel-book/kmate-trainer/');
            await page.waitForFunction(() => window.__KMATE__?.state && window.__KMATE_V45_HOTFIX__?.version === '45.0.1', null, { timeout: 45000 });

            const press = contextOptions.hasTouch
              ? selector => page.tap(selector)
              : selector => page.click(selector);

            await press('#introProceedButton');
            await page.waitForSelector('.setup-flow-page[data-setup-page="challenge"].active:not([hidden])');
            await press('#challengeNextButton');
            await page.waitForSelector('.setup-flow-page[data-setup-page="coach"].active:not([hidden])');
            await page.waitForTimeout(650);

            for (const selector of ['#coachBackButton', '#principleReview', '#liveCoach', '#startButton']) {
              const locator = page.locator(selector);
              assert.ok(await locator.isVisible(), `${name}: ${selector} is not visible`);
              assert.ok(await locator.isEnabled(), `${name}: ${selector} is disabled`);
            }

            const initialPrinciples = await page.isChecked('#principleReview');
            await press('#principleReview');
            assert.notStrictEqual(await page.isChecked('#principleReview'), initialPrinciples, `${name}: principle checkbox did not toggle`);
            await press('#principleReview');
            assert.strictEqual(await page.isChecked('#principleReview'), initialPrinciples, `${name}: principle checkbox did not toggle back`);

            const initialCoach = await page.isChecked('#liveCoach');
            await press('#liveCoach');
            assert.notStrictEqual(await page.isChecked('#liveCoach'), initialCoach, `${name}: Live Coach checkbox did not toggle`);

            await press('#coachBackButton');
            await page.waitForSelector('.setup-flow-page[data-setup-page="challenge"].active:not([hidden])');
            await press('#challengeNextButton');
            await page.waitForSelector('.setup-flow-page[data-setup-page="coach"].active:not([hidden])');

            if (await page.isChecked('#principleReview')) await press('#principleReview');
            const startedAt = Date.now();
            await press('#startButton');
            await page.waitForSelector('body.game-mode #board .piece', { timeout: 15000 });
            const pieces = await page.locator('#board .piece').count();
            const elapsedMs = Date.now() - startedAt;
            assert.ok(pieces >= 2, `${name}: game board did not contain pieces`);
            assert.ok(elapsedMs < 15000, `${name}: game took too long to open: ${elapsedMs} ms`);
            if (errors.length) throw new Error(`${name}: ${errors.join('\n')}`);

            console.log(JSON.stringify({
              name,
              publicUrl: PUBLIC_URL,
              HTTP: response.status(),
              hotfix: '45.0.1',
              pieces,
              elapsedMs,
            }, null, 2));
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({
              executablePath: process.env.CHROME_PATH,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            try {
              await scenario(browser, 'public desktop', { viewport: { width: 1440, height: 900 } });
              await scenario(browser, 'public mobile touch', {
                viewport: { width: 390, height: 844 },
                isMobile: true,
                hasTouch: true,
                deviceScaleFactor: 3,
                userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148',
              });
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
