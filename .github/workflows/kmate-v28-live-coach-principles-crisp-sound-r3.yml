name: K-Mate v28 live coach, principles, and crisp desk sound r3
on:
  push:
    paths:
      - '.github/workflows/kmate-v28-live-coach-principles-crisp-sound-r3.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build K-Mate v28
        run: |
          python -m py_compile .github/scripts/kmate_v28_prepare_patch.py .github/scripts/kmate_v28_live_coach_principles_crisp_sound.py
          python .github/scripts/kmate_v28_prepare_patch.py
          python .github/scripts/kmate_v28_live_coach_principles_crisp_sound.py
          rm -f \
            .github/workflows/inspect-kmate-sound-reference.yml \
            .github/workflows/kmate-v28-live-coach-principles-crisp-sound.yml \
            .github/workflows/kmate-v28-live-coach-principles-crisp-sound-r2.yml

      - name: Validate JavaScript, teaching UI, and crisp WAV transients
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v28.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v28.js
          grep -q "version: '28.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q "function handleLiveCoachAnalysis" kmate-trainer/app-v7-part1.txt
          grep -q "function relevantPrinciplesForPosition" kmate-trainer/app-v7-part1.txt
          grep -q "id=\"principlesDialog\"" kmate-trainer/index.html
          grep -q "id=\"liveCoachDialog\"" kmate-trainer/index.html
          python - <<'PY'
          from pathlib import Path
          import math, struct, wave
          root = Path('kmate-trainer/sounds/live-v28')
          expected = {
              'kmate-reference-move-v28.wav': (0.22, 0.24),
              'kmate-reference-capture-v28.wav': (0.32, 0.34),
              'kmate-reference-check-v28.wav': (0.40, 0.42),
          }
          for name, bounds in expected.items():
              path = root / name
              assert path.exists(), path
              assert path.stat().st_size > 40_000, (path, path.stat().st_size)
              with wave.open(str(path), 'rb') as wav:
                  assert (wav.getnchannels(), wav.getsampwidth(), wav.getframerate()) == (2, 2, 48_000)
                  duration = wav.getnframes() / wav.getframerate()
                  assert bounds[0] <= duration <= bounds[1], (path, duration)
                  samples = struct.unpack('<' + 'h' * wav.getnframes() * 2, wav.readframes(wav.getnframes()))
              mono = [(samples[i] + samples[i + 1]) / 2 for i in range(0, len(samples), 2)]
              absolute = [abs(value) for value in mono]
              attack_peak = max(absolute[:int(.028 * 48_000)] or [0])
              overall_peak_index = absolute.index(max(absolute)) / 48_000
              tail = absolute[int(.150 * 48_000):]
              tail_rms = math.sqrt(sum(value * value for value in tail) / max(1, len(tail)))
              assert attack_peak > 18_000, (path, attack_peak)
              assert overall_peak_index < 0.075, (path, overall_peak_index)
              assert attack_peak > max(1, tail_rms) * 5, (path, attack_peak, tail_rms)
          PY

      - name: Mobile browser verification
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v28-r3-server.log 2>&1 &
          BROWSER_PATH="$BROWSER_PATH" node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async () => {
            const browser = await chromium.launch({ headless: true, executablePath: process.env.BROWSER_PATH, args: ['--no-sandbox', '--autoplay-policy=no-user-gesture-required'] });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.addInitScript(() => {
              const voices = [{ name: 'Sonia Natural', lang: 'en-GB', voiceURI: 'sonia-natural', localService: true }];
              class TestUtterance { constructor(text) { this.text = text; this.onstart = null; this.onend = null; this.onerror = null; } }
              const synth = { speaking: false, getVoices: () => voices, addEventListener: () => {}, cancel() { this.speaking = false; }, speak(u) { this.speaking = true; u.onstart?.(); setTimeout(() => { this.speaking = false; u.onend?.(); }, 25); } };
              Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
              Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
            });
            const page = await context.newPage();
            page.setDefaultTimeout(120000);
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            page.on('console', message => { if (message.type() === 'error' && !message.text().includes('404')) errors.push(message.text()); });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1');

            assert.strictEqual(await page.locator('#soundStyleSelect option[value="reference-crisp"]').count(), 1);
            await page.selectOption('#soundStyleSelect', 'reference-crisp');
            await page.click('#previewSoundButton');
            await page.waitForFunction(() => window.__KMATE__.state().sound.backend === 'decoded-wav-buffer');
            await page.click('#previewCaptureButton');
            await page.waitForFunction(() => window.__KMATE__.state().sound.lastKind === 'capture');

            const demo = await page.evaluate(() => window.__KMATE__.test.startTeachingDemo());
            assert.ok(demo.paused && demo.principles.length >= 5);
            await page.waitForSelector('#principlesDialog[open]');
            assert.ok(await page.locator('#principlesList .principle-card').count() >= 5);
            assert.ok((await page.evaluate(() => window.__KMATE__.state())).clockPaused);
            await page.click('#principlesStartButton');
            await page.waitForFunction(() => !window.__KMATE__.state().principleReviewPending && !window.__KMATE__.state().clockPaused);

            await page.click('#board .sq[data-square="e2"]');
            await page.click('#board .sq[data-square="e4"]');
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.awaiting && window.__KMATE__.state().clockPaused);
            const injected = await page.evaluate(() => window.__KMATE__.test.forceLiveCoachIntervention());
            assert.ok(injected?.moveId);
            await page.waitForSelector('#liveCoachDialog[open]');
            assert.strictEqual((await page.locator('#liveCoachRating').textContent()).trim(), 'Blunder');
            assert.ok((await page.locator('#liveCoachWhy').textContent()).trim().length > 30);
            assert.ok((await page.locator('#liveCoachBestText').textContent()).trim().length > 30);
            assert.ok(await page.locator('#liveCoachPrinciples').isVisible());
            assert.ok(await page.locator('#liveCoachPrincipleList article').count() >= 1);
            assert.ok((await page.locator('#liveCoachLine').textContent()).trim().length > 3);

            await page.click('#liveCoachContinueButton');
            await page.waitForFunction(() => !window.__KMATE__.state().liveCoach.open && !window.__KMATE__.state().clockPaused);
            const state = await page.evaluate(() => window.__KMATE__.state());
            assert.ok(state.thinking || state.turn === state.userColor || state.finalized);
            assert.ok(await page.evaluate(() => document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1));
            if (errors.length) throw new Error(errors.join('\n'));
            console.log(JSON.stringify({ ok: true, demo, sound: state.sound, liveCoach: state.liveCoach }, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit and publish K-Mate v28
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v28: live coach, position principles, and original crisp desk knock'
          git pull --rebase origin main
          git push
