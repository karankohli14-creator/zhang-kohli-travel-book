name: K-Mate learning library and personalization QA

on:
  push:
    branches: [main]
    paths:
      - "kmate-trainer/learning-v40*.js"
      - "kmate-trainer/learning-v40-part*.txt"
      - "kmate-trainer/learning-library-v40.js"
      - "kmate-trainer/learning-relevance-v41*.js"
      - "kmate-trainer/learning-relevance-v41.css"
      - "kmate-trainer/personalization-v42*.js"
      - "kmate-trainer/personalization-v42-part*.txt"
      - "kmate-trainer/personalization-v42.css"
      - "kmate-trainer/app-v7-part1*.txt"
      - "kmate-trainer/learning/**"
      - "kmate-trainer/tests/learning-library-v40.spec.mjs"
      - "kmate-trainer/tests/personalization-v42.spec.mjs"
      - ".github/workflows/kmate-learning-library-qa.yml"
  pull_request:
    paths:
      - "kmate-trainer/learning-v40*.js"
      - "kmate-trainer/learning-v40-part*.txt"
      - "kmate-trainer/learning-library-v40.js"
      - "kmate-trainer/learning-relevance-v41*.js"
      - "kmate-trainer/learning-relevance-v41.css"
      - "kmate-trainer/personalization-v42*.js"
      - "kmate-trainer/personalization-v42-part*.txt"
      - "kmate-trainer/personalization-v42.css"
      - "kmate-trainer/app-v7-part1*.txt"
      - "kmate-trainer/learning/**"
      - "kmate-trainer/tests/learning-library-v40.spec.mjs"
      - "kmate-trainer/tests/personalization-v42.spec.mjs"
      - ".github/workflows/kmate-learning-library-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-learning-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser dependencies
        run: npm install --no-save @playwright/test@1.55.0 chess.js@1.4.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start the static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kmate-learning-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/kmate-trainer/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kmate-learning-http.log
          exit 1
      - name: Test open categories, custom principles, diverse lessons, and movable puzzles
        env:
          KMATE_APP_URL: http://127.0.0.1:4173/kmate-trainer/
        run: >-
          npx playwright test
          kmate-trainer/tests/learning-library-v40.spec.mjs
          kmate-trainer/tests/personalization-v42.spec.mjs
          --workers=1
          --reporter=line
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmate-personalization-v42-failure
          path: |
            test-results
            /tmp/kmate-learning-http.log
          if-no-files-found: ignore
          retention-days: 7
