name: K-Mate v26 larger pieces and crisp audio
on:
  push:
    paths:
      - '.github/workflows/kmate-v26-larger-pieces-crisp-audio.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate crisp sound profiles and patch presentation
        run: |
          python -m py_compile .github/scripts/kmate_v26_larger_pieces_crisp_audio.py
          python .github/scripts/kmate_v26_larger_pieces_crisp_audio.py
      - name: Validate application and WAV masters
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v26-combined.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v26-combined.js
          grep -q "kmate-soft-v26.wav?v=26.0.0" kmate-trainer/app-v7-part1.txt
          grep -q "#board .piece.staunton-piece{width:88%;height:88%}" kmate-trainer/styles-v7.css
          grep -q "version: '26.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          python - <<'PY'
          import math
          import struct
          import wave
          from pathlib import Path

          for name in ('soft', 'tournament', 'minimal'):
              path = Path(f'kmate-trainer/sounds/kmate-{name}-v26.wav')
              assert path.exists(), path
              assert path.stat().st_size > 1_300_000, (path, path.stat().st_size)
              with wave.open(str(path), 'rb') as wav:
                  assert wav.getnchannels() == 2
                  assert wav.getsampwidth() == 2
                  assert wav.getframerate() == 48_000
                  duration = wav.getnframes() / wav.getframerate()
                  assert 7.35 <= duration <= 7.45, duration
                  samples = struct.unpack('<' + 'h' * wav.getnframes() * 2, wav.readframes(wav.getnframes()))

              mono = [(abs(samples[i]) + abs(samples[i + 1])) / 2 for i in range(0, len(samples), 2)]
              def peak(start, length):
                  lo = int(start * 48_000)
                  hi = min(len(mono), lo + int(length * 48_000))
                  return max(mono[lo:hi] or [0])
              def rms(start, length):
                  lo = int(start * 48_000)
                  hi = min(len(mono), lo + int(length * 48_000))
                  values = mono[lo:hi]
                  return math.sqrt(sum(value * value for value in values) / max(1, len(values)))

              move_attack = peak(0.08, 0.08)
              move_tail = rms(0.30, 0.12)
              capture_attack = peak(0.70, 0.18)
              capture_tail = rms(1.12, 0.10)
              assert move_attack > 9_000, (name, move_attack)
              assert capture_attack > 10_000, (name, capture_attack)
              assert move_attack > max(1, move_tail) * 3.0, (name, move_attack, move_tail)
              assert capture_attack > max(1, capture_tail) * 3.0, (name, capture_attack, capture_tail)
          PY
      - name: Install Playwright API and serve K-Mate
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v26-server.log 2>&1 &
      - name: Verify mobile piece scale, contrast, and sampled sound
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await chromium.launch({ headless: true, executablePath: process.env.BROWSER_PATH, args: ['--no-sandbox'] });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.addInitScript(() => {
              HTMLMediaElement.prototype.play = function () { return Promise.resolve(); };
              HTMLMediaElement.prototype.pause = function () {};
            });
            const page = await context.newPage();
            page.setDefaultTimeout(120000);
            const fatalErrors = [];
            page.on('pageerror', error => fatalErrors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Failed to load resource') && text.includes('404')) return;
              fatalErrors.push(`console: ${text}`);
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1');
            await page.click('[data-side="w"]');
            await page.click('[data-time="untimed"]');
            await page.click('#startButton');
            await page.waitForSelector('#gameView:not([hidden])');
            await page.waitForSelector('#board .piece.staunton-piece');

            const presentation = await page.evaluate(() => {
              const piece = document.querySelector('#board .piece.staunton-piece');
              const square = piece.closest('.sq');
              const pieceBox = piece.getBoundingClientRect();
              const squareBox = square.getBoundingClientRect();
              const whiteSvg = document.querySelector('#board .piece.staunton-piece.white svg');
              const blackSvg = document.querySelector('#board .piece.staunton-piece.black svg');
              const light = document.querySelector('#board .sq.light');
              const dark = document.querySelector('#board .sq.dark');
              return {
                widthRatio: pieceBox.width / squareBox.width,
                heightRatio: pieceBox.height / squareBox.height,
                whiteFilter: whiteSvg ? getComputedStyle(whiteSvg).filter : '',
                blackFilter: blackSvg ? getComputedStyle(blackSvg).filter : '',
                lightBackground: getComputedStyle(light).backgroundImage,
                darkBackground: getComputedStyle(dark).backgroundImage,
                noHorizontalOverflow: document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1,
              };
            });

            assert.ok(presentation.widthRatio >= 0.84, presentation);
            assert.ok(presentation.heightRatio >= 0.84, presentation);
            assert.notStrictEqual(presentation.whiteFilter, 'none');
            assert.notStrictEqual(presentation.blackFilter, 'none');
            assert.notStrictEqual(presentation.lightBackground, presentation.darkBackground);
            assert.ok(presentation.noHorizontalOverflow);

            const soundFile = await page.evaluate(async () => {
              const response = await fetch('./sounds/kmate-soft-v26.wav?v=26.0.0', { cache: 'no-store' });
              const bytes = await response.arrayBuffer();
              return { ok: response.ok, size: bytes.byteLength };
            });
            assert.ok(soundFile.ok);
            assert.ok(soundFile.size > 1_300_000, soundFile);

            await page.click('#previewSoundButton');
            await page.waitForTimeout(100);
            const state = await page.evaluate(() => window.__KMATE__.state());
            assert.strictEqual(state.version, undefined);
            assert.strictEqual(state.sound.theme, 'soft');
            assert.strictEqual(state.sound.backend, 'sampled-wav-sprite');
            assert.ok(state.sound.unlocked);

            if (fatalErrors.length) throw new Error(fatalErrors.join('\n'));
            console.log(JSON.stringify({ ok: true, presentation, soundFile, sound: state.sound }, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Commit and publish K-Mate v26
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kmate-trainer/index.html kmate-trainer/styles-v7.css kmate-trainer/app-v7.js kmate-trainer/app-v7-part1.txt kmate-trainer/app-v7-part6.txt kmate-trainer/sounds/kmate-soft-v26.wav kmate-trainer/sounds/kmate-tournament-v26.wav kmate-trainer/sounds/kmate-minimal-v26.wav
          git commit -m 'K-Mate v26: larger high-contrast pieces and crisp audio'
          git pull --rebase origin main
          git push
