name: K-Mate v33 full-screen board and Mac audio r3
on:
  push:
    paths:
      - '.github/workflows/kmate-v33-fullscreen-mac-audio-r3.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply K-Mate v33
        run: |
          python -m py_compile .github/scripts/kmate_v33_fullscreen_mac_audio.py
          python .github/scripts/kmate_v33_fullscreen_mac_audio.py
          rm -f .github/workflows/kmate-v33-fullscreen-mac-audio.yml
          rm -f .github/workflows/kmate-v33-fullscreen-mac-audio-r2.yml
          rm -f .github/workflows/kmate-v32-scroll-mac-audio.yml
          rm -f .github/workflows/kmate-v31-live-coach-voice-principles.yml

      - name: Validate assembled application
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v33.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v33.js
          grep -q "version: '33.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q 'id="fullscreenButton"' kmate-trainer/index.html
          grep -q 'id="gameCoachAudioButton"' kmate-trainer/index.html
          grep -q 'id="panelToggleButton"' kmate-trainer/index.html
          grep -q 'function fitGameBoardToViewport' kmate-trainer/app-v7-part1.txt
          grep -q 'function primeCoachVoiceOnSessionStart' kmate-trainer/app-v7-part1.txt
          grep -q 'body.game-mode .shell' kmate-trainer/styles-v7.css
          grep -q 'overflow:hidden!important' kmate-trainer/styles-v7.css

      - name: Install Playwright and serve K-Mate
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v33-server.log 2>&1 &

      - name: Verify desktop, mobile, Live Coach, Resume, and coach audio
        run: node .github/scripts/kmate_v33_verify.js

      - name: Commit and publish K-Mate v33
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v33: fit game to full window and prime Mac coach audio'
          git pull --rebase origin main
          git push
