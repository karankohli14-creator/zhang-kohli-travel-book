name: K-Mate v39 setup and principles cleanup
on:
  push:
    paths:
      - '.github/workflows/kmate-v39-setup-principles-cleanup.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply v39 setup and principles cleanup
        run: |
          python -m py_compile .github/scripts/kmate_v39_setup_principles_cleanup.py
          python .github/scripts/kmate_v39_setup_principles_cleanup.py
          rm -f .github/workflows/kmate-v38-setup-visual-redesign.yml
          rm -f .github/workflows/kmate-v37-fixed-screen-app-shell.yml

      - name: Validate assembled app
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{n}.txt').read_text() for n in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v39.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v39.js
          grep -q "version: '39.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q "Set your chess challenge" kmate-trainer/app-v7-part6.txt
          grep -q "Choose your coaching" kmate-trainer/app-v7-part6.txt
          grep -q "function renderCompactPrincipleReview" kmate-trainer/app-v7-part6.txt
          grep -q "setup-advanced-hidden" kmate-trainer/styles-v7.css
          grep -q "principle-compact-row" kmate-trainer/styles-v7.css

      - name: Install Playwright and serve app
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v39-server.log 2>&1 &

      - name: Verify setup titles and principle screen on desktop and mobile
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          async function run(viewport) {
            const browser = await chromium.launch({headless:true, executablePath:process.env.BROWSER_PATH, args:['--no-sandbox']});
            const context = await browser.newContext({viewport});
            const page = await context.newPage();
            page.setDefaultTimeout(120000);
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'domcontentloaded'});
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1' && window.__KMATE__?.test);

            await page.click('#introProceedButton');
            await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'challenge');
            const challenge = await page.evaluate(() => {
              const pageEl = document.querySelector('.setup-flow-page[data-setup-page="challenge"]');
              const title = pageEl.querySelector('.setup-screen-copy h1').getBoundingClientRect();
              const endgame = document.querySelector('#phaseSeg [data-phase="endgame"]').getBoundingClientRect();
              return {
                titleText: pageEl.querySelector('.setup-screen-copy h1').textContent.trim(),
                title: {top:title.top,bottom:title.bottom,height:title.height},
                endgame: {top:endgame.top,bottom:endgame.bottom,width:endgame.width,height:endgame.height},
                scrollY: window.scrollY,
                scrollHeight: document.documentElement.scrollHeight,
                viewportHeight: window.innerHeight,
              };
            });
            assert.strictEqual(challenge.titleText, 'Set your chess challenge');
            assert.ok(challenge.title.top >= 0 && challenge.title.bottom <= challenge.viewportHeight, challenge);
            assert.ok(challenge.endgame.width > 70 && challenge.endgame.height > 35, challenge);
            assert.strictEqual(challenge.scrollY, 0, challenge);
            assert.ok(challenge.scrollHeight <= challenge.viewportHeight + 2, challenge);

            await page.click('#challengeNextButton');
            await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'coach');
            const coach = await page.evaluate(() => {
              const pageEl = document.querySelector('.setup-flow-page[data-setup-page="coach"]');
              const title = pageEl.querySelector('.setup-screen-copy h1').getBoundingClientRect();
              return {
                titleText: pageEl.querySelector('.setup-screen-copy h1').textContent.trim(),
                title: {top:title.top,bottom:title.bottom},
                advancedDisplay: getComputedStyle(document.querySelector('.compact-beta-tools')).display,
                scrollY: window.scrollY,
                scrollHeight: document.documentElement.scrollHeight,
                viewportHeight: window.innerHeight,
              };
            });
            assert.strictEqual(coach.titleText, 'Choose your coaching');
            assert.ok(coach.title.top >= 0 && coach.title.bottom <= coach.viewportHeight, coach);
            assert.strictEqual(coach.advancedDisplay, 'none', coach);
            assert.strictEqual(coach.scrollY, 0, coach);
            assert.ok(coach.scrollHeight <= coach.viewportHeight + 2, coach);

            await page.evaluate(() => window.__KMATE__.test.startTeachingDemo());
            await page.waitForSelector('#principlesDialog[open]');
            await page.waitForFunction(() => document.querySelectorAll('#principlesList .principle-compact-row').length === 5);
            await page.waitForTimeout(80);
            const principles = await page.evaluate(() => {
              const dialog = document.querySelector('#principlesDialog').getBoundingClientRect();
              const card = document.querySelector('#principlesDialog .modal-card').getBoundingClientRect();
              const title = document.querySelector('#principlesPositionTitle').getBoundingClientRect();
              const rows = [...document.querySelectorAll('#principlesList .principle-compact-row')].map(el => ({
                text: el.textContent.trim(), rect: el.getBoundingClientRect().toJSON(),
              }));
              const start = document.querySelector('#principlesStartButton').getBoundingClientRect();
              return {
                titleText: document.querySelector('#principlesPositionTitle').textContent.trim(),
                dialog:{top:dialog.top,bottom:dialog.bottom,height:dialog.height},
                card:{top:card.top,bottom:card.bottom,height:card.height},
                title:{top:title.top,bottom:title.bottom,height:title.height},
                rows,
                start:{top:start.top,bottom:start.bottom,height:start.height},
                scrollY:window.scrollY,
                docHeight:document.documentElement.scrollHeight,
                viewportHeight:window.innerHeight,
                dialogScroll:document.querySelector('#principlesDialog').scrollHeight,
                dialogClient:document.querySelector('#principlesDialog').clientHeight,
              };
            });
            assert.ok(principles.titleText.includes('key principles'), principles);
            assert.strictEqual(principles.rows.length, 5, principles);
            assert.ok(principles.rows.every(r => r.text.length > 3 && r.rect.top >= 0 && r.rect.bottom <= principles.viewportHeight), principles);
            assert.ok(principles.title.top >= 0 && principles.title.bottom <= principles.viewportHeight, principles);
            assert.ok(principles.start.top >= 0 && principles.start.bottom <= principles.viewportHeight, principles);
            assert.strictEqual(principles.scrollY, 0, principles);
            assert.ok(principles.docHeight <= principles.viewportHeight + 2, principles);
            assert.ok(principles.dialogScroll <= principles.dialogClient + 2, principles);

            await browser.close();
            return {challenge, coach, principles};
          }

          (async()=>{
            const desktop = await run({width:1440,height:900});
            const mobile = await run({width:390,height:844});
            console.log(JSON.stringify({ok:true,desktop,mobile},null,2));
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE

      - name: Commit and publish v39
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/scripts/kmate_v39_setup_principles_cleanup.py .github/workflows
          git commit -m 'K-Mate v39: clarify setup and compact principle review'
          git pull --rebase origin main
          git push
