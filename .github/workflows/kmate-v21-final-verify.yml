name: K-Mate v21 final coach replay verification
on:
  push:
    paths:
      - '.github/workflows/kmate-v21-final-verify.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v21 and final replay fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          script = Path('.github/scripts/kmate_v21_avatar_voice_mobile.py')
          text = script.read_text()
          text = text.replace(
              'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)',
              'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)',
              1,
          )
          script.write_text(text)
          PY
          python .github/scripts/kmate_v21_avatar_voice_mobile.py
          python - <<'PY'
          from pathlib import Path

          css_path = Path('kmate-trainer/styles-v7.css')
          css = css_path.read_text()
          hidden_rule = '\n.replay-comparison[hidden],.replay-line[hidden],.replay-best-button[hidden]{display:none!important}\n'
          if hidden_rule.strip() not in css:
              css += hidden_rule
          css_path.write_text(css)

          app_path = Path('kmate-trainer/app-v7-part1.txt')
          app = app_path.read_text()
          old = "    if (finalized) renderPostGameReview(currentSession);"
          new = "    if (finalized) {\n      renderPostGameReview(currentSession);\n      if ($('#replayDialog')?.open && replayState.session?.id === sessionId) renderCoachReplay();\n    }"
          if old not in app:
              raise SystemExit('finalized analysis refresh marker missing')
          app_path.write_text(app.replace(old, new, 1))
          PY
      - name: Validate JavaScript, HTML markers, and v21 audio
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          import wave
          parts = [Path(f'kmate-trainer/app-v7-part{n}.txt').read_text() for n in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v21-final.js').write_text(''.join(parts))
          sound = Path('kmate-trainer/sounds/kmate-sounds-v21.wav')
          assert sound.exists() and sound.stat().st_size > 500000
          with wave.open(str(sound), 'rb') as wav:
              assert wav.getnchannels() == 2
              assert wav.getframerate() == 44100
              assert wav.getnframes() / wav.getframerate() > 7.0
          PY
          node --check /tmp/kmate-v21-final.js
          grep -q 'id="coachAvatar"' kmate-trainer/index.html
          grep -q 'id="coachVoiceToggle"' kmate-trainer/index.html
          grep -q 'id="replayWhyText"' kmate-trainer/index.html
          grep -q 'id="replayBestText"' kmate-trainer/index.html
          grep -q 'function speakCoachFrame' kmate-trainer/app-v7-part1.txt
          grep -q 'function decisionShortfall' kmate-trainer/app-v7-part1.txt
          grep -q 'kmate-sounds-v21.wav' kmate-trainer/app-v7-part1.txt
          grep -q "version: '21.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
      - name: Install Chromium
        run: |
          npm install playwright@1.55.0 --no-save --silent
          npx playwright install --with-deps chromium
      - name: Serve K-Mate
        run: |
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v21-final-server.log 2>&1 &
      - name: Test timeout, Coach K, narration, graphics, and mobile layout
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          async function waitForUserTurn(page) {
            await page.waitForFunction(() => {
              const state = window.__KMATE__?.state?.();
              return state && !state.finalized && state.turn === state.userColor;
            }, null, { timeout: 90000 });
          }

          async function makeFirstLegalMove(page) {
            return page.evaluate(() => {
              const cls = window.__KMATE__.state().userColor === 'w' ? 'white' : 'black';
              for (const square of document.querySelectorAll('#board .sq')) {
                if (!square.querySelector(`.piece.${cls}`)) continue;
                square.click();
                const target = document.querySelector('#board .sq.legal, #board .sq.capture');
                if (target) { target.click(); return true; }
              }
              return false;
            });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.addInitScript(() => {
              window.__coachSpeakCalls = [];
              class TestUtterance {
                constructor(text) {
                  this.text = text;
                  this.lang = 'en-US';
                  this.rate = 1;
                  this.pitch = 1;
                  this.volume = 1;
                  this.onstart = null;
                  this.onend = null;
                  this.onerror = null;
                }
              }
              const synth = {
                speaking: false,
                pending: false,
                paused: false,
                getVoices: () => [{ name: 'Samantha Test', lang: 'en-US', localService: true }],
                addEventListener: () => {},
                cancel() { this.speaking = false; this.pending = false; },
                speak(utterance) {
                  this.speaking = true;
                  window.__coachSpeakCalls.push(utterance.text);
                  utterance.onstart?.();
                  setTimeout(() => {
                    this.speaking = false;
                    utterance.onend?.();
                  }, 1600);
                },
              };
              Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
              Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
              window.__kmateAudioPlayCalls = 0;
              const originalPlay = HTMLMediaElement.prototype.play;
              HTMLMediaElement.prototype.play = function (...args) {
                window.__kmateAudioPlayCalls += 1;
                return originalPlay.apply(this, args);
              };
            });

            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => { if (message.type() === 'error') errors.push(`console: ${message.text()}`); });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1', null, { timeout: 120000 });

            await page.click('#soundToggle');
            await page.waitForFunction(() => window.__KMATE__.state().sound.audibleConfirmed === true, null, { timeout: 30000 });
            assert.strictEqual(window === undefined, false);
            await page.click('#startButton');
            await page.waitForSelector('#gameView:not([hidden])', { timeout: 30000 });
            await waitForUserTurn(page);
            assert.ok(await makeFirstLegalMove(page), 'could not make a legal move');

            assert.strictEqual(await page.evaluate(() => window.__KMATE__.test.forceTimeout(window.__KMATE__.state().userColor)), true);
            await page.waitForSelector('#resultDialog[open]', { timeout: 15000 });
            const timeoutState = await page.evaluate(() => window.__KMATE__.state());
            assert.strictEqual(timeoutState.finalized, true, 'game did not end on timeout');
            assert.ok(String(timeoutState.reason).startsWith('timeout'));
            assert.strictEqual(await page.locator('#resultInsights').isVisible(), true);
            assert.strictEqual(await page.locator('#resultReplay').isEnabled(), true);

            await page.click('#resultReplay');
            await page.waitForSelector('#replayDialog[open]', { timeout: 15000 });
            assert.strictEqual(await page.locator('#replayBoard .sq').count(), 64);
            assert.ok(await page.locator('#replayBoard .piece.staunton-piece svg').count() >= 10);
            assert.strictEqual(await page.locator('#coachAvatar svg').count(), 1);
            assert.strictEqual(await page.locator('#coachVoiceToggle').count(), 1);
            assert.strictEqual(await page.locator('#replayComparison').evaluate(el => el.hidden), true, 'placeholder comparison is visible at replay start');

            // Disable automatic narration during navigation, then request it explicitly.
            if (await page.locator('#coachVoiceToggle').evaluate(el => el.classList.contains('active'))) {
              await page.click('#coachVoiceToggle');
            }
            for (let attempt = 0; attempt < 8; attempt += 1) {
              const hidden = await page.locator('#replayComparison').evaluate(el => el.hidden);
              if (!hidden) break;
              if (await page.locator('#replayNext').isDisabled()) break;
              await page.click('#replayNext');
            }
            await page.waitForFunction(() => {
              const comparison = document.querySelector('#replayComparison');
              return comparison && comparison.hidden === false;
            }, null, { timeout: 30000 });

            const whyText = (await page.locator('#replayWhyText').textContent()).trim();
            const bestText = (await page.locator('#replayBestText').textContent()).trim();
            assert.ok(whyText.length > 30, `why explanation too short: ${whyText}`);
            assert.ok(bestText.length > 30, `best explanation too short: ${bestText}`);

            await page.evaluate(() => { window.__coachSpeakCalls = []; });
            await page.click('#coachSpeakButton');
            await page.waitForFunction(() => window.__coachSpeakCalls.length > 0, null, { timeout: 10000 });
            assert.ok(await page.locator('#coachAvatar').evaluate(el => el.classList.contains('speaking')));
            const spoken = await page.evaluate(() => window.__coachSpeakCalls.at(-1));
            assert.ok(spoken.includes('About your move') && spoken.includes('The stronger move'), spoken);

            const layout = await page.evaluate(() => {
              const dialog = document.querySelector('#replayDialog');
              const shell = document.querySelector('.replay-shell');
              const board = document.querySelector('#replayBoard');
              const coach = document.querySelector('#replayCoachCard');
              const avatar = document.querySelector('#coachAvatar');
              const piece = document.querySelector('#replayBoard .piece.staunton-piece');
              const square = piece.closest('.sq');
              const dr = dialog.getBoundingClientRect();
              const br = board.getBoundingClientRect();
              const cr = coach.getBoundingClientRect();
              const ar = avatar.getBoundingClientRect();
              const pr = piece.getBoundingClientRect();
              const sr = square.getBoundingClientRect();
              return {
                dialogTop: dr.top,
                dialogBottom: dr.bottom,
                shellOverflow: shell.scrollHeight - shell.clientHeight,
                boardWidth: br.width,
                boardBottom: br.bottom,
                coachTop: cr.top,
                coachBottom: cr.bottom,
                avatarVisible: ar.width > 45 && ar.bottom <= 844,
                pieceRatio: Math.max(pr.width / sr.width, pr.height / sr.height),
              };
            });
            assert.ok(layout.dialogTop >= -1 && layout.dialogBottom <= 845, JSON.stringify(layout));
            assert.ok(layout.shellOverflow <= 12, JSON.stringify(layout));
            assert.ok(layout.boardWidth >= 170 && layout.boardWidth <= 245, JSON.stringify(layout));
            assert.ok(layout.coachTop >= layout.boardBottom - 3 && layout.coachBottom <= 845, JSON.stringify(layout));
            assert.ok(layout.avatarVisible, JSON.stringify(layout));
            assert.ok(layout.pieceRatio <= 0.68, JSON.stringify(layout));
            assert.ok((await page.evaluate(() => window.__kmateAudioPlayCalls)) >= 1);
            if (errors.length) throw new Error(errors.join('\n'));
            console.log(JSON.stringify({ ok: true, timeoutState, whyText, bestText, spoken, layout }, null, 2));
            await page.screenshot({ path: '/tmp/kmate-v21-final-mobile.png', fullPage: true });
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Commit K-Mate v21
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/kmate_v21_avatar_voice_mobile.py kmate-trainer/index.html kmate-trainer/styles-v7.css kmate-trainer/app-v7.js kmate-trainer/app-v7-part1.txt kmate-trainer/app-v7-part6.txt kmate-trainer/sounds/kmate-sounds-v21.wav
          git commit -m 'K-Mate v21: Coach K voice and one-screen mobile review' || exit 0
          git push
