name: K-Mate v46 safe curated start r2

on:
  push:
    paths:
      - '.github/workflows/kmate-v46-safe-curated-start-r2.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build v46 safe start
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = '46.0.0'
          part_path = Path('kmate-trainer/app-v7-part6.txt')
          part = part_path.read_text()

          safe_runtime = r'''
          function chooseImmediateCuratedPosition() {
            const targetRating = Number(settings.positionRating) || 1600;
            const requestedPhase = settings.phase || 'middlegame';
            const requestedOpening = settings.opening || 'all';
            const all = Array.isArray(validPositions) && validPositions.length
              ? validPositions.filter((position) => position && position.fen)
              : (Array.isArray(POSITIONS) ? POSITIONS.filter((position) => position && position.fen) : []);
            if (!all.length) throw new Error('No curated training position is available.');

            let pool = all.filter((position) => position.phase === requestedPhase);
            if (!pool.length) pool = all;
            if (requestedPhase !== 'endgame' && requestedOpening !== 'all') {
              const openingPool = pool.filter((position) => position.opening === requestedOpening);
              if (openingPool.length) pool = openingPool;
            }

            let nearest = Infinity;
            for (const position of pool) {
              nearest = Math.min(nearest, Math.abs((Number(position.rating) || targetRating) - targetRating));
            }
            const shortlist = pool.filter((position) => Math.abs((Number(position.rating) || targetRating) - targetRating) <= nearest + 125);
            const choices = shortlist.length ? shortlist : pool;
            let index = 0;
            try {
              index = Math.max(0, Number(localStorage.getItem('kmate-v46-curated-index')) || 0);
              localStorage.setItem('kmate-v46-curated-index', String(index + 1));
            } catch {}
            const anchor = choices[index % choices.length] || choices[0] || all[0];
            if (!anchor) throw new Error('No curated training position is available.');
            return {
              ...anchor,
              id: `safe-${anchor.id || 'position'}-${Date.now()}`,
              seedId: anchor.id || null,
              generated: false,
              custom: false,
              variationPlies: 0,
            };
          }

          function startImmediateCuratedPosition(options = {}) {
            queuedCustomPosition = chooseImmediateCuratedPosition();
            return startPosition(options && typeof options === 'object' ? options : {});
          }
          '''

          if 'function chooseImmediateCuratedPosition()' not in part:
            marker = '\nwindow.__KMATE__ = {\n'
            if part.count(marker) != 1:
              raise SystemExit('K-Mate API marker not found')
            part = part.replace(marker, '\n' + safe_runtime.strip() + '\n\nwindow.__KMATE__ = {\n', 1)
          if 'startSafe: startImmediateCuratedPosition' not in part:
            marker = '  start: startPosition,\n'
            if part.count(marker) != 1:
              raise SystemExit('K-Mate start API marker not found')
            part = part.replace(marker, marker + '  startSafe: startImmediateCuratedPosition,\n', 1)
          part_path.write_text(part)

          hotfix = r'''/* K-Mate v46 safe start for iPhone and WebKit. */
          (() => {
            'use strict';
            const VERSION = '46.0.0';
            const $ = (selector) => document.querySelector(selector);

            try {
              if (localStorage.getItem('kmate-v46-safe-start-migrated') !== '1') {
                ['kmate-generated-v23', 'kmate-generation-tree-v23', 'kmate-generation-counter-v23']
                  .forEach((key) => localStorage.removeItem(key));
                localStorage.setItem('kmate-v46-safe-start-migrated', '1');
              }
            } catch {}

            function boardIsOpen() {
              return document.body.classList.contains('game-mode')
                && Boolean($('#gameView') && !$('#gameView').hidden)
                && document.querySelectorAll('#board .piece').length >= 2;
            }

            function resetButton(button) {
              if (!button) return;
              button.dataset.starting = '0';
              button.dataset.kmateStarting = '0';
              button.disabled = false;
              button.removeAttribute('aria-busy');
              button.textContent = 'Generate position';
            }

            function fail(button, message) {
              resetButton(button);
              const box = $('#loadError');
              if (box) {
                box.textContent = message;
                box.hidden = false;
                box.classList.add('show');
              }
            }

            function wire() {
              window.__KMATE_V45_HOTFIX__?.sanitize?.();
              const oldButton = $('#startButton');
              if (!oldButton || oldButton.dataset.kmateV46Wired === '1') return;
              const button = oldButton.cloneNode(true);
              button.dataset.kmateV45Wired = '1';
              button.dataset.kmateV46Wired = '1';
              resetButton(button);
              oldButton.replaceWith(button);

              button.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopImmediatePropagation();
                if (button.dataset.kmateStarting === '1' || boardIsOpen()) return;
                $('#loadError')?.classList.remove('show');
                button.dataset.kmateStarting = '1';
                button.dataset.starting = '1';
                button.disabled = true;
                button.setAttribute('aria-busy', 'true');
                button.textContent = 'Opening board…';

                requestAnimationFrame(() => setTimeout(() => {
                  try {
                    const start = window.__KMATE__?.startSafe;
                    if (typeof start !== 'function') throw new Error('The safe position starter did not load.');
                    start();
                  } catch (error) {
                    console.error('K-Mate v46 start failed.', error);
                    fail(button, `The board could not open: ${error?.message || 'unknown error'}`);
                    return;
                  }
                  setTimeout(() => {
                    if (boardIsOpen()) resetButton(button);
                    else fail(button, 'The board did not open. Reload this page once and try again.');
                  }, 2200);
                }, 0));
              });
            }

            new MutationObserver(wire).observe(document.documentElement, { childList: true, subtree: true });
            window.addEventListener('pageshow', wire);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) wire(); });
            wire();
            setInterval(wire, 1200);
            window.__KMATE_V46__ = { version: VERSION, wire, boardIsOpen };
          })();
          '''
          Path('kmate-trainer/hotfix-v46-safe-start.js').write_text(hotfix)

          loader_path = Path('kmate-trainer/app-v7.js')
          loader = loader_path.read_text()
          loader = re.sub(r'positions-v7\.js\?v=[^\'"`]+', 'positions-v7.js?v=' + version, loader)
          part_replacement = 'app-v7-part' + '${number}' + '.txt?v=' + version
          loader = re.sub(r'app-v7-part\$\{number\}\.txt\?v=[^\'"`]+', part_replacement, loader)
          loader = re.sub(r'hotfix-v45\.js\?v=[^\'"`]+', 'hotfix-v45.js?v=' + version, loader)
          if 'hotfix-v46-safe-start.js' not in loader:
            loader += "\nawait import('./hotfix-v46-safe-start.js?v=" + version + "');\n"
          loader_path.write_text(loader)

          index_path = Path('kmate-trainer/index.html')
          index = index_path.read_text()
          index = re.sub(r'styles-v7\.css\?v=[^"\']+', 'styles-v7.css?v=' + version, index, count=1)
          index = re.sub(r'app-v7\.js\?v=[^"\']+', 'app-v7.js?v=' + version, index, count=1)
          index_path.write_text(index)
          PY

      - name: Validate JavaScript
        run: |
          cat kmate-trainer/app-v7-part{1,2,3,4,5,6}.txt > /tmp/kmate-v46-module.js
          node --check /tmp/kmate-v46-module.js
          node --check kmate-trainer/app-v7.js
          node --check kmate-trainer/hotfix-v45.js
          node --check kmate-trainer/hotfix-v46-safe-start.js
          grep -q 'startSafe: startImmediateCuratedPosition' kmate-trainer/app-v7-part6.txt
          grep -q 'hotfix-v46-safe-start.js?v=46.0.0' kmate-trainer/app-v7.js
          grep -q 'app-v7.js?v=46.0.0' kmate-trainer/index.html

      - name: Install real browser engines
        run: |
          npm install playwright@1.55.0 --no-save --silent
          npx playwright install --with-deps chromium webkit

      - name: Test locally in Chromium and WebKit
        run: |
          python3 -m http.server 4173 --directory . >/tmp/kmate-v46-server.log 2>&1 &
          node <<'NODE'
          const assert = require('assert');
          const { chromium, webkit } = require('playwright');
          const url = 'http://127.0.0.1:4173/kmate-trainer/?v=46-local';

          async function scenario(browserType, name, options) {
            const browser = await browserType.launch({ headless: true });
            const context = await browser.newContext(options);
            await context.addInitScript(() => {
              try {
                localStorage.setItem('kmate-generated-v23', JSON.stringify(Array.from({ length: 2200 }, (_, i) => `stale-${i}`)));
                localStorage.setItem('kmate-generation-tree-v23', '{broken');
                localStorage.setItem('kmate-generation-counter-v23', '999999');
              } catch {}
            });
            const page = await context.newPage();
            page.setDefaultTimeout(25000);
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => window.__KMATE__?.startSafe && window.__KMATE_V46__?.version === '46.0.0', null, { timeout: 45000 });
            if (await page.locator('#introProceedButton').isVisible()) await page.locator('#introProceedButton').click();
            if (await page.locator('#challengeNextButton').isVisible()) await page.locator('#challengeNextButton').click();
            await page.locator('#startButton').waitFor({ state: 'visible' });
            if (await page.locator('#principleReview').isChecked()) await page.locator('#principleReview').uncheck();
            const started = Date.now();
            await page.locator('#startButton').click();
            await page.waitForSelector('body.game-mode #board .piece', { timeout: 7000 });
            const elapsed = Date.now() - started;
            const pieces = await page.locator('#board .piece').count();
            const state = await page.evaluate(() => window.__KMATE__.state());
            assert.ok(pieces >= 2, `${name}: board has no pieces`);
            assert.ok(elapsed < 7000, `${name}: board took ${elapsed} ms`);
            assert.strictEqual(state.generated, false, `${name}: unsafe generator was used`);
            console.log(JSON.stringify({ name, elapsed, pieces, current: state.current }, null, 2));
            await browser.close();
          }

          (async () => {
            await scenario(chromium, 'Chromium desktop', { viewport: { width: 1440, height: 900 } });
            await scenario(webkit, 'WebKit phone', { viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, deviceScaleFactor: 3 });
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Publish v46
        run: |
          git config user.name 'karankohli14-creator'
          git config user.email 'karankohli14@gmail.com'
          git add kmate-trainer/index.html kmate-trainer/app-v7.js kmate-trainer/app-v7-part6.txt kmate-trainer/hotfix-v46-safe-start.js
          git commit -m 'K-Mate v46: bypass slow generator and open the board instantly'
          git push

      - name: Wait for GitHub Pages
        run: |
          for attempt in $(seq 1 72); do
            body="$(curl -fsSL "https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/app-v7.js?probe=$RANDOM" || true)"
            if printf '%s' "$body" | grep -q 'hotfix-v46-safe-start.js?v=46.0.0'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Test the deployed public app in WebKit
        run: |
          node <<'NODE'
          const assert = require('assert');
          const { webkit } = require('playwright');
          (async () => {
            const browser = await webkit.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, deviceScaleFactor: 3 });
            const page = await context.newPage();
            page.setDefaultTimeout(25000);
            const url = `https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/?v=46-public-${Date.now()}`;
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            assert.ok(response?.ok(), `HTTP ${response?.status()}`);
            await page.waitForFunction(() => window.__KMATE__?.startSafe && window.__KMATE_V46__?.version === '46.0.0', null, { timeout: 45000 });
            if (await page.locator('#introProceedButton').isVisible()) await page.locator('#introProceedButton').tap();
            if (await page.locator('#challengeNextButton').isVisible()) await page.locator('#challengeNextButton').tap();
            await page.locator('#startButton').waitFor({ state: 'visible' });
            if (await page.locator('#principleReview').isChecked()) await page.locator('#principleReview').uncheck();
            const started = Date.now();
            await page.locator('#startButton').tap();
            await page.waitForSelector('body.game-mode #board .piece', { timeout: 7000 });
            const elapsed = Date.now() - started;
            const pieces = await page.locator('#board .piece').count();
            const generated = await page.evaluate(() => window.__KMATE__.state().generated);
            assert.ok(pieces >= 2);
            assert.ok(elapsed < 7000, `Public board took ${elapsed} ms`);
            assert.strictEqual(generated, false);
            console.log(JSON.stringify({ url, elapsed, pieces, generated }, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
