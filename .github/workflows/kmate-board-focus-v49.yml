name: K-Mate v49 board focus and coach voice QA

on:
  push:
    branches: [main]
    paths:
      - "kmate-trainer/mobile-board-focus-v49.js"
      - "kmate-trainer/mobile-board-focus-v49.css"
      - "kmate-trainer/app-v7.js"
      - "kmate-trainer/index.html"
      - "kmate-trainer/tests/mobile-board-focus-v49.spec.mjs"
      - ".github/workflows/kmate-board-focus-v49.yml"
  pull_request:
    paths:
      - "kmate-trainer/mobile-board-focus-v49.js"
      - "kmate-trainer/mobile-board-focus-v49.css"
      - "kmate-trainer/app-v7.js"
      - "kmate-trainer/index.html"
      - "kmate-trainer/tests/mobile-board-focus-v49.spec.mjs"
      - ".github/workflows/kmate-board-focus-v49.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate v49 source wiring
        run: |
          node --check kmate-trainer/mobile-board-focus-v49.js
          node --check kmate-trainer/app-v7.js
          node --check kmate-trainer/tests/mobile-board-focus-v49.spec.mjs
          grep -Fq "mobile-board-focus-v49.js?v=49.0.0" kmate-trainer/app-v7.js
          grep -Fq "KMATE_EFFECTIVE_MOVE_VOLUME_V49 = 0.10" kmate-trainer/mobile-board-focus-v49.js
          grep -Fq "km49-fullscreen" kmate-trainer/mobile-board-focus-v49.css
          grep -Fq "#kmateHintEdgeButton" kmate-trainer/mobile-board-focus-v49.css
          grep -Fq "Why your move was bad" kmate-trainer/mobile-board-focus-v49.js

      - name: Install browser dependencies
        run: npm install --no-save @playwright/test@1.55.0 chess.js@1.4.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static K-Mate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kmate-v49-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/kmate-trainer/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kmate-v49-http.log
          exit 1

      - name: Test board-first mobile play, fullscreen, hint, voice, and volume
        env:
          KMATE_APP_URL: http://127.0.0.1:4173/kmate-trainer/?nativeBoard=1
        run: >-
          npx playwright test
          kmate-trainer/tests/mobile-board-focus-v49.spec.mjs
          --workers=1
          --reporter=line

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmate-board-focus-v49-failure
          path: |
            test-results
            /tmp/kmate-v49-http.log
          if-no-files-found: ignore
          retention-days: 7
