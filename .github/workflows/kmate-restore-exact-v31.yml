name: Restore K-Mate exactly to v31

on:
  push:
    paths:
      - '.github/workflows/kmate-restore-exact-v31.yml'

permissions:
  contents: write

jobs:
  restore-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V31_COMMIT: 5009dc306d606cbe00a377dac17dfce11559056c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore only kmate-trainer from the exact v31 commit
        run: |
          git cat-file -e "$V31_COMMIT^{commit}"
          rm -rf kmate-trainer
          git checkout "$V31_COMMIT" -- kmate-trainer
          git add -A kmate-trainer

      - name: Verify the restored files are exactly the v31 tree
        run: |
          test -z "$(git diff --no-index --name-only <(git ls-tree -r --name-only "$V31_COMMIT" kmate-trainer | sort) <(find kmate-trainer -type f | sort) || true)" || {
            echo 'Restored filename set differs from v31:'
            diff -u <(git ls-tree -r --name-only "$V31_COMMIT" kmate-trainer | sort) <(find kmate-trainer -type f | sort)
            exit 1
          }
          grep -q "version: '31.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          ! test -e kmate-trainer/hotfix-v45.js
          ! test -e kmate-trainer/hotfix-v46-safe-start.js
          git diff --cached --stat

      - name: Validate restored JavaScript
        run: |
          node --check kmate-trainer/app-v7.js
          cat kmate-trainer/app-v7-part{1,2,3,4,5,6}.txt > /tmp/kmate-v31-module.js
          node --check /tmp/kmate-v31-module.js

      - name: Install real Chromium and WebKit browsers
        run: |
          npm install playwright@1.55.0 --no-save --silent
          npx playwright install --with-deps chromium webkit

      - name: Test v31 locally in desktop Chromium and phone WebKit
        run: |
          python3 -m http.server 4173 --directory . >/tmp/kmate-v31-server.log 2>&1 &
          node <<'NODE'
          const assert = require('assert');
          const { chromium, webkit } = require('playwright');
          const URL = 'http://127.0.0.1:4173/kmate-trainer/?restore=v31-local';

          async function test(browserType, name, options) {
            const browser = await browserType.launch({ headless: true });
            const context = await browser.newContext(options);
            const page = await context.newPage();
            page.setDefaultTimeout(70000);
            const errors = [];
            page.on('pageerror', error => errors.push(error.stack || error.message));
            const response = await page.goto(URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            assert.ok(response?.ok(), `${name}: HTTP ${response?.status()}`);
            await page.waitForFunction(() => window.__KMATE__?.version === '31.0-commercial-beta', null, { timeout: 60000 });
            await page.waitForFunction(() => {
              const button = document.querySelector('#startButton');
              return button && !button.disabled;
            }, null, { timeout: 60000 });
            const principle = page.locator('#principleReview');
            if (await principle.count() && await principle.isChecked()) await principle.uncheck();
            const start = page.locator('#startButton');
            const startedAt = Date.now();
            if (options.hasTouch) await start.tap(); else await start.click();
            await page.waitForSelector('#gameView:not([hidden]) #board .piece', { timeout: 15000 });
            const pieces = await page.locator('#board .piece').count();
            const state = await page.evaluate(() => window.__KMATE__.state());
            assert.ok(pieces >= 2, `${name}: board has no pieces`);
            assert.ok(state.current, `${name}: no active position`);
            assert.ok(!errors.length, `${name}: ${errors.join('\n')}`);
            console.log(JSON.stringify({ name, elapsed: Date.now() - startedAt, pieces, current: state.current, version: window.__KMATE__?.version }, null, 2));
            await browser.close();
          }

          (async () => {
            await test(chromium, 'Chromium desktop', { viewport: { width: 1440, height: 900 } });
            await test(webkit, 'WebKit phone', { viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, deviceScaleFactor: 3 });
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit the exact v31 app rollback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore K-Mate app exactly to v31'
          git push

      - name: Wait for GitHub Pages to serve v31
        run: |
          for attempt in $(seq 1 90); do
            body="$(curl -fsSL "https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/app-v7-part6.txt?restore=v31-$RANDOM" || true)"
            if printf '%s' "$body" | grep -q "version: '31.0-commercial-beta'"; then
              echo 'GitHub Pages is serving K-Mate v31.'
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for the v31 deployment.' >&2
          exit 1

      - name: Verify the deployed public v31 app in WebKit
        run: |
          node <<'NODE'
          const assert = require('assert');
          const { webkit } = require('playwright');

          (async () => {
            const browser = await webkit.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              isMobile: true,
              hasTouch: true,
              deviceScaleFactor: 3,
            });
            const page = await context.newPage();
            page.setDefaultTimeout(70000);
            const url = `https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/?restore=v31-public-${Date.now()}`;
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            assert.ok(response?.ok(), `HTTP ${response?.status()}`);
            await page.waitForFunction(() => window.__KMATE__?.version === '31.0-commercial-beta', null, { timeout: 60000 });
            await page.waitForFunction(() => {
              const button = document.querySelector('#startButton');
              return button && !button.disabled;
            }, null, { timeout: 60000 });
            const principle = page.locator('#principleReview');
            if (await principle.count() && await principle.isChecked()) await principle.uncheck();
            const startedAt = Date.now();
            await page.locator('#startButton').tap();
            await page.waitForSelector('#gameView:not([hidden]) #board .piece', { timeout: 15000 });
            const pieces = await page.locator('#board .piece').count();
            const version = await page.evaluate(() => window.__KMATE__.version);
            assert.ok(pieces >= 2);
            assert.strictEqual(version, '31.0-commercial-beta');
            console.log(JSON.stringify({ url, elapsed: Date.now() - startedAt, pieces, version }, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
