name: K-Mate v31 Live Coach voice and principles
on:
  push:
    paths:
      - '.github/workflows/kmate-v31-live-coach-voice-principles.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply spoken Live Coach and principle diagnosis
        run: |
          python -m py_compile .github/scripts/kmate_v31_live_coach_voice_principles.py
          python .github/scripts/kmate_v31_live_coach_voice_principles.py
          rm -f .github/workflows/kmate-v30-persistent-balanced-live-coach.yml

      - name: Validate assembled application
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v31.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v31.js
          grep -q "version: '31.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q 'id="liveCoachVoice"' kmate-trainer/index.html
          grep -q 'id="liveCoachVoiceToggle"' kmate-trainer/index.html
          grep -q 'id="liveCoachPrincipleHeadline"' kmate-trainer/index.html
          grep -q 'function playLiveCoachCue' kmate-trainer/app-v7-part1.txt
          grep -q 'function toggleLiveCoachVoice' kmate-trainer/app-v7-part1.txt
          grep -q 'Principle diagnosis' kmate-trainer/app-v7-part1.txt
          grep -q 'principle-diagnosis-card' kmate-trainer/styles-v7.css
          grep -q 'startLiveCoachPrincipleDemo' kmate-trainer/app-v7-part6.txt

      - name: Install Playwright and serve K-Mate
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v31-server.log 2>&1 &

      - name: Verify voice cue and principle diagnosis without pre-game review
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.BROWSER_PATH,
              args: ['--no-sandbox', '--autoplay-policy=no-user-gesture-required'],
            });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.addInitScript(() => {
              window.__speechCalls = [];
              const voices = [{ name: 'Sonia Natural', lang: 'en-GB', voiceURI: 'sonia-natural', localService: true }];
              class TestUtterance {
                constructor(text) { this.text = text; this.voice = null; this.lang = ''; this.rate = 1; this.pitch = 1; this.volume = 1; this.onstart = null; this.onend = null; this.onerror = null; }
              }
              const synth = {
                speaking: false,
                getVoices: () => voices,
                addEventListener: () => {},
                resume() {},
                cancel() { this.speaking = false; },
                speak(utterance) {
                  window.__speechCalls.push({ text: utterance.text, volume: utterance.volume, voice: utterance.voice?.name || null });
                  this.speaking = true;
                  utterance.onstart?.();
                  setTimeout(() => { this.speaking = false; utterance.onend?.(); }, 80);
                },
              };
              Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
              Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
            });

            const page = await context.newPage();
            page.setDefaultTimeout(120000);
            const fatalErrors = [];
            page.on('pageerror', error => fatalErrors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Failed to load resource') && text.includes('404')) return;
              fatalErrors.push(`console: ${text}`);
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1');
            assert.strictEqual(await page.locator('#liveCoachVoice').count(), 1);

            const demo = await page.evaluate(() => window.__KMATE__.test.startLiveCoachPrincipleDemo());
            assert.strictEqual(demo.principleReview, false);
            assert.strictEqual(demo.voice, true);
            assert.strictEqual(demo.paused, false);

            await page.click('#board .sq[data-square="e2"]');
            await page.click('#board .sq[data-square="e4"]');
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.awaiting && window.__KMATE__.state().clockPaused);

            const injected = await page.evaluate(() => window.__KMATE__.test.forceLiveCoachIntervention());
            assert.ok(injected && injected.bestMove);
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.open);
            await page.waitForTimeout(850);

            const inspection = await page.evaluate(() => {
              const state = window.__KMATE__.state();
              const section = document.querySelector('#liveCoachPrinciples');
              const cards = [...document.querySelectorAll('#liveCoachPrincipleList .principle-diagnosis-card')];
              const spoken = window.__speechCalls.filter(call => call.text.trim().length > 0);
              return {
                principleReview: state.settings.principleReview,
                panelVisible: state.liveCoach.panelVisible,
                clockPaused: state.clockPaused,
                diagnosisCount: state.liveCoach.principleDiagnoses.length,
                sectionHidden: section.hidden,
                cards: cards.length,
                firstTitle: cards[0]?.querySelector('b')?.textContent?.trim() || '',
                firstEvidence: cards[0]?.querySelector('.principle-diagnosis-evidence')?.textContent?.trim() || '',
                headline: document.querySelector('#liveCoachPrincipleHeadline')?.textContent?.trim() || '',
                voiceToggle: document.querySelector('#liveCoachVoiceToggle')?.textContent?.trim() || '',
                audioStatus: document.querySelector('#liveCoachAudioStatus')?.textContent?.trim() || '',
                soundKind: state.sound.lastKind,
                spokenCount: spoken.length,
                spokenText: spoken.map(call => call.text).join(' '),
                noOverflow: document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1,
              };
            });

            assert.strictEqual(inspection.principleReview, false, inspection);
            assert.ok(inspection.panelVisible && inspection.clockPaused, inspection);
            assert.ok(!inspection.sectionHidden, inspection);
            assert.ok(inspection.diagnosisCount >= 1, inspection);
            assert.ok(inspection.cards >= 1, inspection);
            assert.ok(inspection.firstTitle.length > 5, inspection);
            assert.ok(inspection.firstEvidence.length > 25, inspection);
            assert.ok(inspection.headline.includes('likely lesson'), inspection);
            assert.ok(inspection.voiceToggle.includes('Voice on'), inspection);
            assert.strictEqual(inspection.soundKind, 'coach', inspection);
            assert.ok(inspection.spokenCount >= 1, inspection);
            assert.ok(inspection.spokenText.includes('Principle diagnosis'), inspection);
            assert.ok(inspection.noOverflow, inspection);

            const speechBeforeToggle = await page.evaluate(() => window.__speechCalls.filter(call => call.text.trim()).length);
            await page.click('#liveCoachVoiceToggle');
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.voiceEnabled === false);
            assert.ok((await page.locator('#liveCoachVoiceToggle').textContent()).includes('Voice off'));
            await page.click('#liveCoachVoiceToggle');
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.voiceEnabled === true);
            await page.waitForTimeout(250);
            const speechAfterToggle = await page.evaluate(() => window.__speechCalls.filter(call => call.text.trim()).length);
            assert.ok(speechAfterToggle > speechBeforeToggle, { speechBeforeToggle, speechAfterToggle });

            await page.click('#liveCoachSpeakButton');
            await page.waitForTimeout(160);
            const speechAfterManual = await page.evaluate(() => window.__speechCalls.filter(call => call.text.trim()).length);
            assert.ok(speechAfterManual > speechAfterToggle, { speechAfterToggle, speechAfterManual });

            await page.click('#liveCoachContinueButton');
            await page.waitForFunction(() => !window.__KMATE__.state().liveCoach.open && !window.__KMATE__.state().clockPaused);

            if (fatalErrors.length) throw new Error(fatalErrors.join('\n'));
            console.log(JSON.stringify({ ok: true, inspection, speechBeforeToggle, speechAfterToggle, speechAfterManual }, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit and publish K-Mate v31
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v31: speak Live Coach and diagnose principles'
          git push
