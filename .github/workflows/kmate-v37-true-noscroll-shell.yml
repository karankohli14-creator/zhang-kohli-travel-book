name: K-Mate v37 true no-scroll app shell
on:
  push:
    paths:
      - '.github/workflows/kmate-v37-true-noscroll-shell.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply fixed-screen app shell
        run: |
          python -m py_compile .github/scripts/kmate_v37_true_noscroll_shell.py
          python .github/scripts/kmate_v37_true_noscroll_shell.py
          rm -f .github/workflows/kmate-v36-paged-app-shell.yml

      - name: Validate assembled app
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts=[Path(f'kmate-trainer/app-v7-part{i}.txt').read_text() for i in range(1,7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0]=parts[0][:-2]
          Path('/tmp/kmate-v37.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v37.js
          grep -q "version: '37.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q 'kmate-fixed-app' kmate-trainer/app-v7-part6.txt
          grep -q 'position:fixed!important' kmate-trainer/styles-v7.css
          grep -q 'height:100dvh!important' kmate-trainer/styles-v7.css

      - name: Install Playwright and serve app
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v37-server.log 2>&1 &

      - name: Verify setup pages literally cannot document-scroll
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          async function verify(viewport) {
            const browser = await chromium.launch({headless:true, executablePath:process.env.BROWSER_PATH, args:['--no-sandbox']});
            const context = await browser.newContext({viewport});
            const page = await context.newPage();
            page.setDefaultTimeout(120000);
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'domcontentloaded'});
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1');
            await page.waitForFunction(() => window.__KMATE__?.state().setupFlow?.paged);

            async function inspect(label) {
              const info = await page.evaluate(() => {
                const visible = document.querySelector('.setup-flow-page:not([hidden])');
                const rect = visible.getBoundingClientRect();
                return {
                  page: document.body.dataset.setupPage,
                  rootClass: document.documentElement.classList.contains('kmate-fixed-app'),
                  bodyPosition: getComputedStyle(document.body).position,
                  bodyOverflow: getComputedStyle(document.body).overflow,
                  htmlOverflow: getComputedStyle(document.documentElement).overflow,
                  scrollY: window.scrollY,
                  docHeight: document.documentElement.scrollHeight,
                  bodyHeight: document.body.scrollHeight,
                  viewportH: window.innerHeight,
                  rect: {top:rect.top,bottom:rect.bottom,height:rect.height},
                  overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
                };
              });
              console.log(label, JSON.stringify(info));
              assert.ok(info.rootClass, info);
              assert.strictEqual(info.bodyPosition, 'fixed', info);
              assert.strictEqual(info.bodyOverflow, 'hidden', info);
              assert.strictEqual(info.htmlOverflow, 'hidden', info);
              assert.strictEqual(info.scrollY, 0, info);
              assert.ok(info.rect.top >= -1 && info.rect.bottom <= info.viewportH + 1, info);
              assert.ok(!info.overflow, info);
              return info;
            }

            await inspect('intro');
            await page.mouse.wheel(0, 1600);
            await page.waitForTimeout(80);
            await inspect('intro-after-wheel');

            await page.click('#introProceedButton');
            await inspect('challenge');
            await page.mouse.wheel(0, 1800);
            await page.waitForTimeout(80);
            await inspect('challenge-after-wheel');

            await page.click('#challengeNextButton');
            await inspect('coach');
            await page.mouse.wheel(0, 1800);
            await page.waitForTimeout(80);
            await inspect('coach-after-wheel');

            await page.waitForFunction(() => !document.querySelector('#startButton').disabled);
            await page.click('#startButton');
            await page.waitForFunction(() => document.body.classList.contains('game-mode'));
            const game = await page.evaluate(() => {
              const board=document.querySelector('#board').getBoundingClientRect();
              return {scrollY:window.scrollY,docHeight:document.documentElement.scrollHeight,viewportH:window.innerHeight,board:{top:board.top,bottom:board.bottom,width:board.width}};
            });
            assert.strictEqual(game.scrollY,0,game);
            assert.ok(game.docHeight <= game.viewportH+2,game);
            assert.ok(game.board.top >= 0 && game.board.bottom <= game.viewportH+1,game);
            await browser.close();
            return game;
          }

          (async()=>{
            const desktop=await verify({width:1440,height:900});
            const mobile=await verify({width:390,height:844});
            console.log(JSON.stringify({ok:true,desktop,mobile},null,2));
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE

      - name: Commit and publish v37
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v37: make onboarding and setup truly no-scroll'
          git pull --rebase origin main
          git push
