name: Deploy K-Mate restart v39

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-kmate-restart-v39.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-cache-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump the public K-Mate module URL
        run: |
          grep -q "const partUrls = \[1, 2, 3, 4, 5, 6, 7\]" kmate-trainer/app-v7.js
          grep -q "practice-restart-v39.js?v=39.0.0" kmate-trainer/app-v7.js
          sed -i 's#app-v7.js?v=38.0.0#app-v7.js?v=39.0.0#g' kmate-trainer/index.html
          grep -q "app-v7.js?v=39.0.0" kmate-trainer/index.html

      - name: Remove this one-time workflow and publish
        run: |
          git rm .github/workflows/deploy-kmate-restart-v39.yml
          git config user.name "K-Mate release bot"
          git config user.email "actions@users.noreply.github.com"
          git add kmate-trainer/index.html
          git commit -m "Deploy K-Mate practice restart v39"
          git push origin HEAD:main
