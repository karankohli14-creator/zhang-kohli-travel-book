name: Diagnose K-Mate v41 frozen coaching screen in WebKit
on:
  push:
    paths:
      - '.github/workflows/kmate-v41-webkit-freeze-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install playwright@1.55.0 --no-save --silent
          npx playwright install --with-deps webkit
      - name: Inspect the deployed coaching screen
        run: |
          node <<'NODE'
          const { webkit, devices } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await webkit.launch({ headless: true });
            const context = await browser.newContext({
              ...devices['iPhone 14'],
              viewport: { width: 390, height: 844 },
            });
            const page = await context.newPage();
            page.setDefaultTimeout(90000);
            const messages = [];
            page.on('console', m => messages.push(`${m.type()}: ${m.text()}`));
            page.on('pageerror', e => messages.push(`pageerror: ${e.stack || e.message}`));

            const url = 'https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/?v=20260830-41&webkitdiag=1';
            await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1' && window.__KMATE__?.state);
            await page.click('#introProceedButton');
            await page.click('#challengeNextButton');
            await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'coach');
            await page.waitForTimeout(800);

            const inspect = async label => page.evaluate(label => {
              const selectors = ['#coachBackButton', '#blindCalibration', '#autoHints', '#principleReview', '#liveCoach', '#liveCoachVoice', '#startButton'];
              const controls = {};
              for (const selector of selectors) {
                const el = document.querySelector(selector);
                const rect = el?.getBoundingClientRect();
                const x = rect ? rect.left + rect.width / 2 : 0;
                const y = rect ? rect.top + rect.height / 2 : 0;
                const hit = rect ? document.elementFromPoint(x, y) : null;
                const style = el ? getComputedStyle(el) : null;
                const ancestors = [];
                let node = hit;
                while (node && ancestors.length < 8) {
                  const s = getComputedStyle(node);
                  ancestors.push({
                    tag: node.tagName,
                    id: node.id,
                    cls: node.className,
                    pointerEvents: s.pointerEvents,
                    position: s.position,
                    zIndex: s.zIndex,
                    opacity: s.opacity,
                    display: s.display,
                    visibility: s.visibility,
                  });
                  node = node.parentElement;
                }
                controls[selector] = {
                  exists: Boolean(el),
                  disabled: Boolean(el?.disabled),
                  checked: 'checked' in (el || {}) ? el.checked : null,
                  rect: rect ? { left: rect.left, top: rect.top, right: rect.right, bottom: rect.bottom, width: rect.width, height: rect.height } : null,
                  style: style ? { pointerEvents: style.pointerEvents, position: style.position, zIndex: style.zIndex, opacity: style.opacity, display: style.display, visibility: style.visibility } : null,
                  hit: hit ? { tag: hit.tagName, id: hit.id, cls: hit.className } : null,
                  hitChain: ancestors,
                };
              }
              const dialogs = [...document.querySelectorAll('dialog')].map(d => ({ id: d.id, open: d.open, rect: d.getBoundingClientRect().toJSON?.() || {} }));
              const fixed = [...document.querySelectorAll('body *')].filter(el => {
                const s = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                return ['fixed', 'absolute'].includes(s.position) && r.width > innerWidth * .7 && r.height > innerHeight * .7 && s.display !== 'none' && s.visibility !== 'hidden' && Number(s.opacity) > 0;
              }).map(el => {
                const s = getComputedStyle(el); const r = el.getBoundingClientRect();
                return { tag: el.tagName, id: el.id, cls: el.className, pointerEvents: s.pointerEvents, position: s.position, zIndex: s.zIndex, rect: { left:r.left,top:r.top,right:r.right,bottom:r.bottom } };
              });
              return {
                label,
                state: window.__KMATE__.state(),
                controls,
                dialogs,
                fixed,
                bodyClasses: document.body.className,
                bodyDataset: { ...document.body.dataset },
                scrollY,
                scrollHeight: document.documentElement.scrollHeight,
                viewport: { width: innerWidth, height: innerHeight },
              };
            }, label);

            const before = await inspect('before clicks');
            console.log('BEFORE', JSON.stringify(before, null, 2));

            const originalChecks = await page.evaluate(() => ({
              blind: document.querySelector('#blindCalibration').checked,
              hints: document.querySelector('#autoHints').checked,
              principles: document.querySelector('#principleReview').checked,
              coach: document.querySelector('#liveCoach').checked,
              voice: document.querySelector('#liveCoachVoice').checked,
            }));

            const clickResults = {};
            for (const [name, selector] of Object.entries({
              blind: '#blindCalibration',
              hints: '#autoHints',
              principles: '#principleReview',
              coach: '#liveCoach',
              voice: '#liveCoachVoice',
            })) {
              try {
                await page.click(selector, { timeout: 10000 });
                clickResults[name] = { clicked: true, checked: await page.isChecked(selector) };
              } catch (error) {
                clickResults[name] = { clicked: false, error: error.message };
              }
            }

            try {
              await page.click('#coachBackButton', { timeout: 10000 });
              clickResults.back = { clicked: true, page: await page.evaluate(() => window.__KMATE__.state().setupFlow.page) };
            } catch (error) {
              clickResults.back = { clicked: false, error: error.message };
            }
            if ((await page.evaluate(() => window.__KMATE__.state().setupFlow.page)) !== 'coach') {
              await page.click('#challengeNextButton');
              await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'coach');
            }

            try {
              await page.click('#startButton', { timeout: 15000 });
              await page.waitForFunction(() => document.body.classList.contains('game-mode') || document.querySelector('#principlesDialog')?.open, null, { timeout: 30000 });
              clickResults.start = {
                clicked: true,
                gameMode: await page.evaluate(() => document.body.classList.contains('game-mode')),
                principlesOpen: await page.evaluate(() => Boolean(document.querySelector('#principlesDialog')?.open)),
                pieces: await page.locator('#board .piece').count(),
              };
            } catch (error) {
              clickResults.start = { clicked: false, error: error.message };
            }

            const after = await inspect('after clicks');
            console.log('ORIGINAL_CHECKS', JSON.stringify(originalChecks));
            console.log('CLICK_RESULTS', JSON.stringify(clickResults, null, 2));
            console.log('AFTER', JSON.stringify(after, null, 2));
            console.log('MESSAGES', JSON.stringify(messages, null, 2));

            assert.ok(clickResults.back.clicked, JSON.stringify(clickResults));
            assert.ok(clickResults.start.clicked, JSON.stringify(clickResults));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE