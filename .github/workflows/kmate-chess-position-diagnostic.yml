name: K-Mate Chess.com position diagnostic

on:
  push:
    branches: [kmate-chess-position-fix-v38]
    paths:
      - "kmate-trainer/**"
      - ".github/workflows/kmate-chess-position-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-live-games:
    name: Parse recent live Kmate_00 games
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install parser dependency
        run: npm install --no-save chess.js@1.4.0

      - name: Parse recent completed Chess.com games
        env:
          KMATE_CHESSCOM_USER: Kmate_00
        run: node kmate-trainer/tests/chesscom-parse-diagnostic.mjs

  live-browser-position:
    name: Render recent live Kmate_00 positions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser-test dependencies
        run: npm install --no-save @playwright/test@1.55.0 chess.js@1.4.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static K-Mate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kmate-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/kmate-trainer/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kmate-http.log
          exit 1

      - name: Select and render live Chess.com positions
        env:
          KMATE_APP_URL: http://127.0.0.1:4173/kmate-trainer/
        run: npx playwright test kmate-trainer/tests/chesscom-live-ui.spec.mjs --reporter=line

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmate-chess-position-diagnostic
          path: |
            test-results
            /tmp/kmate-http.log
          if-no-files-found: ignore
          retention-days: 7
