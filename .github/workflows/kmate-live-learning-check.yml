name: K-Mate live learning deployment check

on:
  push:
    branches: [main]
    paths:
      - "kmate-trainer/**"
      - ".github/workflows/kmate-live-learning-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmate-live-learning-check
  cancel-in-progress: true

jobs:
  verify-live-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the public GitHub Pages build
        env:
          LIVE_URL: https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/
        run: |
          for attempt in {1..72}; do
            html="$(curl --fail --silent --show-error --location --max-time 20 "${LIVE_URL}?deploy=${GITHUB_SHA}" || true)"
            if grep -Fq 'app-v7.js?v=41.0.0' <<<"$html"; then
              echo "The v41 public loader is live."
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment (${attempt}/72)…"
            sleep 5
          done
          echo "The public page did not expose the v41 loader in time."
          exit 1

      - name: Verify public relevance and learning assets
        env:
          LIVE_ROOT: https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer
        run: |
          curl --fail --silent --show-error --location "${LIVE_ROOT}/app-v7.js?v=41.0.0" | grep -Fq "learning-relevance-v41.js?v=41.0.0"
          curl --fail --silent --show-error --location "${LIVE_ROOT}/learning-relevance-v41.js?v=41.0.0" | grep -Fq "km41RecommendationEvidence"
          curl --fail --silent --show-error --location "${LIVE_ROOT}/learning-relevance-v41-stability.js?v=41.0.0" | grep -Fq "km41RepairRankedLessons"
          curl --fail --silent --show-error --location "${LIVE_ROOT}/learning-relevance-v41.css?v=41.0.0" | grep -Fq -- "--kmate-safe-top"
          curl --fail --silent --show-error --location "${LIVE_ROOT}/learning/puzzles/index.json?v=41.0.0" | grep -Fq '"total":11902'
          curl --fail --silent --show-error --location "${LIVE_ROOT}/learning/videos-v40.json?v=41.0.0" | grep -Fq '"videos"'

      - name: Install Chromium browser check
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise live move relevance, lesson choices, and phone-safe puzzles
        env:
          LIVE_URL: https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const seed = {
            version: 7,
            settings: {
              phase: 'middlegame', opening: 'all', positionRating: 1400,
              opponentRating: 1400, timeControl: '3+0', side: 'w', sound: false,
              trainingGoal: 'all', blindCalibration: false, autoHints: false,
              liveCoach: true, principleReview: false, coachVoice: false,
            },
            legacy: { sessions: 0, wins: 0, draws: 0, losses: 0, best: 0 },
            sessions: [{
              id: 'live-relevance-check',
              startedAt: '2026-09-10T16:00:00.000Z',
              endedAt: '2026-09-10T16:08:00.000Z',
              positionId: 'live-relevance', seedPositionId: 'live-relevance',
              title: 'Chess.com · Kmate_00 vs LiveCheck', opening: 'London System',
              theme: 'Live move relevance', tags: ['calculation'], phase: 'middlegame',
              positionRating: 1400, opponentRating: 1400, requestedOpponentRating: 1400,
              timeControl: '3+0', userColor: 'w', outcome: 'loss', reason: 'resignation',
              completed: true, timeUsedPct: 0.12, avgCpLoss: 260,
              userMoves: [{
                id: 'live-move-14', san: 'a3?', uci: 'a2a3', from: 'a2', to: 'a3',
                fenBefore: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 14',
                spentMs: 3200, cpLoss: 260, bestMove: 'e2e4', quality: 'blunder',
                principleDiagnoses: [{
                  key: 'loose-pieces', title: 'Loose pieces', confidence: 'high',
                  evidence: 'An undefended tactical target needed attention before committing to the move.',
                }],
                ignoredPrinciples: ['loose-pieces'],
              }],
            }],
          };

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          const pageErrors = [];
          page.on('pageerror', (error) => pageErrors.push(String(error?.stack || error)));
          await page.addInitScript((store) => {
            localStorage.setItem('kmate-position-v7', JSON.stringify(store));
            localStorage.removeItem('kmate-learning-v40');
          }, seed);

          await page.goto(`${process.env.LIVE_URL}?deploy=${process.env.GITHUB_SHA}`, {
            waitUntil: 'domcontentloaded',
            timeout: 90_000,
          });
          await page.waitForFunction(
            () => Boolean(
              window.__KMATE_LEARNING_LIBRARY__?.state?.().ready
              && window.__KMATE_RELEVANCE__?.state?.().ready
            ),
            undefined,
            { timeout: 90_000 },
          );

          const recommendation = await page.evaluate(() => window.__KMATE_RELEVANCE__.recommendation());
          if (recommendation.relevance?.mode !== 'move-level') {
            throw new Error(`Expected move-level relevance: ${JSON.stringify(recommendation.relevance)}`);
          }
          if (!recommendation.moveEvidence?.[0]?.moveLabel?.includes('14. a3')) {
            throw new Error(`Expected move 14.a3 evidence: ${JSON.stringify(recommendation.moveEvidence)}`);
          }
          if (recommendation.puzzlePlan?.length !== 5) {
            throw new Error(`Expected a five-slot puzzle plan: ${JSON.stringify(recommendation.puzzlePlan)}`);
          }

          const wizard = page.locator('#wizardLearningButton');
          await wizard.waitFor({ state: 'visible', timeout: 30_000 });
          await wizard.click();
          await page.locator('#km41RecommendationEvidence').waitFor({ state: 'visible', timeout: 30_000 });
          const evidenceText = (await page.locator('#km41RecommendationEvidence').textContent()) || '';
          if (!evidenceText.includes('14. a3')) throw new Error(`Move evidence missing: ${evidenceText}`);
          const categories = await page.locator('[data-library-focus-card]').count();
          if (categories !== 8) throw new Error(`Expected 8 open learning categories, found ${categories}.`);
          const ranked = await page.locator('#learningVideoCard .km41-lesson-row').count();
          if (ranked < 3) throw new Error(`Expected at least 3 move-ranked lessons, found ${ranked}.`);

          await page.locator('#learningWatchLesson').click();
          await page.locator('#km41LessonChoices').waitFor({ state: 'visible', timeout: 30_000 });
          if (await page.locator('#km41LessonPlayer').isVisible()) {
            throw new Error('A video opened before the player reviewed the ranked lesson list.');
          }
          const lessonText = (await page.locator('#km41LessonChoicesList').textContent()) || '';
          if (!lessonText.includes('14. a3')) throw new Error(`Lesson reasons are not tied to the move: ${lessonText}`);
          await page.locator('#km41LessonChoicesClose').click();

          await page.setViewportSize({ width: 390, height: 844 });
          await page.evaluate(() => {
            document.documentElement.style.setProperty('--kmate-safe-top', '47px');
            document.documentElement.style.setProperty('--kmate-safe-bottom', '34px');
          });
          await page.locator('#learningStartPuzzles').click();
          await page.locator('#km41PuzzleMode').waitFor({ state: 'visible', timeout: 45_000 });
          await page.locator('#km41PuzzleBoard .sq').first().waitFor({ state: 'visible', timeout: 45_000 });
          const squares = await page.locator('#km41PuzzleBoard .sq').count();
          const playerBars = await page.locator('#km41PuzzleMode .playerbar').count();
          if (squares !== 64 || playerBars !== 2) {
            throw new Error(`Unexpected game-style puzzle UI: ${squares} squares, ${playerBars} player bars.`);
          }
          const layout = await page.evaluate(() => {
            const mode = document.querySelector('#km41PuzzleMode').getBoundingClientRect();
            const board = document.querySelector('#km41PuzzleBoard').getBoundingClientRect();
            const instructionSize = Number.parseFloat(getComputedStyle(document.querySelector('#km41PuzzleInstruction')).fontSize);
            return { mode, board, instructionSize, viewportHeight: innerHeight };
          });
          if (layout.mode.top < 46 || layout.mode.bottom > layout.viewportHeight - 33) {
            throw new Error(`Puzzle mode crossed the phone safe area: ${JSON.stringify(layout.mode)}`);
          }
          if (layout.board.width < 350 || Math.abs(layout.board.width - layout.board.height) > 2) {
            throw new Error(`Puzzle board did not receive phone-priority space: ${JSON.stringify(layout.board)}`);
          }
          if (layout.instructionSize > 10) {
            throw new Error(`Phone instruction text is too large: ${layout.instructionSize}px`);
          }
          if (pageErrors.length) throw new Error(`Live page errors: ${pageErrors.join('\n')}`);

          console.log(JSON.stringify({
            status: 'pass',
            evidence: recommendation.moveEvidence[0].moveLabel,
            categories,
            rankedLessons: ranked,
            squares,
            playerBars,
            boardWidth: layout.board.width,
            safeTop: layout.mode.top,
            safeBottom: layout.viewportHeight - layout.mode.bottom,
          }, null, 2));
          await browser.close();
          NODE
