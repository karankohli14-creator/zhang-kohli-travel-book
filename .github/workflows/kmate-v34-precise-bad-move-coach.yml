name: K-Mate v34 precise bad-move coach
on:
  push:
    paths:
      - '.github/workflows/kmate-v34-precise-bad-move-coach.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply bad-move-only and concrete-coach changes
        run: |
          python -m py_compile .github/scripts/kmate_v34_precise_bad_move_coach.py
          python .github/scripts/kmate_v34_precise_bad_move_coach.py
          rm -f .github/workflows/kmate-v33-publish.yml
          rm -f .github/workflows/kmate-v33-fullscreen-mac-audio-r6.yml

      - name: Validate assembled application
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v34.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v34.js
          grep -q "version: '34.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q 'Live Coach after bad moves only' kmate-trainer/index.html
          grep -q 'id="liveCoachPlayedLine"' kmate-trainer/index.html
          grep -q 'function buildConcreteCoachAnalysis' kmate-trainer/app-v7-part1.txt
          grep -q 'silentGate: Boolean' kmate-trainer/app-v7-part6.txt
          grep -q 'selectedLine = await extendPrincipalVariation' kmate-trainer/app-v7-part1.txt
          grep -q 'live-coach-lines-grid' kmate-trainer/styles-v7.css
          ! grep -q 'renderLiveCoachPending(moveRecord)' kmate-trainer/app-v7-part1.txt

      - name: Install Playwright and serve K-Mate
        run: |
          npm install playwright@1.55.0 --no-save --silent
          BROWSER_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v34-server.log 2>&1 &

      - name: Verify no screen flash for good moves and precise bad-move coaching
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.BROWSER_PATH,
              args: ['--no-sandbox', '--autoplay-policy=no-user-gesture-required'],
            });
            const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
            await context.addInitScript(() => {
              const voices = [{ name: 'Serena Enhanced', lang: 'en-GB', voiceURI: 'serena-enhanced', localService: true }];
              class TestUtterance {
                constructor(text) { this.text = text; this.onstart = null; this.onend = null; this.onerror = null; }
              }
              const synth = {
                speaking: false,
                pending: false,
                getVoices: () => voices,
                addEventListener: () => {},
                resume() {},
                cancel() { this.speaking = false; },
                speak(u) { this.speaking = true; u.onstart?.(); setTimeout(() => { this.speaking = false; u.onend?.(); }, 25); },
              };
              Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
              Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
            });

            const page = await context.newPage();
            page.setDefaultTimeout(120000);
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.stack || error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Failed to load resource') && text.includes('404')) return;
              errors.push(`console: ${text}`);
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1');
            await page.waitForFunction(() => window.__KMATE__?.test && !document.querySelector('#startButton').disabled);

            // Good move: the analysis gate is silent and must not resize or replace the board.
            await page.evaluate(() => window.__KMATE__.test.startLiveCoachPrincipleDemo());
            await page.waitForFunction(() => document.body.classList.contains('game-mode'));
            const beforeGood = await page.evaluate(() => {
              const board = document.querySelector('#board').getBoundingClientRect();
              return { width: board.width, height: board.height, top: board.top, scrollY: window.scrollY };
            });
            await page.click('#board .sq[data-square="e2"]');
            await page.click('#board .sq[data-square="e4"]');
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.silentGate);
            const pendingGood = await page.evaluate(() => {
              const board = document.querySelector('#board').getBoundingClientRect();
              return {
                state: window.__KMATE__.state().liveCoach,
                panelHidden: document.querySelector('#liveCoachBoardPanel').hidden,
                activeLayout: document.querySelector('#gameView').classList.contains('live-coach-active'),
                arrows: document.querySelectorAll('#board .live-coach-board-arrows line').length,
                board: { width: board.width, height: board.height, top: board.top },
                clockPaused: window.__KMATE__.state().clockPaused,
                scrollY: window.scrollY,
              };
            });
            assert.ok(pendingGood.state.awaiting && pendingGood.state.silentGate, pendingGood);
            assert.ok(pendingGood.panelHidden, pendingGood);
            assert.ok(!pendingGood.activeLayout, pendingGood);
            assert.strictEqual(pendingGood.arrows, 0, pendingGood);
            assert.ok(!pendingGood.clockPaused, pendingGood);
            assert.ok(Math.abs(pendingGood.board.width - beforeGood.width) <= 2, { beforeGood, pendingGood });
            assert.ok(Math.abs(pendingGood.board.top - beforeGood.top) <= 2, { beforeGood, pendingGood });
            assert.strictEqual(pendingGood.scrollY, 0, pendingGood);

            const goodResult = await page.evaluate(() => window.__KMATE__.test.forceGoodMoveAnalysis());
            assert.strictEqual(goodResult.quality, 'excellent');
            await page.waitForFunction(() => !window.__KMATE__.state().liveCoach.awaiting);
            const afterGood = await page.evaluate(() => ({
              panelHidden: document.querySelector('#liveCoachBoardPanel').hidden,
              activeLayout: document.querySelector('#gameView').classList.contains('live-coach-active'),
              arrows: document.querySelectorAll('#board .live-coach-board-arrows line').length,
              scrollY: window.scrollY,
            }));
            assert.ok(afterGood.panelHidden, afterGood);
            assert.ok(!afterGood.activeLayout, afterGood);
            assert.strictEqual(afterGood.arrows, 0, afterGood);
            assert.strictEqual(afterGood.scrollY, 0, afterGood);

            // Concrete tactic: Kf3 allows Nxd4; Nxf5 removes the attacker.
            await page.evaluate(() => window.__KMATE__.test.startConcreteTacticDemo());
            await page.waitForFunction(() => window.__KMATE__.state().current === 'v34-concrete-tactic-demo');
            await page.click('#board .sq[data-square="e2"]');
            await page.click('#board .sq[data-square="f3"]');
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.silentGate);
            const beforeBadResult = await page.evaluate(() => ({
              hidden: document.querySelector('#liveCoachBoardPanel').hidden,
              active: document.querySelector('#gameView').classList.contains('live-coach-active'),
              paused: window.__KMATE__.state().clockPaused,
            }));
            assert.ok(beforeBadResult.hidden && !beforeBadResult.active && !beforeBadResult.paused, beforeBadResult);

            const badResult = await page.evaluate(() => window.__KMATE__.test.forceConcreteBadMoveAnalysis());
            assert.strictEqual(badResult.quality, 'blunder');
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.open && window.__KMATE__.state().clockPaused);
            await page.waitForSelector('#liveCoachBoardPanel:not([hidden])');
            await page.waitForTimeout(180);

            const review = await page.evaluate(() => {
              const board = document.querySelector('#board').getBoundingClientRect();
              const panel = document.querySelector('#liveCoachBoardPanel').getBoundingClientRect();
              return {
                why: document.querySelector('#liveCoachWhy').textContent.trim(),
                best: document.querySelector('#liveCoachBestText').textContent.trim(),
                playedLine: document.querySelector('#liveCoachPlayedLine').textContent.trim(),
                bestLine: document.querySelector('#liveCoachLine').textContent.trim(),
                principles: document.querySelector('#liveCoachPrincipleList').textContent.replace(/\s+/g, ' ').trim(),
                rating: document.querySelector('#liveCoachRating').textContent.trim(),
                arrows: document.querySelectorAll('#board .live-coach-board-arrows line').length,
                ratio: board.width / panel.width,
                board: { top: board.top, bottom: board.bottom, width: board.width },
                panel: { top: panel.top, bottom: panel.bottom, width: panel.width },
                viewportHeight: window.innerHeight,
                scrollY: window.scrollY,
              };
            });
            assert.strictEqual(review.rating, 'Blunder', review);
            assert.ok(review.why.includes('Nxd4'), review);
            assert.ok(review.why.includes('knight') && review.why.includes('D4'), review);
            assert.ok(review.best.includes('Nxf5'), review);
            assert.ok(review.best.includes('knight') && review.best.includes('F5'), review);
            assert.ok(review.playedLine.includes('Kf3') && review.playedLine.includes('Nxd4'), review);
            assert.ok(review.bestLine.includes('Nxf5'), review);
            assert.ok(review.principles.includes('Nxd4') && review.principles.includes('D4'), review);
            assert.ok(review.arrows >= 2, review);
            assert.ok(review.ratio >= 0.70 && review.ratio <= 1.10, review);
            assert.ok(review.board.top >= 0 && review.board.bottom <= review.viewportHeight + 1, review);
            assert.ok(review.panel.top >= 0 && review.panel.bottom <= review.viewportHeight + 1, review);
            assert.strictEqual(review.scrollY, 0, review);

            await page.click('#liveCoachContinueButton');
            await page.waitForFunction(() => !window.__KMATE__.state().liveCoach.open && !window.__KMATE__.state().clockPaused);
            const resumed = await page.evaluate(() => ({
              hidden: document.querySelector('#liveCoachBoardPanel').hidden,
              active: document.querySelector('#gameView').classList.contains('live-coach-active'),
              scrollY: window.scrollY,
            }));
            assert.ok(resumed.hidden && !resumed.active, resumed);
            assert.strictEqual(resumed.scrollY, 0, resumed);

            if (errors.length) throw new Error(errors.join('\n'));
            console.log(JSON.stringify({ ok: true, beforeGood, pendingGood, afterGood, badResult, review, resumed }, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Verify mobile bad-move-only layout
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await chromium.launch({ headless: true, executablePath: process.env.BROWSER_PATH, args: ['--no-sandbox'] });
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.addInitScript(() => {
              const voices = [{ name: 'Sonia Natural', lang: 'en-GB', voiceURI: 'sonia-natural', localService: true }];
              class TestUtterance { constructor(text) { this.text = text; this.onstart = null; this.onend = null; this.onerror = null; } }
              const synth = { speaking: false, getVoices: () => voices, addEventListener: () => {}, resume() {}, cancel() {}, speak(u) { u.onstart?.(); setTimeout(() => u.onend?.(), 20); } };
              Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
              Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
            });
            const page = await context.newPage();
            page.setDefaultTimeout(120000);
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1' && window.__KMATE__?.test);
            await page.evaluate(() => window.__KMATE__.test.startConcreteTacticDemo());
            await page.click('#board .sq[data-square="e2"]');
            await page.click('#board .sq[data-square="f3"]');
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.silentGate);
            let snapshot = await page.evaluate(() => ({
              panelHidden: document.querySelector('#liveCoachBoardPanel').hidden,
              active: document.querySelector('#gameView').classList.contains('live-coach-active'),
              scrollHeight: document.documentElement.scrollHeight,
              viewportHeight: window.innerHeight,
              scrollY: window.scrollY,
            }));
            assert.ok(snapshot.panelHidden && !snapshot.active, snapshot);
            assert.ok(snapshot.scrollHeight <= snapshot.viewportHeight + 2, snapshot);
            assert.strictEqual(snapshot.scrollY, 0, snapshot);

            await page.evaluate(() => window.__KMATE__.test.forceConcreteBadMoveAnalysis());
            await page.waitForFunction(() => window.__KMATE__.state().liveCoach.open);
            await page.waitForTimeout(180);
            snapshot = await page.evaluate(() => {
              const board = document.querySelector('#board').getBoundingClientRect();
              const panel = document.querySelector('#liveCoachBoardPanel').getBoundingClientRect();
              return {
                board: { top: board.top, bottom: board.bottom, height: board.height },
                panel: { top: panel.top, bottom: panel.bottom, height: panel.height },
                ratio: board.height / panel.height,
                playedLine: document.querySelector('#liveCoachPlayedLine').textContent,
                noHorizontalOverflow: document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1,
                scrollHeight: document.documentElement.scrollHeight,
                viewportHeight: window.innerHeight,
                scrollY: window.scrollY,
              };
            });
            assert.ok(snapshot.ratio >= 0.70 && snapshot.ratio <= 1.30, snapshot);
            assert.ok(snapshot.playedLine.includes('Nxd4'), snapshot);
            assert.ok(snapshot.noHorizontalOverflow, snapshot);
            assert.ok(snapshot.scrollHeight <= snapshot.viewportHeight + 2, snapshot);
            assert.strictEqual(snapshot.scrollY, 0, snapshot);
            console.log(JSON.stringify({ ok: true, snapshot }, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit and publish K-Mate v34
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v34: review only bad moves with concrete tactical explanations'
          git pull --rebase origin main
          git push
