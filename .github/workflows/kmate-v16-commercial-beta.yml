name: K-Mate v16 commercial beta
on:
  push:
    paths:
      - '.github/workflows/kmate-v16-commercial-beta.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply commercial beta upgrade
        run: python .github/scripts/kmate_v16_commercial_beta.py
      - name: Validate application JavaScript
        run: |
          node --check kmate-trainer/app-v7.js
          cat kmate-trainer/app-v7-part{1..6}.txt > /tmp/kmate-v16.js
          node --check /tmp/kmate-v16.js
      - name: Validate curated positions
        run: |
          npm install chess.js@1.4.0 --no-save --silent
          node --input-type=module <<'NODE'
          import { Chess } from 'chess.js';
          import { POSITIONS } from './kmate-trainer/positions-v7.js';
          const ids = new Set();
          for (const position of POSITIONS) {
            if (ids.has(position.id)) throw new Error(`Duplicate position id: ${position.id}`);
            ids.add(position.id);
            const game = new Chess(position.fen);
            if (game.isGameOver()) throw new Error(`Terminal training seed: ${position.id}`);
          }
          const london = POSITIONS.filter(p => p.opening === 'London System').length;
          const caro = POSITIONS.filter(p => p.opening === 'Caro-Kann').length;
          if (london < 8 || caro < 8) throw new Error(`Insufficient London/Caro seeds: ${london}/${caro}`);
          console.log(`Validated ${POSITIONS.length} positions; London ${london}; Caro-Kann ${caro}`);
          NODE
      - name: Validate commercial beta features
        run: |
          grep -q 'Adaptive training prescription' kmate-trainer/index.html
          grep -q 'Import FEN / PGN' kmate-trainer/index.html
          grep -q 'Blind Elo calibration' kmate-trainer/index.html
          grep -q 'Independent Stockfish 18 move review' kmate-trainer/app-v7-part1.txt
          grep -q 'trainingGoal' kmate-trainer/app-v7-part1.txt
          grep -q 'profileImportFile' kmate-trainer/index.html
          grep -q 'commercialBeta: true' kmate-trainer/app-v7-part1.txt
      - name: Commit commercial beta
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kmate-trainer/index.html kmate-trainer/styles-v7.css kmate-trainer/app-v7.js kmate-trainer/app-v7-part1.txt kmate-trainer/app-v7-part2.txt kmate-trainer/app-v7-part3.txt kmate-trainer/app-v7-part4.txt kmate-trainer/app-v7-part5.txt kmate-trainer/app-v7-part6.txt kmate-trainer/positions-v7.js
          git commit -m 'K-Mate v16: commercial beta foundation' || exit 0
          git push
