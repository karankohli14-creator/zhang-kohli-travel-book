name: K-Mate v35.4 scroll-free principles and summary-first review r2

on:
  push:
    paths:
      - '.github/workflows/kmate-v35-4-summary-first-r2.yml'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply K-Mate v35.4
        run: |
          python -m py_compile .github/scripts/kmate_v35_4_summary_first_patch.py
          python .github/scripts/kmate_v35_4_summary_first_patch.py
          python -m py_compile .github/scripts/kmate_v35_4_verify_reset_patch.py
          python .github/scripts/kmate_v35_4_verify_reset_patch.py

      - name: Validate the assembled application
        run: |
          node --check kmate-trainer/app-v7.js
          node --check kmate-trainer/appflow-v35.js
          node --check kmate-trainer/review-v35-4.js
          node --check .github/scripts/kmate_v35_4_verify.js
          cat kmate-trainer/app-v7-part{1,2,3,4,5,6}.txt > /tmp/kmate-v35-4-module.js
          node --check /tmp/kmate-v35-4-module.js
          grep -q "FLOW_VERSION = '35.4-summary-first'" kmate-trainer/appflow-v35.js
          grep -q "review-v35-4.js?v=35.4.0" kmate-trainer/index.html
          grep -q "key: 'mistake', label: 'Mistake'" kmate-trainer/app-v7-part1.txt
          grep -q "K-Mate v35.4 — scroll-free principles" kmate-trainer/styles-v7.css
          ! grep -q "review-v35-3.js" kmate-trainer/index.html

      - name: Install real Chromium and WebKit browsers
        run: |
          npm install playwright@1.55.0 --no-save --silent
          npx playwright install --with-deps chromium webkit

      - name: Verify desktop, phone, and short-phone layouts locally
        run: |
          python3 -m http.server 4173 --directory . >/tmp/kmate-v35-4-r2-server.log 2>&1 &
          node .github/scripts/kmate_v35_4_verify.js

      - name: Restore verifier and commit the verified app update
        run: |
          git restore .github/scripts/kmate_v35_4_verify.js
          rm -f kmate-trainer/review-v35-3.js
          rm -f .github/workflows/kmate-v35-3-principles-summary.yml
          rm -f .github/workflows/kmate-v35-3-principles-summary-r2.yml
          rm -f .github/workflows/kmate-v35-3-principles-summary-r3.yml
          rm -f .github/workflows/kmate-v35-3-principles-summary-r4.yml
          rm -f .github/workflows/kmate-v35-4-summary-first.yml
          rm -f .github/workflows/kmate-v35-4-summary-first-r2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v35.4: add scroll-free principles and summary-first coach review'
          git pull --rebase origin main
          git push

      - name: Wait for GitHub Pages to serve v35.4
        run: |
          for attempt in $(seq 1 110); do
            page="$(curl -fsSL "https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/?review=v35-4-$RANDOM" || true)"
            review="$(curl -fsSL "https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/review-v35-4.js?review=$RANDOM" || true)"
            flow="$(curl -fsSL "https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/appflow-v35.js?review=$RANDOM" || true)"
            if printf '%s' "$page" | grep -q "review-v35-4.js?v=35.4.0" \
              && printf '%s' "$review" | grep -q "35.4-summary-first" \
              && printf '%s' "$flow" | grep -q "35.4-summary-first"; then
              echo 'GitHub Pages is serving K-Mate v35.4.'
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for GitHub Pages v35.4.' >&2
          exit 1

      - name: Reapply isolated review reset for the public test
        run: python .github/scripts/kmate_v35_4_verify_reset_patch.py

      - name: Verify the deployed public app in phone WebKit
        env:
          KMATE_PUBLIC_URL: https://karankohli14-creator.github.io/zhang-kohli-travel-book/kmate-trainer/?review=v35-4-summary-first-public
        run: node .github/scripts/kmate_v35_4_verify.js
