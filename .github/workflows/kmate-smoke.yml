name: K-Mate smoke tests

on:
  push:
    branches: [main]
    paths:
      - "kmate-trainer/**"
      - ".github/workflows/kmate-smoke.yml"
  pull_request:
    paths:
      - "kmate-trainer/**"
      - ".github/workflows/kmate-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check kmate-trainer/app-v7.js
          node --check kmate-trainer/position-importers-v1.js
          node --check kmate-trainer/position-importers-hardening-v37.js
          node --check kmate-trainer/position-importers-chess-v38.js
          node --check kmate-trainer/practice-restart-v39.js
          node --check kmate-trainer/learning-v40.js
          node --check kmate-trainer/learning-library-v40.js
          cat kmate-trainer/app-v7-part{1..9}.txt > /tmp/kmate-app-v40.js
          node --check /tmp/kmate-app-v40.js
          cat kmate-trainer/learning-v40-part{1..5}.txt > /tmp/kmate-learning-v40.js
          node --check /tmp/kmate-learning-v40.js
          node --check kmate-trainer/tests/importers.spec.mjs
          node --check kmate-trainer/tests/chess-position-visibility.spec.mjs
          node --check kmate-trainer/tests/restart-practice.spec.mjs
          node --check kmate-trainer/tests/learning-v40.spec.mjs
          node --check kmate-trainer/tests/learning-library-v40.spec.mjs
          node --check kmate-trainer/tests/chesscom-live-contract.mjs

      - name: Validate learning catalogs
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const videos = JSON.parse(fs.readFileSync('kmate-trainer/learning/videos-v40.json', 'utf8'));
          if (videos.version !== 40 || videos.videos.length < 20) throw new Error('Video catalog is incomplete.');
          for (const video of videos.videos) {
            if (video.licenseClass !== 'externalEmbed') throw new Error(`Unexpected video license class: ${video.id}`);
            if (!video.sourceUrl.startsWith('https://lichess.org/video/')) throw new Error(`Missing Lichess source: ${video.id}`);
            if (!video.embedUrl.startsWith('https://www.youtube-nocookie.com/embed/')) throw new Error(`Unsafe embed URL: ${video.id}`);
          }
          const index = JSON.parse(fs.readFileSync('kmate-trainer/learning/puzzles/index.json', 'utf8'));
          if (index.license !== 'CC0-1.0' || index.total < 10000 || index.shards.length !== 56) {
            throw new Error('CC0 puzzle index failed validation.');
          }
          const focusKeys = new Set(index.shards.map((shard) => shard.focus));
          if (focusKeys.size !== 8) throw new Error(`Expected 8 open puzzle categories, found ${focusKeys.size}.`);
          NODE

      - name: Check feature wiring
        shell: bash
        run: |
          grep -Fq "const partUrls = [1, 2, 3, 4, 5, 6, 7, 8, 9]" kmate-trainer/app-v7.js
          grep -Fq "const partUrls = [1, 2, 3, 4, 5]" kmate-trainer/learning-v40.js
          grep -q "practice-restart-v39.js?v=39.0.0" kmate-trainer/app-v7.js
          grep -q "learning-v40.js?v=40.1.1" kmate-trainer/app-v7.js
          grep -q "learning-library-v40.js?v=40.1.1" kmate-trainer/app-v7.js
          grep -q "KMATE_RESTART_CORE_VERSION = '39.0.0'" kmate-trainer/app-v7-part7.txt
          grep -q "KM40_LEARNING_CORE_VERSION = '40.0.0'" kmate-trainer/app-v7-part8.txt
          grep -q "km40RecommendationSafe" kmate-trainer/app-v7-part9.txt
          grep -q "restartCurrentPractice" kmate-trainer/app-v7-part7.txt
          grep -q "restartPracticeButton" kmate-trainer/practice-restart-v39.js
          grep -q "resultRestartPractice" kmate-trainer/practice-restart-v39.js
          grep -q "learningNavButton" kmate-trainer/learning-v40-part2.txt
          grep -q "learningPuzzleDialog" kmate-trainer/learning-v40-part3.txt
          grep -q "wizardLearningButton" kmate-trainer/learning-v40-part5.txt
          grep -q "learningOpenLibrary" kmate-trainer/learning-library-v40.js
          grep -q "Tailored to this game" kmate-trainer/learning-library-v40.js
          grep -q "position-importers-v1.js?v=36.0.0" kmate-trainer/app-v7.js
          grep -q "position-importers-hardening-v37.js?v=37.0.0" kmate-trainer/app-v7.js
          grep -q "position-importers-chess-v38.js?v=38.0.0" kmate-trainer/app-v7.js
          grep -q "kmImportImagePanel" kmate-trainer/position-importers-v1.js
          grep -q "kmImportChessPanel" kmate-trainer/position-importers-v1.js
          grep -q "wizardImportPositionButton" kmate-trainer/position-importers-hardening-v37.js
          grep -q "wizardPositionImportButton" kmate-trainer/position-importers-hardening-v37.js
          grep -q "kmChessPositionNotice" kmate-trainer/position-importers-chess-v38.js
          grep -q "fenshot-MIT" <(find kmate-trainer/licenses -maxdepth 1 -type f -printf '%f\n')
