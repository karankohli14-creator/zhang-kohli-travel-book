name: Apply Stockfish calibration to K-Mate

on:
  push:
    paths:
      - .github/workflows/apply-stockfish-kmate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-kmate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply calibrated Stockfish integration
        shell: bash
        run: |
          set -euo pipefail
          test -f kmate-trainer/stockfish/stockfish-18-lite-single.js
          test -f kmate-trainer/stockfish/stockfish-18-lite-single.wasm
          git apply --check .github/patches/kmate-stockfish-v9.patch
          git apply .github/patches/kmate-stockfish-v9.patch

      - name: Validate K-Mate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          root = Path('kmate-trainer')
          parts = [(root / f'app-v7-part{i}.txt').read_text() for i in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-app-v9.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-app-v9.js
          python -m json.tool kmate-trainer/manifest-v7.webmanifest >/dev/null

      - name: Commit calibrated engine integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kmate-trainer/index.html \
                  kmate-trainer/app-v7.js \
                  kmate-trainer/app-v7-part2.txt \
                  kmate-trainer/app-v7-part3.txt \
                  kmate-trainer/app-v7-part4.txt \
                  kmate-trainer/app-v7-part6.txt \
                  kmate-trainer/manifest-v7.webmanifest
          git commit -m "Replace K-Mate opponent with calibrated Stockfish 18"
          git push
