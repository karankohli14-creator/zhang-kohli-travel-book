name: K-Mate v44 instant start with no native modals
on:
  push:
    paths:
      - '.github/workflows/kmate-v44-instant-start-no-native-modals.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply K-Mate v44
        run: |
          python -m py_compile .github/scripts/kmate_v44_instant_start_no_native_modals.py
          python .github/scripts/kmate_v44_instant_start_no_native_modals.py
          python -m py_compile .github/scripts/kmate_v44_timing_declarations.py
          python .github/scripts/kmate_v44_timing_declarations.py
          rm -f .github/workflows/kmate-v41-webkit-freeze-diagnostic.yml
          rm -f .github/workflows/kmate-v42-unfreeze-coaching-screen.yml
          rm -f .github/workflows/kmate-v43-nonblocking-position-start.yml
          rm -f .github/workflows/kmate-v41-public-smoke.yml
          rm -f .github/workflows/kmate-v41-resilient-position-start.yml

      - name: Validate assembled application
        run: |
          node --check kmate-trainer/app-v7.js
          python - <<'PY'
          from pathlib import Path
          parts = [Path(f'kmate-trainer/app-v7-part{number}.txt').read_text() for number in range(1, 7)]
          if parts[0].endswith('\n  }') and parts[1].startswith(' }\n'):
              parts[0] = parts[0][:-2]
          Path('/tmp/kmate-v44.js').write_text(''.join(parts))
          PY
          node --check /tmp/kmate-v44.js
          grep -q "version: '44.0-commercial-beta'" kmate-trainer/app-v7-part6.txt
          grep -q '<section id="principlesDialog"' kmate-trainer/index.html
          ! grep -q '<dialog id="principlesDialog"' kmate-trainer/index.html
          grep -q "function immediatePositionForPlay" kmate-trainer/app-v7-part1.txt
          grep -q "queuedCustomPosition = immediatePositionForPlay" kmate-trainer/app-v7-part1.txt
          grep -q "$('#startButton').onclick = handleGeneratePosition" kmate-trainer/app-v7-part1.txt
          grep -q "single-native-click" kmate-trainer/app-v7-part1.txt
          grep -q "function closeAllAppOverlays" kmate-trainer/app-v7-part1.txt
          grep -q "K-Mate v44" kmate-trainer/styles-v7.css

      - name: Install Chromium and WebKit
        run: |
          npm install playwright@1.55.0 --no-save --silent
          CHROMIUM_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$CHROMIUM_PATH"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
          npx playwright install --with-deps webkit
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v44-server.log 2>&1 &

      - name: Verify the exact frozen-screen path in Chromium and WebKit
        run: |
          timeout 150s node <<'NODE'
          const { chromium, webkit, devices } = require('playwright');
          const assert = require('assert');

          function installSpeechMock() {
            const voices = [{ name: 'Serena Enhanced', lang: 'en-GB', voiceURI: 'serena-enhanced', localService: true }];
            class TestUtterance { constructor(text) { this.text = text; this.onstart = null; this.onend = null; this.onerror = null; } }
            const synth = { speaking: false, getVoices: () => voices, addEventListener: () => {}, resume() {}, cancel() {}, speak(u) { u.onstart?.(); setTimeout(() => u.onend?.(), 10); } };
            Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: synth });
            Object.defineProperty(window, 'SpeechSynthesisUtterance', { configurable: true, value: TestUtterance });
          }

          async function launch(browserType, name, launchOptions = {}, mobile = false) {
            const browser = await browserType.launch({ headless: true, ...launchOptions });
            const context = await browser.newContext(mobile
              ? { ...devices['iPhone 14'], viewport: { width: 390, height: 844 } }
              : { viewport: { width: 1440, height: 900 } });
            await context.addInitScript(installSpeechMock);
            const page = await context.newPage();
            page.setDefaultTimeout(15000);
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.stack || error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (text.includes('Failed to load resource') && text.includes('404')) return;
              errors.push(`console: ${text}`);
            });
            await page.goto('http://127.0.0.1:4173/?v=44-test', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.ready === '1' && window.__KMATE__?.state);
            return { browser, context, page, errors, name };
          }

          async function goToFinalSetup(page, useTap = false) {
            const press = async selector => useTap ? page.tap(selector) : page.click(selector);
            await press('#introProceedButton');
            await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'challenge');
            await press('#challengeNextButton');
            await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'coach');
            return press;
          }

          async function inspectControl(page, selector) {
            return page.evaluate(selector => {
              const element = document.querySelector(selector);
              const rect = element?.getBoundingClientRect();
              const hit = rect ? document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2) : null;
              return {
                exists: Boolean(element),
                visible: Boolean(rect && rect.width > 0 && rect.height > 0),
                disabled: Boolean(element?.disabled),
                ownsHit: Boolean(element && hit && (element === hit || element.contains(hit) || hit.contains(element))),
                hit: hit ? `${hit.tagName}#${hit.id}.${hit.className}` : null,
                pointerEvents: element ? getComputedStyle(element).pointerEvents : null,
                inert: Boolean(element?.inert || element?.closest?.('[inert]')),
              };
            }, selector);
          }

          async function assertFinalPageLive(page, name, press) {
            const selectors = ['#coachBackButton', '#blindCalibration', '#autoHints', '#principleReview', '#liveCoach', '#liveCoachVoice', '#startButton'];
            const report = {};
            for (const selector of selectors) {
              report[selector] = await inspectControl(page, selector);
              assert.ok(report[selector].exists && report[selector].visible, `${name}: missing ${selector}: ${JSON.stringify(report)}`);
              assert.ok(report[selector].ownsHit, `${name}: ${selector} covered by ${report[selector].hit}`);
              assert.ok(!report[selector].disabled, `${name}: ${selector} disabled`);
              assert.ok(!report[selector].inert, `${name}: ${selector} inert`);
              assert.strictEqual(report[selector].pointerEvents, 'auto', `${name}: ${selector} pointer-events`);
            }

            const initial = await page.isChecked('#principleReview');
            await press('#principleReview');
            assert.notStrictEqual(await page.isChecked('#principleReview'), initial, `${name}: principles did not toggle`);
            await press('#principleReview');
            assert.strictEqual(await page.isChecked('#principleReview'), initial, `${name}: principles did not toggle back`);

            const coachInitial = await page.isChecked('#liveCoach');
            await press('#liveCoach');
            assert.notStrictEqual(await page.isChecked('#liveCoach'), coachInitial, `${name}: Live Coach did not toggle`);
            await press('#liveCoach');

            await press('#coachBackButton');
            await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'challenge');
            await press('#challengeNextButton');
            await page.waitForFunction(() => window.__KMATE__.state().setupFlow.page === 'coach');
            return report;
          }

          async function chromiumScenario() {
            const env = await launch(chromium, 'Chromium', { executablePath: process.env.CHROMIUM_PATH, args: ['--no-sandbox'] }, false);
            try {
              const press = await goToFinalSetup(env.page, false);
              const controls = await assertFinalPageLive(env.page, env.name, press);
              await env.page.evaluate(() => { document.querySelector('#principleReview').checked = false; });
              const start = Date.now();
              await press('#startButton');
              await env.page.waitForFunction(() => document.body.classList.contains('game-mode') && document.querySelectorAll('#board .piece').length >= 2, null, { timeout: 4000 });
              const elapsed = Date.now() - start;
              const state = await env.page.evaluate(() => ({
                gameMode: document.body.classList.contains('game-mode'),
                pieces: document.querySelectorAll('#board .piece').length,
                start: window.__KMATE__.state().start,
                overlays: [...document.querySelectorAll('.modal[open], #principlesDialog[open]')].map(el => el.id),
              }));
              assert.ok(elapsed < 2500, `Chromium start took ${elapsed} ms`);
              assert.ok(state.gameMode && state.pieces >= 2, JSON.stringify(state));
              assert.ok((state.start.durationMs ?? 0) < 1000, JSON.stringify(state.start));
              assert.ok((state.start.generationDurationMs ?? 0) < 100, JSON.stringify(state.start));
              assert.deepStrictEqual(state.overlays, [], JSON.stringify(state));
              if (env.errors.length) throw new Error(env.errors.join('\n'));
              return { controls, elapsed, state };
            } finally {
              await env.context.close();
              await env.browser.close();
            }
          }

          async function webkitScenario() {
            const env = await launch(webkit, 'WebKit', {}, true);
            try {
              const press = await goToFinalSetup(env.page, true);
              const controls = await assertFinalPageLive(env.page, env.name, press);
              await env.page.evaluate(() => { document.querySelector('#principleReview').checked = true; });
              const start = Date.now();
              await press('#startButton');
              await env.page.waitForFunction(() => document.body.classList.contains('game-mode') && document.querySelector('#principlesDialog')?.hasAttribute('open'), null, { timeout: 4000 });
              const elapsed = Date.now() - start;
              const principle = await env.page.evaluate(() => {
                const screen = document.querySelector('#principlesDialog');
                const rect = screen.getBoundingClientRect();
                const button = document.querySelector('#principlesStartButton');
                const br = button.getBoundingClientRect();
                const hit = document.elementFromPoint(br.left + br.width / 2, br.top + br.height / 2);
                return {
                  tag: screen.tagName,
                  open: screen.hasAttribute('open'),
                  hidden: screen.hidden,
                  modalDialogs: (() => { try { return document.querySelectorAll('dialog:modal').length; } catch { return 0; } })(),
                  rect: { width: rect.width, height: rect.height },
                  startOwnsHit: Boolean(hit && (hit === button || button.contains(hit) || hit.contains(button))),
                  pieces: document.querySelectorAll('#board .piece').length,
                  timing: window.__KMATE__.state().start,
                };
              });
              assert.ok(elapsed < 2500, `WebKit start took ${elapsed} ms`);
              assert.strictEqual(principle.tag, 'SECTION', JSON.stringify(principle));
              assert.ok(principle.open && !principle.hidden, JSON.stringify(principle));
              assert.strictEqual(principle.modalDialogs, 0, JSON.stringify(principle));
              assert.ok(principle.rect.width >= 380 && principle.rect.height >= 700, JSON.stringify(principle));
              assert.ok(principle.startOwnsHit, JSON.stringify(principle));
              assert.ok(principle.pieces >= 2, JSON.stringify(principle));
              assert.ok((principle.timing.durationMs ?? 0) < 1000, JSON.stringify(principle.timing));

              await press('#principlesStartButton');
              await env.page.waitForFunction(() => !document.querySelector('#principlesDialog')?.hasAttribute('open') && !window.__KMATE__.state().clockPaused, null, { timeout: 4000 });
              if (env.errors.length) throw new Error(env.errors.join('\n'));
              return { controls, elapsed, principle };
            } finally {
              await env.context.close();
              await env.browser.close();
            }
          }

          Promise.race([
            (async () => {
              const chromium = await chromiumScenario();
              const webkit = await webkitScenario();
              console.log(JSON.stringify({ ok: true, chromium, webkit }, null, 2));
            })(),
            new Promise((_, reject) => setTimeout(() => reject(new Error('v44 browser verification exceeded 120 seconds')), 120000)),
          ]).catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit and publish K-Mate v44
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kmate-trainer .github/workflows
          git commit -m 'K-Mate v44: remove native modal freeze and open positions instantly'
          git pull --rebase origin main
          git push
