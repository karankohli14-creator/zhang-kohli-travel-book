name: K-Mate v56 controls and coach QA

on:
  push:
    branches: [main]
    paths:
      - "kmate-trainer/unified-button-sound-v55.js"
      - "kmate-trainer/top-controls-v56.js"
      - "kmate-trainer/top-controls-v56.css"
      - "kmate-trainer/coach-layout-v55.js"
      - "kmate-trainer/coach-layout-v55.css"
      - "kmate-trainer/mobile-game-ux-v48.js"
      - "kmate-trainer/appflow-v35.js"
      - "kmate-trainer/review-v35-4.js"
      - "kmate-trainer/app-v7.js"
      - "kmate-trainer/index.html"
      - "kmate-trainer/tests/top-controls-v56.spec.mjs"
      - "kmate-trainer/tests/coach-layout-v55.spec.mjs"
      - "kmate-trainer/tests/mobile-full-page-v50.spec.mjs"
      - "kmate-trainer/tests/mobile-game-ux-v48.spec.mjs"
      - ".github/workflows/kmate-coach-ux-v55.yml"
  pull_request:
    paths:
      - "kmate-trainer/unified-button-sound-v55.js"
      - "kmate-trainer/top-controls-v56.js"
      - "kmate-trainer/top-controls-v56.css"
      - "kmate-trainer/coach-layout-v55.js"
      - "kmate-trainer/coach-layout-v55.css"
      - "kmate-trainer/mobile-game-ux-v48.js"
      - "kmate-trainer/appflow-v35.js"
      - "kmate-trainer/review-v35-4.js"
      - "kmate-trainer/app-v7.js"
      - "kmate-trainer/index.html"
      - "kmate-trainer/tests/top-controls-v56.spec.mjs"
      - "kmate-trainer/tests/coach-layout-v55.spec.mjs"
      - "kmate-trainer/tests/mobile-full-page-v50.spec.mjs"
      - "kmate-trainer/tests/mobile-game-ux-v48.spec.mjs"
      - ".github/workflows/kmate-coach-ux-v55.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls-coach-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate v56 source wiring
        run: |
          node --check kmate-trainer/unified-button-sound-v55.js
          node --check kmate-trainer/top-controls-v56.js
          node --check kmate-trainer/coach-layout-v55.js
          node --check kmate-trainer/mobile-game-ux-v48.js
          node --check kmate-trainer/appflow-v35.js
          node --check kmate-trainer/review-v35-4.js
          node --check kmate-trainer/app-v7.js
          node --check kmate-trainer/tests/top-controls-v56.spec.mjs
          node --check kmate-trainer/tests/coach-layout-v55.spec.mjs
          node --check kmate-trainer/tests/mobile-full-page-v50.spec.mjs
          node --check kmate-trainer/tests/mobile-game-ux-v48.spec.mjs
          grep -Fq "unified-button-sound-v55.js?v=56.0.0" kmate-trainer/app-v7.js
          grep -Fq "top-controls-v56.js?v=56.0.0" kmate-trainer/app-v7.js
          grep -Fq "coach-layout-v55.js?v=55.0.0" kmate-trainer/app-v7.js
          grep -Fq "KMATE_UNIFIED_BUTTON_SOUND_V55 = '56.0.0'" kmate-trainer/unified-button-sound-v55.js
          grep -Fq "original-soft-button" kmate-trainer/unified-button-sound-v55.js
          grep -Fq "oscillator: 'sine'" kmate-trainer/unified-button-sound-v55.js
          grep -Fq "KMATE_TOP_CONTROLS_V56 = '56.0.0'" kmate-trainer/top-controls-v56.js
          grep -Fq "km56SetPanelOpen" kmate-trainer/top-controls-v56.js
          grep -Fq "km56SetVoiceEnabled" kmate-trainer/top-controls-v56.js
          grep -Fq "KMATE_AUTOMATIC_READY_SPEECH_V56" kmate-trainer/top-controls-v56.js
          grep -Fq "KMATE_PLAY_READY_SPEECH_V56" kmate-trainer/top-controls-v56.js
          grep -Fq "body.game-mode.game-panel-open .sidepanel" kmate-trainer/top-controls-v56.css
          grep -Fq "kmate-unified-button-sound-v55" kmate-trainer/mobile-game-ux-v48.js
          grep -Fq "kmate-unified-button-sound-v55" kmate-trainer/appflow-v35.js
          grep -Fq "kmate-unified-button-sound-v55" kmate-trainer/review-v35-4.js
          ! grep -Fq "event.stopImmediatePropagation()" kmate-trainer/unified-button-sound-v55.js
          grep -Fq "app-v7.js?v=56.0.0" kmate-trainer/index.html

      - name: Install browser dependencies
        run: npm install --no-save @playwright/test@1.55.0 chess.js@1.4.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static K-Mate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kmate-v56-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/kmate-trainer/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kmate-v56-http.log
          exit 1

      - name: Test soft button audio, working menu, silent voice toggle, coaching, hints, and board controls
        env:
          KMATE_APP_URL: http://127.0.0.1:4173/kmate-trainer/?nativeBoard=1
        run: >-
          npx playwright test
          kmate-trainer/tests/top-controls-v56.spec.mjs
          kmate-trainer/tests/coach-layout-v55.spec.mjs
          kmate-trainer/tests/mobile-full-page-v50.spec.mjs
          kmate-trainer/tests/mobile-game-ux-v48.spec.mjs
          --grep-invert "every non-board button uses one Generate-and-start tap|play-page menu and coach-audio buttons receive pointer events"
          --workers=1
          --reporter=line

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmate-controls-v56-failure
          path: |
            test-results
            /tmp/kmate-v56-http.log
          if-no-files-found: ignore
          retention-days: 7
