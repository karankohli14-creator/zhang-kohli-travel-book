name: K-Mate v53 full-page reference board QA

on:
  push:
    branches: [main]
    paths:
      - "kmate-trainer/mobile-full-page-v50.js"
      - "kmate-trainer/mobile-full-page-v50.css"
      - "kmate-trainer/sculpted-pieces-v47.js"
      - "kmate-trainer/reference-board-v52.css"
      - "kmate-trainer/reference-board-fit-v53.css"
      - "kmate-trainer/app-v7.js"
      - "kmate-trainer/index.html"
      - "kmate-trainer/tests/mobile-full-page-v50.spec.mjs"
      - "kmate-trainer/tests/mobile-board-fit-v53.spec.mjs"
      - ".github/workflows/kmate-mobile-full-page-v50.yml"
  pull_request:
    paths:
      - "kmate-trainer/mobile-full-page-v50.js"
      - "kmate-trainer/mobile-full-page-v50.css"
      - "kmate-trainer/sculpted-pieces-v47.js"
      - "kmate-trainer/reference-board-v52.css"
      - "kmate-trainer/reference-board-fit-v53.css"
      - "kmate-trainer/app-v7.js"
      - "kmate-trainer/index.html"
      - "kmate-trainer/tests/mobile-full-page-v50.spec.mjs"
      - "kmate-trainer/tests/mobile-board-fit-v53.spec.mjs"
      - ".github/workflows/kmate-mobile-full-page-v50.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate full-page v50, reference-theme v52, and fit v53 wiring
        run: |
          node --check kmate-trainer/mobile-full-page-v50.js
          node --check kmate-trainer/sculpted-pieces-v47.js
          node --check kmate-trainer/app-v7.js
          node --check kmate-trainer/tests/mobile-full-page-v50.spec.mjs
          node --check kmate-trainer/tests/mobile-board-fit-v53.spec.mjs
          grep -Fq "mobile-full-page-v50.js?v=50.0.0" kmate-trainer/app-v7.js
          grep -Fq "sculpted-pieces-v47.js?v=52.0.0" kmate-trainer/app-v7.js
          grep -Fq "app-v7.js?v=53.0.0" kmate-trainer/index.html
          grep -Fq "reference-board-fit-v53.css?v=53.0.0" kmate-trainer/index.html
          grep -Fq "KMATE_MOBILE_FULL_PAGE_V50 = '50.0.0'" kmate-trainer/mobile-full-page-v50.js
          grep -Fq "KMATE_REFERENCE_THEME_V52 = '52.0.0'" kmate-trainer/sculpted-pieces-v47.js
          grep -Fq "kmate-reference-piece-v52" kmate-trainer/sculpted-pieces-v47.js
          grep -Fq "#d55236" kmate-trainer/reference-board-v52.css
          grep -Fq "#d3cebd" kmate-trainer/reference-board-v52.css
          grep -Fq "#758e72" kmate-trainer/reference-board-v52.css
          grep -Fq "body.game-mode .live-boardwrap" kmate-trainer/reference-board-v52.css
          grep -Fq -- "--km53-board-gutter" kmate-trainer/reference-board-fit-v53.css
          grep -Fq "#kmateHintEdgeButton" kmate-trainer/mobile-full-page-v50.css

      - name: Install browser dependencies
        run: npm install --no-save @playwright/test@1.55.0 chess.js@1.4.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static K-Mate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kmate-v53-full-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/kmate-trainer/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kmate-v53-full-http.log
          exit 1

      - name: Test full-page layout, on-demand hints, fullscreen, and contained reference theme
        env:
          KMATE_APP_URL: http://127.0.0.1:4173/kmate-trainer/?nativeBoard=1
        run: >-
          npx playwright test
          kmate-trainer/tests/mobile-full-page-v50.spec.mjs
          kmate-trainer/tests/mobile-board-fit-v53.spec.mjs
          --workers=1
          --reporter=line

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmate-full-page-reference-v53-failure
          path: |
            test-results
            /tmp/kmate-v53-full-http.log
          if-no-files-found: ignore
          retention-days: 7
