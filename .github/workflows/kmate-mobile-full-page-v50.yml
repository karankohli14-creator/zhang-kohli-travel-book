name: K-Mate v50 full-page game QA

on:
  push:
    branches: [main]
    paths:
      - "kmate-trainer/mobile-full-page-v50.js"
      - "kmate-trainer/mobile-full-page-v50.css"
      - "kmate-trainer/sculpted-pieces-v47.js"
      - "kmate-trainer/app-v7.js"
      - "kmate-trainer/index.html"
      - "kmate-trainer/tests/mobile-full-page-v50.spec.mjs"
      - ".github/workflows/kmate-mobile-full-page-v50.yml"
  pull_request:
    paths:
      - "kmate-trainer/mobile-full-page-v50.js"
      - "kmate-trainer/mobile-full-page-v50.css"
      - "kmate-trainer/sculpted-pieces-v47.js"
      - "kmate-trainer/app-v7.js"
      - "kmate-trainer/index.html"
      - "kmate-trainer/tests/mobile-full-page-v50.spec.mjs"
      - ".github/workflows/kmate-mobile-full-page-v50.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate v50 layout and v51 piece wiring
        run: |
          node --check kmate-trainer/mobile-full-page-v50.js
          node --check kmate-trainer/sculpted-pieces-v47.js
          node --check kmate-trainer/app-v7.js
          node --check kmate-trainer/tests/mobile-full-page-v50.spec.mjs
          grep -Fq "mobile-full-page-v50.js?v=50.0.0" kmate-trainer/app-v7.js
          grep -Fq "sculpted-pieces-v47.js?v=51.0.0" kmate-trainer/app-v7.js
          ! grep -Fq "mobile-board-focus-v49.js?v=49.0.0" kmate-trainer/app-v7.js
          grep -Fq "app-v7.js?v=50.0.0" kmate-trainer/index.html
          grep -Fq "KMATE_MOBILE_FULL_PAGE_V50 = '50.0.0'" kmate-trainer/mobile-full-page-v50.js
          grep -Fq "KMATE_EFFECTIVE_MOVE_GAIN_V50 = 0.10" kmate-trainer/mobile-full-page-v50.js
          grep -Fq "SIMPLE_PIECES_VERSION = '51.0.0'" kmate-trainer/sculpted-pieces-v47.js
          grep -Fq "flat-reference-silhouette" kmate-trainer/sculpted-pieces-v47.js
          grep -Fq "kmate-simple-piece-v51" kmate-trainer/sculpted-pieces-v47.js
          grep -Fq "km50-hint-open" kmate-trainer/mobile-full-page-v50.css
          grep -Fq "#kmateHintEdgeButton" kmate-trainer/mobile-full-page-v50.css
          grep -Fq "#f8f8e8" kmate-trainer/mobile-full-page-v50.css
          grep -Fq "#8bb768" kmate-trainer/mobile-full-page-v50.css

      - name: Install browser dependencies
        run: npm install --no-save @playwright/test@1.55.0 chess.js@1.4.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static K-Mate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kmate-v50-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/kmate-trainer/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kmate-v50-http.log
          exit 1

      - name: Test full-page layout, on-demand hints, candidate reveal, and simple pieces
        env:
          KMATE_APP_URL: http://127.0.0.1:4173/kmate-trainer/?nativeBoard=1
        run: >-
          npx playwright test
          kmate-trainer/tests/mobile-full-page-v50.spec.mjs
          --workers=1
          --reporter=line

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmate-mobile-full-page-v50-failure
          path: |
            test-results
            /tmp/kmate-v50-http.log
          if-no-files-found: ignore
          retention-days: 7
