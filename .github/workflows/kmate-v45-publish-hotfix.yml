name: Publish and verify K-Mate v45 setup repair

on:
  push:
    paths:
      - '.github/workflows/kmate-v45-publish-hotfix.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Force fresh K-Mate v45 resources
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('kmate-trainer/index.html')
          index = index_path.read_text()
          index, style_count = re.subn(r'styles-v7\.css\?v=[^"\']+', 'styles-v7.css?v=45.0.1', index, count=1)
          index, app_count = re.subn(r'app-v7\.js\?v=[^"\']+', 'app-v7.js?v=45.0.1', index, count=1)
          if style_count != 1 or app_count != 1:
              raise SystemExit(f'Could not update index resource versions: styles={style_count}, app={app_count}')
          index_path.write_text(index)

          loader_path = Path('kmate-trainer/app-v7.js')
          loader = loader_path.read_text()
          loader = re.sub(r'positions-v7\.js\?v=[^\'"`]+', 'positions-v7.js?v=45.0.1', loader)
          loader = re.sub(r'app-v7-part\$\{number\}\.txt\?v=[^\'"`]+', 'app-v7-part${number}.txt?v=45.0.1', loader)
          loader = re.sub(r'hotfix-v45\.js\?v=[^\'"`]+', 'hotfix-v45.js?v=45.0.1', loader)
          loader_path.write_text(loader)
          PY

      - name: Validate JavaScript
        run: |
          node --check kmate-trainer/app-v7.js
          node --check kmate-trainer/hotfix-v45.js
          grep -q 'app-v7.js?v=45.0.1' kmate-trainer/index.html
          grep -q 'hotfix-v45.js?v=45.0.1' kmate-trainer/app-v7.js

      - name: Install lightweight browser driver
        run: |
          npm install playwright-core@1.55.0 --no-save --silent
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --directory kmate-trainer >/tmp/kmate-v45-server.log 2>&1 &

      - name: Verify the exact frozen final-screen path
        run: |
          node <<'NODE'
          const assert = require('assert');
          const { chromium } = require('playwright-core');

          async function runScenario(browser, name, options) {
            const context = await browser.newContext(options);
            const page = await context.newPage();
            page.setDefaultTimeout(15000);
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.stack || error.message}`));
            page.on('console', message => {
              if (message.type() !== 'error') return;
              const text = message.text();
              if (/favicon|404|Failed to load resource/i.test(text)) return;
              errors.push(`console: ${text}`);
            });

            await page.goto('http://127.0.0.1:4173/?v=45-smoke', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => window.__KMATE__?.state && window.__KMATE_V45_HOTFIX__?.version);

            const press = options.hasTouch
              ? async selector => page.tap(selector)
              : async selector => page.click(selector);

            await press('#introProceedButton');
            await page.waitForFunction(() => document.body.dataset.setupPage === 'challenge');
            await press('#challengeNextButton');
            await page.waitForFunction(() => document.body.dataset.setupPage === 'coach');
            await page.waitForTimeout(650);

            const selectors = ['#coachBackButton', '#blindCalibration', '#autoHints', '#principleReview', '#liveCoach', '#liveCoachVoice', '#startButton'];
            const report = await page.evaluate(selectors => Object.fromEntries(selectors.map(selector => {
              const element = document.querySelector(selector);
              const rect = element?.getBoundingClientRect();
              const hit = rect ? document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2) : null;
              return [selector, {
                visible: Boolean(rect && rect.width > 0 && rect.height > 0),
                disabled: Boolean(element?.disabled),
                inert: Boolean(element?.inert || element?.closest?.('[inert]')),
                ownsHit: Boolean(element && hit && (element === hit || element.contains(hit) || hit.contains(element))),
                hit: hit ? `${hit.tagName}#${hit.id}.${hit.className}` : null,
              }];
            })), selectors);

            for (const selector of selectors) {
              assert.ok(report[selector].visible, `${name}: ${selector} is not visible`);
              assert.ok(!report[selector].disabled, `${name}: ${selector} is disabled`);
              assert.ok(!report[selector].inert, `${name}: ${selector} is inert`);
              assert.ok(report[selector].ownsHit, `${name}: ${selector} is covered by ${report[selector].hit}`);
            }

            const initialPrinciples = await page.isChecked('#principleReview');
            await press('#principleReview');
            assert.notStrictEqual(await page.isChecked('#principleReview'), initialPrinciples, `${name}: principles did not toggle`);
            await press('#principleReview');
            assert.strictEqual(await page.isChecked('#principleReview'), initialPrinciples, `${name}: principles did not toggle back`);

            const initialCoach = await page.isChecked('#liveCoach');
            await press('#liveCoach');
            assert.notStrictEqual(await page.isChecked('#liveCoach'), initialCoach, `${name}: Live Coach did not toggle`);

            await press('#coachBackButton');
            await page.waitForFunction(() => document.body.dataset.setupPage === 'challenge');
            await press('#challengeNextButton');
            await page.waitForFunction(() => document.body.dataset.setupPage === 'coach');
            await page.waitForTimeout(300);

            if (await page.isChecked('#principleReview')) await press('#principleReview');
            const startedAt = Date.now();
            await press('#startButton');
            await page.waitForFunction(() => document.body.classList.contains('game-mode') && document.querySelectorAll('#board .piece').length >= 2, null, { timeout: 12000 });
            const elapsedMs = Date.now() - startedAt;
            assert.ok(elapsedMs < 12000, `${name}: position took too long to open: ${elapsedMs} ms`);

            const finalState = await page.evaluate(() => ({
              hotfix: window.__KMATE_V45_HOTFIX__?.version,
              gameMode: document.body.classList.contains('game-mode'),
              pieces: document.querySelectorAll('#board .piece').length,
              scrollY: window.scrollY,
            }));
            assert.ok(finalState.gameMode && finalState.pieces >= 2, `${name}: game did not open`);
            assert.strictEqual(finalState.hotfix, '45.0.1', `${name}: wrong hotfix version`);
            if (errors.length) throw new Error(`${name}: ${errors.join('\n')}`);
            console.log(JSON.stringify({ name, elapsedMs, report, finalState }, null, 2));
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({
              executablePath: process.env.CHROME_PATH,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            try {
              await runScenario(browser, 'desktop', { viewport: { width: 1440, height: 900 } });
              await runScenario(browser, 'mobile touch', {
                viewport: { width: 390, height: 844 },
                isMobile: true,
                hasTouch: true,
                deviceScaleFactor: 3,
                userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148',
              });
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish verified files
        run: |
          rm -f .github/workflows/kmate-v45-publish-hotfix.yml
          git config user.name 'karankohli14-creator'
          git config user.email 'karankohli14@gmail.com'
          git add kmate-trainer/index.html kmate-trainer/app-v7.js kmate-trainer/hotfix-v45.js .github/workflows/kmate-v45-publish-hotfix.yml
          git commit -m 'Publish verified K-Mate v45 setup repair'
          git push
