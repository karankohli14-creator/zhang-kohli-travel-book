<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f3b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Travel Book">
<link rel="manifest" href="manifest.webmanifest">
<title>Zhang-Kohli Family Travel Book</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1f281e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.app{height:100%;width:100%;display:flex;flex-direction:column}
.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:rgba(22,28,21,.96);gap:8px;z-index:5}
.controls{display:flex;align-items:center;gap:7px}
button,select{border:0;border-radius:999px;padding:9px 12px;font-weight:700;background:#f7f2e8;color:#24301f}
.status{font-size:13px;opacity:.9;white-space:nowrap}
.viewer{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(135deg,#786f60,#34402f)}
.pagebox{position:relative;height:min(calc(100vh - 74px),calc(100vw * 1.3333));width:min(calc((100vh - 74px) * .75),100vw);overflow:hidden;background:#faf7ef;box-shadow:0 10px 45px rgba(0,0,0,.45)}
.sprite{position:absolute;left:0;top:0;width:100%;height:calc(var(--count) * 100%);transform:translateY(calc(-1 * var(--offset) * 100% / var(--count)));will-change:transform}
.tapzone{position:absolute;top:0;bottom:0;width:40%;z-index:3} .left{left:0} .right{right:0}
.progress{height:4px;background:rgba(255,255,255,.15)} .bar{height:100%;width:0;background:#e7dfc7;transition:width .2s}
.overlay{position:fixed;inset:0;background:rgba(18,23,17,.92);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
.card{background:#fbf7ee;color:#283125;border-radius:20px;padding:28px;max-width:420px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.5)}
.card h1{font-family:Georgia,serif;font-weight:400;margin:0 0 10px;font-size:34px}
.card p{line-height:1.45;margin:0 0 18px}
.card button{background:#5d6f4a;color:#fff;padding:12px 18px}
@media(max-width:600px){.topbar{height:54px;padding:6px} button,select{padding:8px 10px;font-size:12px} .status{font-size:12px} .pagebox{height:min(calc(100vh - 70px),calc(100vw * 1.3333));width:min(calc((100vh - 70px)*.75),100vw)}}
</style>
</head>
<body>
<div class="overlay" id="overlay"><div class="card">
<h1>Zhang-Kohli Travel Book</h1>
<p>Tap to begin. The book will advance automatically every 2 seconds with music. You can pause, swipe, or tap the sides at any time.</p>
<button id="begin">Begin journey</button>
</div></div>
<div class="app">
<div class="topbar">
  <div class="controls"><button id="prev">←</button><button id="auto">Auto: On</button><select id="speed"><option value="2000" selected>2s</option><option value="3000">3s</option><option value="4000">4s</option><option value="6000">6s</option></select></div>
  <div class="status" id="status">Page 1 / 82</div>
  <div class="controls"><button id="music">Music: On</button><button id="next">→</button></div>
</div>
<div class="viewer" id="viewer">
  <div class="pagebox" id="pagebox"><img id="sprite" class="sprite" alt="Travel book page"><div class="tapzone left" id="tapPrev"></div><div class="tapzone right" id="tapNext"></div></div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<audio id="bgm" src="music.mp3" preload="auto" loop></audio>
</div>
<script>
const sheets=[{"file": "pages_01.jpg", "count": 10}, {"file": "pages_02.jpg", "count": 10}, {"file": "pages_03.jpg", "count": 10}, {"file": "pages_04.jpg", "count": 10}, {"file": "pages_05.jpg", "count": 10}, {"file": "pages_06.jpg", "count": 10}, {"file": "pages_07.jpg", "count": 10}, {"file": "pages_08.jpg", "count": 10}, {"file": "pages_09.jpg", "count": 2}];
const total=82;
let page=0, autoOn=true, timer=null;
const sprite=document.getElementById('sprite'), status=document.getElementById('status'), bar=document.getElementById('bar');
const bgm=document.getElementById('bgm');

function locate(p){
  let base=0;
  for(let i=0;i<sheets.length;i++){
    const c=sheets[i].count;
    if(p < base+c) return {sheet:i,offset:p-base,count:c};
    base+=c;
  }
  return {sheet:sheets.length-1,offset:sheets.at(-1).count-1,count:sheets.at(-1).count};
}
function render(){
  const x=locate(page);
  const src=sheets[x.sheet].file;
  if(!sprite.src.endsWith(src)) sprite.src=src;
  sprite.style.setProperty('--count',x.count);
  sprite.style.setProperty('--offset',x.offset);
  status.textContent=`Page ${page+1} / ${total}`;
  bar.style.width=`${((page+1)/total)*100}%`;
  document.getElementById('prev').disabled=page===0;
  document.getElementById('next').disabled=page===total-1;
}
function schedule(){
  if(timer) clearTimeout(timer);
  if(!autoOn || page>=total-1) return;
  timer=setTimeout(()=>{page++;render();schedule();}, Number(document.getElementById('speed').value));
}
function go(delta){
  page=Math.max(0,Math.min(total-1,page+delta));render();schedule();
}
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.getElementById('tapPrev').onclick=()=>go(-1);
document.getElementById('tapNext').onclick=()=>go(1);
document.getElementById('auto').onclick=()=>{
  autoOn=!autoOn;document.getElementById('auto').textContent=autoOn?'Auto: On':'Auto: Off';schedule();
};
document.getElementById('speed').onchange=schedule;
document.getElementById('music').onclick=async()=>{
  if(bgm.paused){await bgm.play();document.getElementById('music').textContent='Music: On';}
  else{bgm.pause();document.getElementById('music').textContent='Music: Off';}
};
document.getElementById('begin').onclick=async()=>{
  document.getElementById('overlay').style.display='none';
  try{bgm.volume=.28;await bgm.play();}catch(e){document.getElementById('music').textContent='Music: Off';}
  schedule();
};
let sx=null;
document.getElementById('pagebox').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.getElementById('pagebox').addEventListener('touchend',e=>{
  if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;
  if(dx<-45)go(1); else if(dx>45)go(-1); sx=null;
},{passive:true});
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key===' '){e.preventDefault();document.getElementById('auto').click();}});
render();
</script>
</body></html>
