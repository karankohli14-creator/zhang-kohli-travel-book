<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zhang-Kohli Travel Book</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#111}#wrap{position:fixed;inset:0}#controls{position:fixed;z-index:10;left:50%;bottom:12px;transform:translateX(-50%)}button{border:0;border-radius:999px;padding:10px 14px;font-weight:700}</style></head><body><div id="wrap"><iframe id="book" src="The_Kohli_Family_Journal_Travel_Journal_v8%20(1).html" allow="autoplay"></iframe></div><div id="controls"><button id="auto">Auto: On</button></div><script>let on=true,t=null;const f=document.getElementById('book');function tick(){clearTimeout(t);if(!on)return;t=setTimeout(()=>{try{const d=f.contentDocument;const n=d.getElementById('next');if(n&&!n.disabled)n.click();else{const r=d.getElementById('right');if(r)r.click();}}catch(e){}tick();},2000)}f.addEventListener('load',tick);document.getElementById('auto').onclick=()=>{on=!on;document.getElementById('auto').textContent=on?'Auto: On':'Auto: Off';tick()};</script></body></html>
