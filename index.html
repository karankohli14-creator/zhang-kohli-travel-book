<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263225"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Travel Book"><title>Zhang-Kohli Travel Book</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#20291f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.bar{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 7px;background:#192018;overflow-x:auto;white-space:nowrap}.bar button,.bar select{border:0;border-radius:999px;padding:8px 10px;font-weight:700;background:#f5efe4;color:#263225}.status{font-size:12px;opacity:.9;margin-left:auto}.viewer{flex:1;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#726b5f,#354231);overflow:hidden}.page{position:relative;width:min(100vw,calc((100vh - 72px)*.75));height:min(calc(100vh - 72px),calc(100vw*1.333333));background:#faf7ef;overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.45)}#sprite{position:absolute;left:0;top:0;width:100%;height:auto;display:block}.tap{position:absolute;top:0;bottom:0;width:35%;z-index:4}.tap.left{left:0}.tap.right{right:0}.progress{height:4px;background:rgba(255,255,255,.15)}#prog{height:100%;background:#e8dfc8;width:0;transition:width .15s}.overlay{position:fixed;inset:0;z-index:10;background:rgba(18,23,17,.94);display:flex;align-items:center;justify-content:center;padding:24px}.card{max-width:420px;background:#faf6ed;color:#283225;border-radius:22px;padding:28px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.5)}.card h1{font-family:Georgia,serif;font-weight:400;font-size:34px;margin:0 0 10px}.card p{line-height:1.45}.card button{border:0;border-radius:999px;padding:13px 19px;font-weight:800;background:#5b6d48;color:#fff}.err{position:absolute;inset:20px;display:none;align-items:center;justify-content:center;text-align:center;color:#5c5c55;padding:20px;font-size:14px}@media(max-width:650px){.bar{gap:4px}.bar button,.bar select{font-size:11px;padding:7px 9px}.status{font-size:11px}}</style></head><body><div class="overlay" id="overlay"><div class="card"><h1>Zhang-Kohli Travel Book</h1><p>Tap once to start the music and the 2-second slideshow. Sierra comes first, then Boston & New York.</p><button id="begin">Begin journey</button></div></div><div class="app"><div class="bar"><button id="prev">←</button><button id="sierra">Sierra</button><button id="boston">Boston–NY</button><button id="auto">Auto: On</button><select id="speed"><option value="2000" selected>2s</option><option value="3000">3s</option><option value="4000">4s</option><option value="6000">6s</option></select><button id="music">Music: On</button><button id="next">→</button><span class="status" id="status">Sierra · 1/82</span></div><div class="viewer"><div class="page" id="page"><img id="sprite" alt="Travel journal page"><div class="err" id="err">This page image did not load. Tap Next to continue.</div><div class="tap left" id="tapPrev"></div><div class="tap right" id="tapNext"></div></div></div><div class="progress"><div id="prog"></div></div></div><audio id="bgm" preload="auto" playsinline loop src="https://raw.githubusercontent.com/karankohli14-creator/zhang-kohli-travel-book/main/music.mp3?v=20260907"></audio><script>const ROOT='https://raw.githubusercontent.com/karankohli14-creator/zhang-kohli-travel-book/main/';const sheets=[10,10,10,10,10,10,10,10,2];const total=82;let page=0,autoOn=true,timer=null;const img=document.getElementById('sprite'),box=document.getElementById('page'),status=document.getElementById('status'),prog=document.getElementById('prog'),err=document.getElementById('err'),bgm=document.getElementById('bgm');function loc(p){let base=0;for(let i=0;i<sheets.length;i++){if(p<base+sheets[i])return{sheet:i,offset:p-base,count:sheets[i]};base+=sheets[i]}return{sheet:8,offset:1,count:2}}function sheetUrl(i){return ROOT+'pages_'+String(i+1).padStart(2,'0')+'.jpg?v=20260907'}function render(){const x=loc(page);const want=sheetUrl(x.sheet);err.style.display='none';if(img.dataset.src!==want){img.dataset.src=want;img.onload=()=>{err.style.display='none';position(x)};img.onerror=()=>{err.style.display='flex'};img.src=want}else position(x);const trip=page<40?'Sierra':'Boston & New York';status.textContent=trip+' · '+(page+1)+'/82';prog.style.width=((page+1)/82*100)+'%';document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===81;const nextSheet=x.sheet+1;if(nextSheet<sheets.length){const pre=new Image();pre.src=sheetUrl(nextSheet)}}function position(x){requestAnimationFrame(()=>{img.style.top=(-x.offset*box.clientHeight)+'px'})}function schedule(){if(timer)clearTimeout(timer);if(!autoOn)return;timer=setTimeout(()=>{page=(page+1)%total;render();schedule()},Number(document.getElementById('speed').value))}function go(d){page=Math.max(0,Math.min(81,page+d));render();schedule()}document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.getElementById('tapPrev').onclick=()=>go(-1);document.getElementById('tapNext').onclick=()=>go(1);document.getElementById('sierra').onclick=()=>{page=0;render();schedule()};document.getElementById('boston').onclick=()=>{page=40;render();schedule()};document.getElementById('auto').onclick=()=>{autoOn=!autoOn;document.getElementById('auto').textContent=autoOn?'Auto: On':'Auto: Off';schedule()};document.getElementById('speed').onchange=schedule;async function startMusic(){try{bgm.muted=false;bgm.volume=.35;await bgm.play();document.getElementById('music').textContent='Music: On'}catch(e){document.getElementById('music').textContent='Tap Music'}}document.getElementById('music').onclick=async()=>{if(bgm.paused)await startMusic();else{bgm.pause();document.getElementById('music').textContent='Music: Off'}};document.getElementById('begin').onclick=()=>{startMusic();document.getElementById('overlay').style.display='none';render();schedule()};let sx=null;box.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});box.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(dx<-45)go(1);else if(dx>45)go(-1);sx=null},{passive:true});window.addEventListener('resize',render);window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});render();</script></body></html>
